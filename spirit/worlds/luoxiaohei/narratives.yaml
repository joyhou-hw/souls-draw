          - id: iy_ci_02
            text: 你在霓虹照不到的墙角看见它，影子缩成小小的一团。
          - id: iy_ci_03
            text: 小妖靠着消防栓，血顺着铁管往下滴成一条细线。
          - id: iy_ci_04
            text: 你绕过晚归的人群，在那条背街里听见了低低的呜咽。
