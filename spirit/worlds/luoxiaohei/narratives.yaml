    fallback:
      - id: stcd_f_01
        text: 你谈成一桩大买卖，对方签字时手都在抖。
      - id: stcd_f_02
        text: 你在{place}的货栈里与人周旋半日，总算敲定了价。
      - id: stcd_f_03
        text: 一单大生意落袋，你把算盘拨得噼啪响。
