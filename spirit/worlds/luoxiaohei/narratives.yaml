        variants:
          - id: iy_gl_01
            text: 会馆领地的石阶下，一只小妖倒在门房外，门房灯都没亮。
          - id: iy_gl_02
            text: 你在会馆的库房后头发现它，怕人瞧见，又不敢声张。
          - id: iy_gl_03
            text: 小妖拖着伤往会馆爬了几步，留下一道浅浅的血痕。
          - id: iy_gl_04
            text: 它认得你的会馆腰牌，眼里却更慌了，直往后挪。
          - id: iy_gl_05
            text: 领地的巡夜人快过来了，你把那团身子往暗处带了带。
          - id: iy_gl_06
            text: 它在会馆的金鱼池边晕过去，池水被染红了一小片。
          - id: iy_gl_07
            text: 会馆的钟声里，你听出夹着几声憋回去的痛呼。
          - id: iy_gl_08
            text: 小妖的伤口被会馆门槛的铜皮又磕开一道，血珠直冒。
      - when:
