  scene_mutual_aid_elder:
    fallback:
      - id: smae_f_01
        text: 老妖把一盏心灯传给你，火光颤了颤，终于稳稳地落。
      - id: smae_f_02
        text: 你在{place}的洞府里听老妖讲半生所悟，如饮甘泉。
