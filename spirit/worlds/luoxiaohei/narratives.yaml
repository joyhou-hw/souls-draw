      - id: sga_f_01
        text: 你在会馆里跟着师傅打熬筋骨，木桩被你敲得发亮。
      - id: sga_f_02
        text: 学徒的晨课很早，你哈着白气站桩，直到日头起来。
      - id: sga_f_03
        text: 你替会馆抄了一整日名册，手腕酸得抬不起来。
      - id: sga_f_04
