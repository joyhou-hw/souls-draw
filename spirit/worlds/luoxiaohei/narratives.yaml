            text: 你在回廊里追自己的影子，追到墙根，影子却不见了。
          - id: sfy_gl_03
            text: 领地的老厨师给你塞了块糖，甜得你绕着院子跑了一圈。
          - id: sfy_gl_04
            text: 你坐在会馆的台阶上数门钉，数来数去总少一颗。
          - id: sfy_gl_05
            text: 同伴教你翻墙出去摘果子，回来时衣襟鼓鼓囊囊。
          - id: sfy_gl_06
            text: 会馆的钟响过三声，你还在后院的草堆里不肯出来。
