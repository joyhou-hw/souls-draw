      - id: stcd_f_08
        text: 大买卖成了，你在{place}摆了一桌，请众人吃酒。

  scene_trade_elder:
    fallback:
      - id: stce_f_01
        text: 商团掌柜要退隐，把半生的门路都交代给你。
      - id: stce_f_02
        text: 老掌柜把账房的钥匙交到你手上，你掂出了分量。
      - id: stce_f_03
        text: 你在{place}的商号里送别老掌柜，众人皆敬你一杯。
      - id: stce_f_04
        text: 老掌柜退隐前，把你拉到一边，讲了几桩要命的忌讳。
      - id: stce_f_05
