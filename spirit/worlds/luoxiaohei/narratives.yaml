        text: 你在{place}的旧祠前听了一夜更鼓，像听前朝的回声。
      - id: drr_f_10
        text: 那老者说你的血脉里有些东西，旁人学不来。
      - id: drr_f_11
        text: 旧朝的冠服一一摆开，你在其间认出了自己的影子。
      - id: drr_f_12
        text: 供奉把你领到残碑前，碑上的字被雨磨去了大半。
    buckets:
      - when:
          era: ancient
        variants:
          - id: drr_an_01
            text: 前朝的宫灯已熄了多年，老者却在{place}为你点起一盏。
          - id: drr_an_02
            text: 你在{place}的旧驿道上听老者讲那朝覆灭的旧事。
          - id: drr_an_03
            text: 残存的门阀在{place}的荒祠里相认，皆是一身旧衣。
          - id: drr_an_04
            text: 老者在{place}的断墙下展开一幅旧朝舆图，指尖点住你的来处。
          - id: drr_an_05
            text: 你随老者在{place}的旧都遗址前焚了半炷香。
          - id: drr_an_06
            text: 前朝的铜钱在老者袖里叮当，像一段没说完的年号。
      - when:
          era: modern
        variants:
          - id: drr_mo_01
            text: 旧朝供奉在{place}的旧仓库里等你，门牌早已锈了。
          - id: drr_mo_02
            text: 你在{place}的老宅里见着残卷，被塑料膜裹得严实。
          - id: drr_mo_03
            text: 老者用手机翻出旧朝的谱系，指给你看自己的名字。
          - id: drr_mo_04
            text: 旧朝的残徽被锁在{place}的保险柜里，取出来还带着凉。
          - id: drr_mo_05
            text: 你在{place}的旧城区听老者念一段前朝的家训。
          - id: drr_mo_06
            text: 残存遗脉在{place}的茶室里低声议事，外头车水马龙。

  lixi_deprived:
    fallback:
      - id: ldp_f_01
        text: 暗处伸来一只手，把你的灵质生生抽走一截。
      - id: ldp_f_02
        text: 你醒来时浑身发冷，像有什么被从骨缝里拔走了。
      - id: ldp_f_03
        text: 夺灵者绕着你念了一夜，你的灵质便薄了几分。
      - id: ldp_f_04
        text: 你在{place}的暗巷里被暗算，醒来只记得一阵剧痛。
      - id: ldp_f_05
        text: 你种的灵草一夜枯了，你也跟着蔫了半条命。
      - id: ldp_f_06
        text: 有什么咬住你的灵质不松口，扯走时你连声音都发不出。
      - id: ldp_f_07
        text: 你跌坐在{place}的地上，掌心那点微光一点点黯淡。
      - id: ldp_f_08
        text: 夺灵者得手后散去，你像被抽空的口袋，瘫在原地。
      - id: ldp_f_09
        text: 你本命里那点灵质被割去，疼得你几日都直不起腰。
      - id: ldp_f_10
        text: 冷意从心口漫到指尖，你知道，自己被人夺了灵。

  predator_abyss:
    prompt: 夺灵让力量来得容易，也让你越陷越深。继续沉沦，还是悬崖勒马？
    fallback:
      - id: pda_f_01
        text: 夺灵得来的力量在血脉里叫嚣，催着你再出手。
      - id: pda_f_02
        text: 你看着自己的手，那上面已染了别人的灵质。
      - id: pda_f_03
        text: 夜里有个声音在你耳边低语，说下一个就在{place}。
      - id: pda_f_04
        text: 你越夺越轻车熟路，心也跟着一点点变硬。
      - id: pda_f_05
        text: 有人在你面前跪下求饶，你却在掂量他的灵质。
      - id: pda_f_06
        text: 你照见{place}水面里的自己，眼里已没了从前的光。
      - id: pda_f_07
        text: 夺灵是条下坡路，你走得太快，停也停不住。
      - id: pda_f_08
        text: 你收起爪牙的一瞬，心底又冒起一阵焦渴。
      - id: pda_f_09
        text: 曾经的同伴看你时，眼里多了几分躲闪。
      - id: pda_f_10
        text: 你在岔口站住，一边是更深的渊，一边是难还的债。
    buckets:
      - when:
          era: ancient
        variants:
          - id: pda_an_01
            text: 你在{place}的荒山里设下陷阱，等着落单的妖。
          - id: pda_an_02
            text: 夺灵者结成的暗会在{place}招揽你，许你更多血食。
          - id: pda_an_03
            text: 你在{place}的古道上劫了一道灵，心口却愈发空。
          - id: pda_an_04
            text: 山门里的同道开始传言，说{place}出了个专夺人灵的邪修。
          - id: pda_an_05
            text: 你在{place}的乱葬岗里打坐，四周阴气都往你身上聚。
          - id: pda_an_06
            text: 有人把一纸缉凶令贴到{place}的城头，画的正是你的轮廓。
      - when:
          era: modern
        variants:
          - id: pda_mo_01
            text: 你在{place}的废弃厂房里练着夺灵，灯管明灭不定。
          - id: pda_mo_02
            text: 有人在{place}的论坛里挂出你的照片，说你害人。
          - id: pda_mo_03
            text: 你在{place}的天台截住目标，霓虹把影子拉得又冷又长。
          - id: pda_mo_04
            text: 夺灵的黑市在{place}向你报价，一次比一次高。
          - id: pda_mo_05
            text: 你在{place}的地下通道里被巡夜的人追了三条街。
          - id: pda_mo_06
            text: 手机的来电一个接一个，你却只听见血管里的焦渴。

  scene_folk_mutual_market:
    fallback:
      - id: sfmm_f_01
        text: 街坊互市上，你帮衬着搬货、算账，也赚了份情面。
      - id: sfmm_f_02
        text: 你把自己晒的干货摆上街坊的摊，邻里都来捧场。
      - id: sfmm_f_03
        text: 街坊会的小市集里，你替老人挑担，替孩子看摊。
      - id: sfmm_f_04
        text: 你在{place}的巷市里与人换货，各取所需，皆有笑颜。
      - id: sfmm_f_05
        text: 你得了街坊的帮衬，也把自家的余粮分了出去。
      - id: sfmm_f_06
        text: 街坊会的秤最公道，你在那儿做了一日公平人。
      - id: sfmm_f_07
        text: 你在{place}的街市里叫卖，喉咙都喊出了调子。
      - id: sfmm_f_08
        text: 一笔小买卖做下来，你的荷包鼓了，心也热了。

