            text: 你在{place}的旧仓库里摆开祭台，电闸都替你暗着。
          - id: srmr_mo_02
            text: 遗脉们在{place}的老宅里压低声音行祭，生怕惊动四邻。
          - id: srmr_mo_03
            text: 你用投影仪投出旧朝的纹样，香火与冷光交叠。
          - id: srmr_mo_04
            text: 残祀在{place}的顶楼悄悄进行，城市的霓虹在外头明灭。

  scene_remnant_archive:
    fallback:
      - id: srma_f_01
        text: 你守着王朝的残卷，一页页修补，像缝补旧朝的伤口。
      - id: srma_f_02
        text: 你在{place}的暗室里誊抄旧典，笔尖不敢有一丝抖。
      - id: srma_f_03
        text: 一卷散佚的国史被你重新编次，字里行间都是前尘。
      - id: srma_f_04
        text: 你读着残卷，读到故国的旧事，久久没有翻页。
      - id: srma_f_05
        text: 残卷里记着你的先祖，你一笔笔描着，像描自己的根。
      - id: srma_f_06
        text: 你从虫蛀的书页里救出半句遗训，如获至宝。
      - id: srma_f_07
        text: 守护残卷的日子，你在{place}的灯下熬白了几根发。
      - id: srma_f_08
        text: 有人想毁掉这批旧典，你以身护住，分毫不让。

  scene_remnant_elder:
    fallback:
      - id: srme_f_01
        text: 遗脉的长辈把前朝旧史一段段讲给你，听得你眼眶发热。
      - id: srme_f_02
        text: 老供奉把毕生所记的口传史都托给了你。
      - id: srme_f_03
        text: 你在{place}的旧祠里听长辈讲那朝兴亡，一讲就是一夜。
      - id: srme_f_04
        text: 长辈把最后一枚旧朝信物系在你腕上，似有千钧。
      - id: srme_f_05
        text: 老供奉讲史时咳嗽连连，你忙递上热茶，他摆摆手继续。
      - id: srme_f_06
        text: 传史之后，你在{place}的残碑前坐了很久，像接过了什么。
    buckets:
      - when:
          era: ancient
        variants:
          - id: srme_an_01
            text: 长辈在{place}的荒祠里翻着旧牒，讲一段，叹一声。
          - id: srme_an_02
            text: 你在{place}的老槐下听遗史，落花沾了满肩。
          - id: srme_an_03
            text: 老供奉把一幅旧朝舆图挂起，指给你看当年的山河。
          - id: srme_an_04
            text: 传史的夜里，{place}起了风，火盆里的灰都飞起来了。
      - when:
          era: modern
        variants:
          - id: srme_mo_01
            text: 长辈在{place}的旧屋中放老照片，一张张指给你看。
          - id: srme_mo_02
            text: 你把老供奉的口述录下来，生怕漏掉半句。
          - id: srme_mo_03
            text: 遗脉的长辈在{place}的茶室里讲旧朝，一屋子人屏息。
          - id: srme_mo_04
            text: 老供奉把一册家谱扫描进电脑，也把你写进了末尾。

  scene_predator_drain:
    fallback:
      - id: spdr_f_01
        text: 暗夜里你再次出手，把一缕灵质从无辜者身上抽走。
      - id: spdr_f_02
        text: 你在{place}的暗处伏击，得手后却迟迟没有快意。
      - id: spdr_f_03
        text: 夺灵的一瞬，你的力量涨了，心却空了一块。
      - id: spdr_f_04
        text: 你看着掌心的灵光，知道那不属于自己，却贪它温热。
      - id: spdr_f_05
        text: 受害者倒下前望了你一眼，你硬生生别开头。
      - id: spdr_f_06
        text: 你在{place}的废墟里练着夺灵，越练越熟，也越练越冷。
      - id: spdr_f_07
        text: 每夺一分灵，你便觉得离从前的自己远了一分。
      - id: spdr_f_08
        text: 你的名号在暗处传开，成了让人夜里睡不着的鬼影。
    buckets:
      - when:
          era: ancient
        variants:
          - id: spdr_an_01
            text: 你在{place}的古道上劫灵，月色都替你掩了行藏。
          - id: spdr_an_02
            text: 山门悬赏缉你，你却还在{place}的山道上下手。
          - id: spdr_an_03
            text: 你在{place}的乱坟间炼化夺来的灵，阴火幽幽。
          - id: spdr_an_04
            text: 夜猎归来，你在{place}的破庙里数着夺来的灵，像数着罪。
      - when:
          era: modern
        variants:
          - id: spdr_mo_01
            text: 你在{place}的暗巷里下手，监控的灯却亮得刺眼。
          - id: spdr_mo_02
            text: 夺灵得手后，你在{place}的地铁里坐过一站又一站，不敢回家。
          - id: spdr_mo_03
            text: 你在{place}的废弃楼里炼化灵质，霓虹照不进窗。
          - id: spdr_mo_04
            text: 夜里的{place}像个猎物，你行走其间，心却越来越慌。

  scene_predator_gloom:
    fallback:
      - id: spdg_f_01
        text: 邪气在你体内乱窜，搅得你整夜难眠。
      - id: spdg_f_02
        text: 你身上的戾气越来越重，连影子都像带着刺。
      - id: spdg_f_03
        text: 旁人见你便躲，说你的眼睛里有股子冷光。
      - id: spdg_f_04
        text: 你在{place}的夜里惊醒，一身冷汗，邪气绕腕不散。
      - id: spdg_f_05
        text: 夺来的灵在体内反噬，你疼得咬破了嘴唇。
      - id: spdg_f_06
        text: 你照镜子时，竟有些认不出镜中那个阴沉的人。
      - id: spdg_f_07
        text: 邪气缠身的日子里，你吃不下，也睡不沉。
      - id: spdg_f_08
        text: 你的名声越来越坏，连{place}的野狗见了你都夹着尾巴。

  scene_predator_hunt:
    fallback:
      - id: spdh_f_01
        text: 你把目标锁定在弱小的妖灵身上，一步步逼近。
      - id: spdh_f_02
        text: 猎取弱小的一瞬，你尝到了从未有过的饱足，与更深的饥。
      - id: spdh_f_03
        text: 弱小的妖灵在你面前瑟瑟发抖，你却只看见它的灵质。
      - id: spdh_f_04
        text: 你在{place}的偏僻处设伏，专门挑落单的下手。
      - id: spdh_f_05
        text: 每猎取一个，你便更冷一分，也更怕自己一分。
      - id: spdh_f_06
        text: 你抢走了猎物的灵，也抢走了自己在{place}的容身之处。
      - id: spdh_f_07
        text: 猎来的灵在你体内灼烧，力量与代价一并涌来。
      - id: spdh_f_08
        text: 你的手上沾满了弱者的灵，洗也洗不净。
    buckets:
      - when:
          era: ancient
        variants:
          - id: spdh_an_01
            text: 你在{place}的山坳里伏击小妖，林鸟惊得四散。
          - id: spdh_an_02
            text: 弱小的妖灵跪在{place}的草径上求你，你只抬了抬手。
          - id: spdh_an_03
            text: 你在{place}的古庙后劫了只尚未化形的小妖。
          - id: spdh_an_04
            text: 夜风把{place}的火把吹得忽明忽暗，像在替你遮掩。
      - when:
          era: modern
        variants:
          - id: spdh_mo_01
            text: 你在{place}的地下通道里堵住目标，脚步声空得吓人。
          - id: spdh_mo_02
            text: 弱小的妖灵在{place}的天台边退无可退，眼里全是惧色。
          - id: spdh_mo_03
            text: 你在{place}的停车场里下手，警报声在不远处尖响。
          - id: spdh_mo_04
            text: 猎物倒下后，你在{place}的便利店买水，手抖得付不了账。

# ── 里程碑题注（narrativeFeed.milestones 声明的事件 → 照片式文本快照）──
milestones:
  scene_first_transform:
    - id: ms_sft_01
      text: 化形那夜的你——{place}，月光正好。
    - id: ms_sft_02
      text: 照片记下了你成为"人"的第一天。背景是{place}的老槐树。
    - id: ms_sft_03
      text: 照片里的你刚学会站直，脚还有些不自然地并拢。
    - id: ms_sft_04
      text: 你化成人形的第一张像，衣领都没整理好，眼睛却亮得吓人。
    - id: ms_sft_05
      text: 快照定格的那一刻，你正对着镜子摸自己的耳朵。
    - id: ms_sft_06
      text: 那天的{place}，你真真正正用两条腿走了起来。
    - id: ms_sft_07
      text: 照片里你笑得有点慌，像刚学会玩笑的孩子。
    - id: ms_sft_08
      text: 你把这副皮相看了又看，按下快门的瞬间还愣着。
    - id: ms_sft_09
      text: 照片角上写着日期，是你成为人形的那天。
    - id: ms_sft_10
      text: 你在{place}的街头第一次以人样买糖，找零都忘了拿。
    - id: ms_sft_11
      text: 镜头里的你半人半影，化形还没能完全收住。
    - id: ms_sft_12
      text: 你留下了第一件人穿的衣裳，照片里大了半号。
    - id: ms_sft_13
      text: 照片背面有一行小字，记得是你自己写下的新名字。
    - id: ms_sft_14
      text: 你借着{place}的光正了正身子，快门就响了。
    - id: ms_sft_15
      text: 那是你与人间打的第一个照面，被一张照片留了下来。
  guild_recruit:
    - id: ms_gr_01
      text: 照片里你站在会馆门前，制服崭新，站得比谁都直。
    - id: ms_gr_02
      text: 那天的{place}，你把自己的名字写进会馆名册，笔尖顿了顿。
    - id: ms_gr_03
      text: 照片里会馆的门匾刚擦过，映出你仰着的脸。
    - id: ms_gr_04
      text: 你接过制服时手在抖，照片只记下了你发红的耳朵。
    - id: ms_gr_05
      text: 名册那一页翻到你的名字，照片正好拍到你落笔。
    - id: ms_gr_06
      text: 你在会馆门前站了半晌，才敢迈进去，照片里只剩个背影。
    - id: ms_gr_07
      text: 照片里的你与同门并排站着，个子都长了半寸似的。
    - id: ms_gr_08
      text: 入会那天你在{place}的会场里，听了一整天规矩。
    - id: ms_gr_09
      text: 镜头定格时，你正把会馆的徽章往胸前别了又别。
    - id: ms_gr_10
      text: 你领到了自己的一枚符，举在手里给照片看。
    - id: ms_gr_11
      text: 会馆的师姐把你领进门，照片里你们俩都笑着。
    - id: ms_gr_12
      text: 你在名册上按了个手印，朱砂还粘在指腹上。
    - id: ms_gr_13
      text: 照片里，你第一次穿上了那身制服，扣子系得一丝不苟。
    - id: ms_gr_14
      text: 那天你在一群新面孔里，第一次觉得有了去处。
    - id: ms_gr_15
      text: 照片背面写着{place}，那是你入会的地方。
  init_tier:
    - id: ms_it_01
      text: 入门那天——你掌心托着第一缕灵质，{place}的天色很亮。
    - id: ms_it_02
      text: 照片记下你第一次"看见"自己的瞬间。背景是{place}的旧屋。
    - id: ms_it_03
      text: 照片里你盘腿坐着，掌心那点灵质还只像一粒火星。
    - id: ms_it_04
      text: 你第一次引气入体的样子，被照片记得清清楚楚。
    - id: ms_it_05
      text: 镜头里你闭着眼，眉间还攒着一点没放下的紧张。
    - id: ms_it_06
      text: 师父在你额上点了点，照片里你正绷着身子不敢动。
    - id: ms_it_07
      text: 你照见自己经脉的那一刻，照片只拍到你微张的嘴。
    - id: ms_it_08
      text: 入门那日你在{place}的静室里，坐了整整一下午。
    - id: ms_it_09
      text: 照片里你的指尖沾着灵气，像缠了几缕不会灭的线。
    - id: ms_it_10
      text: 你第一次把灵质收入丹田，收完就笑了，照片正好拍下。
    - id: ms_it_11
      text: 那点光很弱，可照片里你的影子被照得发暖。
    - id: ms_it_12
      text: 你在入门册上记下第一笔，照片里的墨迹还没干。
    - id: ms_it_13
      text: 镜头定格时，你正数着自己能看见的几根灵线。
    - id: ms_it_14
      text: 你把这头一回的体悟，都写进了那天的照片备注里。
    - id: ms_it_15
      text: 照片里你抬起头，{place}的天光正好落进你眼底。
  gate_ningxing:
    - id: ms_gn_01
      text: 凝形那夜，你在{place}的水边站了很久，倒影终于清晰。
    - id: ms_gn_02
      text: 照片里你闭目凝神，周身灵质初凝如薄雾。那是{place}的深秋。
    - id: ms_gn_03
      text: 照片里的你在水边，倒影与你终于长得一模一样。
    - id: ms_gn_04
      text: 凝形那刻你的轮廓由虚变实，照片只来得及拍下一半。
    - id: ms_gn_05
      text: 你在{place}的长椅上坐了很久，等风把最后一缕雾吹散。
    - id: ms_gn_06
      text: 照片里你握了握自己的手，像是确认它真的在了。
    - id: ms_gn_07
      text: 你凝形后的第一件事，是去照了照{place}的旧镜子。
    - id: ms_gn_08
      text: 镜头里的你身形初定，衣角还带着未散的灵光。
    - id: ms_gn_09
      text: 那夜你走出门，影子稳稳跟在你身后，照片记了下来。
    - id: ms_gn_10
      text: 你在月色里试着转了个圈，照片里的你已不再散形。
    - id: ms_gn_11
      text: 凝形之后，你在{place}的水边洗了把脸，凉得真实。
    - id: ms_gn_12
      text: 照片里你举起手挡住月光，掌心透出的纹理清晰可见。
    - id: ms_gn_13
      text: 你轻轻碰了碰自己的脸，快门就响在这一刻。
    - id: ms_gn_14
      text: 那身形状，你花了很久才捏成，照片里却像天生。
    - id: ms_gn_15
      text: 你把这重要的一夜，留在了一张有些过曝的照片上。
  gate_dayao:
    - id: ms_dy_01
      text: 大妖之境——{place}的山风在你身后停了半拍。
    - id: ms_dy_02
      text: 照片记下你跨过那道槛的背影。周围的草木都低了低头。
    - id: ms_dy_03
      text: 照片里你立在{place}的山巅，脚下云气翻涌如海。
    - id: ms_dy_04
      text: 你跨入大妖之境那日，四周草木都朝你伏了伏身。
    - id: ms_dy_05
      text: 镜头只拍到你一个侧脸，身后的风却像停住了。
    - id: ms_dy_06
      text: 那天的{place}，飞鸟都绕着你飞，久久不肯落地。
    - id: ms_dy_07
      text: 照片里你的眼睛像盛着一整片安静的夜。
    - id: ms_dy_08
      text: 你轻轻一抬手，山影都跟着你动了动，照片记下了这刻。
    - id: ms_dy_09
      text: 跨过那道槛后，你在原地站了很久，照片里只有风声。
    - id: ms_dy_10
      text: 大妖之境，无喜无怒，你在照片里却偏偏笑着。
    - id: ms_dy_11
      text: 你回望来路，那些修行都凝成了眉间一点。
    - id: ms_dy_12
      text: 照片里的你被晨光勾了一道边，像从传说里走出来。
    - id: ms_dy_13
      text: 那日{place}的云裂开又合上，你就在云下。
    - id: ms_dy_14
      text: 你终于站在了自己一直仰望的地方，照片替你记着。
    - id: ms_dy_15
      text: 镜头里的你神色平静，可掌心还微微发着颤。
  ascend_trigger:
    - id: ms_at_01
      text: 飞升那日——{place}的天裂开一道缝，你走进光里。
    - id: ms_at_02
      text: 照片里你回头看了最后一眼。脚下的云很厚，{place}很小。
    - id: ms_at_03
      text: 照片里你正抬脚，脚下尘世已远成一片薄薄的影。
    - id: ms_at_04
      text: 飞升那刻，你最后看了一眼{place}的灯火，全在照片里。
    - id: ms_at_05
      text: 镜头追着你的衣角，可惜只拍下一片风。
    - id: ms_at_06
      text: 你把这辈子的行囊都留在了原地，照片里只剩空空的脚印。
    - id: ms_at_07
      text: 那天万灵抬头，你站在光里，被一张照片勉强留住。
    - id: ms_at_08
      text: 你合上眼再睁开，照片已装不下你的影子。
    - id: ms_at_09
      text: 飞升前的你，在{place}站了整整一夜，像与谁告别。
    - id: ms_at_10
      text: 照片里你的背影越来越淡，最后融进了天光。
    - id: ms_at_11
      text: 你朝上一跃，人间在你身后慢慢缩成一颗星。
    - id: ms_at_12
      text: 镜头盖不住的光，从你周身溢出来，漫过整张照片。
    - id: ms_at_13
      text: 你在云上停了一瞬，回头的那一眼好像也被拍下了。
    - id: ms_at_14
      text: 那日的风从你脚下生，吹起了人间许多张信纸。
    - id: ms_at_15
      text: 照片最后只拍到白光，可你知道，那是你。
  scene_hermit_chance:
    - id: ms_shc_01
      text: 隐修岛那夜——老者的手在你额心一点，{place}的海声忽然远了。
    - id: ms_shc_02
      text: 照片记下你听潮的那个背影。身后是{place}的礁石与月。
    - id: ms_shc_03
      text: 照片里是老者的背影，你在后头跟着，踩着一行脚印。
    - id: ms_shc_04
      text: 隐修岛的潮水在你身后涨了又退，照片里只有一线白。
    - id: ms_shc_05
      text: 你坐在礁石上听潮，照片里的天色正由青转灰。
    - id: ms_shc_06
      text: 那天老者教你吐纳，你在照片里学得像模像样。
    - id: ms_shc_07
      text: 照片里的岛很小，海却大得没有边，你在中间显得安静。
    - id: ms_shc_08
      text: 你在海边的木屋里住下，照片里的灯火暖黄。
    - id: ms_shc_09
      text: 老者给你画了道符，照片里那道会发亮的符还没干。
    - id: ms_shc_10
      text: 隐修岛的日子，你慢得快要忘了时辰，照片记得。
    - id: ms_shc_11
      text: 照片里你与老者对坐，中间只隔着一壶凉茶。
    - id: ms_shc_12
      text: 你离岛前回头望，照片把那一刻的海雾都留住了。
    - id: ms_shc_13
      text: 涨潮时你站在浪边，照片里你的衣摆湿了半截。
    - id: ms_shc_14
      text: 老者说你来得突然，走时却别忘了{place}的潮。
    - id: ms_shc_15
      text: 照片背面是你写下的隐修岛三个字，墨迹被海风浸过。
  shock_war:
    - id: ms_sw_01
      text: 战乱那年——你在{place}的废墟前站了很久，手里攥着一把土。
    - id: ms_sw_02
      text: 照片里你背着一生的家当。背景是{place}烧焦的天际线。
    - id: ms_sw_03
      text: 照片里是一片废墟，你在废墟前站得笔直。
    - id: ms_sw_04
      text: 你攥着的那把土，照片里看不太清，只有掌心是暗的。
    - id: ms_sw_05
      text: 战后的{place}，你在断墙前升了一堆火，火光照着旧门牌。
    - id: ms_sw_06
      text: 照片里你背着家当往前赶，身后跟着很长的烟。
    - id: ms_sw_07
      text: 你把亲人的名字刻在一块木牌上，照片里的刀痕很深。
    - id: ms_sw_08
      text: 那天的天是灰的，你在照片里只剩一个剪影。
    - id: ms_sw_09
      text: 你坐在倒塌的屋梁上，照片里你正一点点掰着干粮。
    - id: ms_sw_10
      text: 战乱过后你回到{place}，照片里你站在原来的家门前。
    - id: ms_sw_11
      text: 你给一株焦树浇了第一瓢水，照片记下了这个春天。
    - id: ms_sw_12
      text: 照片里的火还在烧，你的影子被拉成一根细线。
    - id: ms_sw_13
      text: 你接过半碗稀粥的瞬间，被照片拍下，眼尾有些红。
    - id: ms_sw_14
      text: 烽火散尽，你在{place}重新支起一扇门，照片里你笑着。
    - id: ms_sw_15
      text: 那本相册你翻到最后一张，是战乱那年你仅存的家当。
