      - id: smaf_f_02
        text: 你在{place}的山坡上采得几株灵草，分了大半给伙伴。
      - id: smaf_f_03
        text: 互助会的人分你一份刚采的灵食，鲜得你眯起眼。
      - id: smaf_f_04
        text: 你替走不快的同伴多背了半筐，回来时心里踏实。
      - id: smaf_f_05
        text: 采灵的路你越走越熟，会众都爱跟你搭伙。
      - id: smaf_f_06
        text: 你在{place}的野地里寻到一处灵泉，众人皆来分食。
      - id: smaf_f_07
        text: 会众把最肥的一份留给你，说是还你上次的照顾。
      - id: smaf_f_08
        text: 采灵归来，你与众人围着火分食，一夜无话也暖。

