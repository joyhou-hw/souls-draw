            text: 会馆的夜课散得很晚，你第一次在霓虹里静坐如常。
          - id: it_mo_02
            text: 你在出租屋的窗边打坐，楼下的车声像远处的潮。
          - id: it_mo_03
            text: 入门那天你在手机里设了个闹钟，叫醒自己的是一脉灵气。
          - id: it_mo_04
            text: 地铁上你闭目调息，身边的人只当你累了一天。
          - id: it_mo_05
            text: 你在会馆的资料室里翻入门心法，纸页混着打印的墨味。
          - id: it_mo_06
