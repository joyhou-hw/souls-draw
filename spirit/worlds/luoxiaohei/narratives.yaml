      - id: scm_f_02
        text: 集市人挤人，你护着摊子，也护着怀里的几枚铜钱。
      - id: scm_f_03
        text: 你替人跑腿送了一上午货，鞋底磨薄了一层。
      - id: scm_f_04
        text: 街角的糖人摊边，你数着进账，铜板在掌心发凉。
