        text: 突破御物的瞬间，你指尖一点，桌上的茶盏自己往你手边挪了半寸。
      - id: yw_f_02
        text: 你让一片叶子悬在半空，那一刻，风也听你的话。
      - id: yw_f_03
        text: 你望着桌角的笔，它先晃了晃，然后慢慢立了起来。
      - id: yw_f_04
        text: 御物初成，你让汤匙在碗里转了半圈，像在搅一泓水。
      - id: yw_f_05
