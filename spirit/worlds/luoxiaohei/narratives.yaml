# ── 全局碎片（碎片拼接：任意事件可复用，按概率缀于句首/句尾）──
openers:
  - id: op_01
    text: 这一年{place}的雨季来得早，
  - id: op_02
    text: 灵气像潮水一样漫过{place}，
  - id: op_03
    text: 檐角的风铃响了整整一季，
  - id: op_04
    text: 那年山里的雾散得特别慢，
  - id: op_05
    text: 你在{place}寄下的第一封信还没寄到，
  - id: op_06
    text: 檐下的燕子去了又来，
  - id: op_07
    text: 一场细雨落在{place}的青石板上，
  - id: op_08
    text: 天还没亮，{place}的集市已经醒了，
  - id: op_09
    text: 你挑着一个不大的包袱上路，
  - id: op_10
    text: 风从林子里钻出来，
  - id: op_11
    text: 又是一年柿子红的时候，
  - id: op_12
    text: 你在{place}的旧巷子里拐错了弯，
  - id: op_13
    text: 那年冬天没下雪，
  - id: op_14
    text: 早春的第一声雷滚过{place}，
  - id: op_15
    text: 你蹲在门槛上系鞋带，
  - id: op_16
    text: 月光把你的影子拉得老长，
  - id: op_17
    text: 你数着口袋里的几枚钱，
  - id: op_18
    text: 桂花开了满城，
  - id: op_19
    text: 你在渡口等船，
  - id: op_20
    text: 桥下的水不紧不慢地流，
  - id: op_21
    text: 你折了一根柳枝别在衣襟上，
  - id: op_22
    text: 天边的火烧云烧得正旺，
  - id: op_23
    text: 你推开一扇吱呀响的门，
  - id: op_24
    text: 夜里的虫鸣一阵接一阵，
  - id: op_25
    text: 你在{place}的梧桐树下躲雨，
  - id: op_26
    text: 第一场雪落在你肩上，
  - id: op_27
    text: 你嚼着一口干粮赶路，
  - id: op_28
    text: 窗台上那盆草又抽了新芽，
  - id: op_29
    text: 你顺着人声找到一处热闹，
  - id: op_30
    text: 蝉鸣把夏天拉得老长，
  - id: op_31
    text: 你在井边打上一桶清凉的水，
  - id: op_32
    text: 油灯的影子在墙上晃，
  - id: op_33
    text: 你踩着露水出了门，
  - id: op_34
    text: 远处传来几声更鼓，
  - id: op_35
    text: 你把手里的活计又紧了紧，
  - id: op_36
    text: 河对岸有人喊你的名字，
  - id: op_37
    text: 你拢了拢被风吹乱的衣摆，
  - id: op_38
    text: 天光一寸寸亮起来，
  - id: op_39
    text: 你在{place}的菜市挑了几样小菜，
  - id: op_40
    text: 雨后的泥土味最是熟悉，
  - id: op_41
    text: 你背着一篓柴火下山，
  - id: op_42
    text: 街角那盏灯还亮着，
  - id: op_43
    text: 你数着日子过活，
  - id: op_44
    text: 又是一年梅子黄时，
  - id: op_45
    text: 你在旧书摊前蹲下身，
  - id: op_46
    text: 风把一页纸吹到你的脚下，
  - id: op_47
    text: 你望着{place}的方向出了神，
  - id: op_48
    text: 天擦黑时你才往回走，
  - id: op_49
    text: 你喝下一口温热的汤，
  - id: op_50
    text: 远处的钟声荡开，
  - id: op_51
    text: 你把这一年想了一遍，
  - id: op_52
    text: 你在{place}住了有些年头，
  - id: op_53
    text: 路边的野花开得正好，
  - id: op_54
    text: 你摸了摸怀里的旧物，
  - id: op_55
    text: 晚风把炊烟吹斜了，
  - id: op_56
    text: 你在门前种的那棵树又长高了些，
  - id: op_57
    text: 一场秋雨一场凉，
  - id: op_58
    text: 你凭着{niche}的本事在{place}站稳了脚，
  - id: op_59
    text: 客店里的灯一盏盏灭了，
  - id: op_60
    text: 你抬头看了看天，又低头赶路，

closers:
  - id: cl_01
    text: 你把这一年收进心里，像收一颗温热的石子。
  - id: cl_02
    text: 夜里你数着星星睡去，梦里没有得失。
  - id: cl_03
    text: 岁月无声，你且行且记。
  - id: cl_04
    text: 你把这些日子叠好，塞进往后的路。
  - id: cl_05
    text: 风一吹，昨日的尘埃就散了。
  - id: cl_06
    text: 你拍了拍身上的土，接着往前走。
  - id: cl_07
    text: 那点甜，够你回味一整年。
  - id: cl_08
    text: 你在心里给自己点了一盏小灯。
  - id: cl_09
    text: 日子照旧，你也照旧。
  - id: cl_10
    text: 你忽然觉得，{place}也挺好的。
  - id: cl_11
    text: 有些话，你只对路边的风说过。
  - id: cl_12
    text: 你把这页翻过去，纸角还带着点暖。
  - id: cl_13
    text: 月亮升起来的时候，你已不再难过。
  - id: cl_14
    text: 你回头望了一眼，来路已经模糊。
  - id: cl_15
    text: 这便是一年了。
  - id: cl_16
    text: 你数了数收获，勉强够一张笑脸。
  - id: cl_17
    text: 夜深了，你把灯芯挑亮了些。
  - id: cl_18
    text: 你相信明年会更好一点。
  - id: cl_19
    text: 你把这些悄悄话都递给了星星。
  - id: cl_20
    text: 身上的累，睡一觉就轻了。
  - id: cl_21
    text: 你在{place}的屋檐下，避过了一场雨。
  - id: cl_22
    text: 一切都会慢慢好起来的。
  - id: cl_23
    text: 你把这一天轻轻放进梦里。
  - id: cl_24
    text: 秋风起了，你添了件衣裳，也添了份念想。
  - id: cl_25
    text: 你朝前走，影子跟在身后，不离不弃。
  - id: cl_26
    text: 罢了，总归还有明天。
  - id: cl_27
    text: 你把这会儿的安静，收成自己的。
  - id: cl_28
    text: 远处有光，你就朝光走。
  - id: cl_29
    text: 你把一只空碗洗干净，日子便又有了根。
  - id: cl_30
    text: 有些事过去了，就不用再回头。
  - id: cl_31
    text: 你踩着星光回了家。
  - id: cl_32
    text: 这一路走来，倒也不亏。
  - id: cl_33
    text: 你给明天留了一扇半开的窗。
  - id: cl_34
    text: 花开花落，你都在场。
  - id: cl_35
    text: 你蜷在灯下，心里比火还暖。
  - id: cl_36
    text: 走过这一程，你也算见过山河了。
  - id: cl_37
    text: 你把这片刻的安宁，稳稳接住。
  - id: cl_38
    text: 你好歹没有辜负这一年的自己。
  - id: cl_39
    text: 睡吧，梦里什么都有。
  - id: cl_40
    text: 你把脚步放轻，怕惊扰了好时辰。
  - id: cl_41
    text: 来时的路，等下雪再走吧。
  - id: cl_42
    text: 你数着羊睡去，一只，两只，都是你。
  - id: cl_43
    text: 这尘世热闹，你也是其中一盏灯。
  - id: cl_44
    text: 你把手心焐热，捂住了仅存的一点盼望。
  - id: cl_45
    text: 山水有相逢，你与明天也会。
  - id: cl_46
    text: 你看，天终究是亮了。
  - id: cl_47
    text: 你把苦的咽下，甜的就都记住了。
  - id: cl_48
    text: 一切如常，便是好日子。
  - id: cl_49
    text: 你回头，把门轻轻带上。
  - id: cl_50
    text: 这趟没白来。
  - id: cl_51
    text: 你把{species}的身份藏好，混进了人间烟火。
  - id: cl_52
    text: 夜深人静，你听见自己匀匀的呼吸。
  - id: cl_53
    text: 你笑了笑，继续做你的小人物。
  - id: cl_54
    text: 能这样活着，也不容易。
  - id: cl_55
    text: 你把这心事塞进袖口，暖了一路。
  - id: cl_56
    text: 尘埃落定，你还在。
  - id: cl_57
    text: 你朝{place}的方向，又迈了一步。
  - id: cl_58
    text: 罢了，睡意已经来了。
  - id: cl_59
    text: 你在梦里，又回到了最初的地方。
  - id: cl_60
    text: 这一年，也算有始有终。

# ── 事件叙事（按事件 id 分桶：buckets 先匹配先赢，fallback 兜底）──
events:
  quiet_year:
    fallback:
      - id: qy_f_01
        text: 平静的一年，无风也无浪。
      - id: qy_f_02
        text: 这一年过得像一碗温水，不烫嘴，也不凉心。
      - id: qy_f_03
        text: 日升月落，你在{place}守着自己的小日子。
      - id: qy_f_04
        text: 这一年你没病没灾，日子顺着旧轨道慢慢滑过去。
      - id: qy_f_05
        text: 檐下晒着一簸箕干菜，你在日头里打了个盹，醒来天还是亮的。
      - id: qy_f_06
        text: 门外的小路又落了层新叶，你扫了又扫，扫出一整年的安稳。
      - id: qy_f_07
        text: 灶膛里的火不紧不慢，锅里的粥咕嘟了一整个冬天。
      - id: qy_f_08
        text: 这一年你和邻居点头的次数，比说的话还多。
      - id: qy_f_09
        text: 你收了院里的果子，酿了一坛酒，封口时把愿望也一起埋进去。
      - id: qy_f_10
        text: 晨雾起时你在{place}散步，鞋尖踢到几颗温热的石子。
      - id: qy_f_11
        text: 记账本只翻了一半，这一年就到底了。
      - id: qy_f_12
        text: 你养的那盆草悄悄抽了新芽，日子也跟着绿了一点。
      - id: qy_f_13
        text: 这一年你的影子在{place}拉长又缩短，像一支慢慢写字的笔。
      - id: qy_f_14
        text: 你学着给日子记账，只记进不记出，账本比脸还干净。
      - id: qy_f_15
        text: 门前的石板被雨洗得发亮，你踩过时总能看见自己的倒影。
      - id: qy_f_16
        text: 你养的一条老猫添了崽，你便多了一窝要惦记的小东西。
      - id: qy_f_17
        text: 灶上的火候你摸得越来越准，饭菜的香能飘过半条巷子。
      - id: qy_f_18
        text: 你把这些年攒下的旧物翻出来晒，晒着晒着就过了一个下午。
      - id: qy_f_19
        text: 这一年风调雨顺，你种的菜自己吃不完，还分给邻居几把。
      - id: qy_f_20
        text: 你在{place}的桥头坐了一夏，看水里的鱼换了一拨又一拨。
      - id: qy_f_21
        text: 日子不声不响地过去，你只记得有几场雨下得特别透。
      - id: qy_f_22
        text: 你学会了一件新活计，手上多了一处老茧，心里多了一点踏实。
      - id: qy_f_23
        text: 夜里你听见远处的钟声，一下一下，数着数着就睡着了。
      - id: qy_f_24
        text: 你把院墙又补了一遍，泥里掺着草，也掺着一整年的安稳。
      - id: qy_f_25
        text: 这一年你哪儿也没去，却把{place}的每个角落都走熟了。
      - id: qy_f_26
        text: 你把一年的衣裳洗净叠好，收进樟木箱，日子就有了沉甸甸的底。
      - id: qy_f_27
        text: 这一年你养成了早睡的习惯，梦都做得格外安稳。
      - id: qy_f_28
        text: 你在{place}的窗边摆了一盆花，浇着浇着就浇过了四季。
      - id: qy_f_29
        text: 你把旧年的对联揭下来，叠整齐，夹进了书页里。
      - id: qy_f_30
        text: 这一年门前的燕子去了又来，你数过它们的窝，也数过自己的日子。
      - id: qy_f_31
        text: 你学会做一道新菜，端上桌时，满屋子都是热乎气。
      - id: qy_f_32
        text: 晚风从{place}的街口吹来，你把一日的疲惫都抖落在门槛外。
      - id: qy_f_33
        text: 你把晒好的被褥抱回屋，闻着太阳味，一觉睡到天亮。
      - id: qy_f_34
        text: 这一年你的屋檐下添了个燕子窝，进进出出都是热闹。
      - id: qy_f_35
        text: 你在{place}的集市上挑了一盏灯，提回来照着回家的路。
      - id: qy_f_36
        text: 日子像磨盘，慢慢转，你只往里头添豆子，不添心事。
      - id: qy_f_37
        text: 这一年你把自己照顾得挺好，添了几斤，也添了几分精神。
      - id: qy_f_38
        text: 你在{place}的老墙根下听人下棋，一听就是一下午。
      - id: qy_f_39
        text: 你把这一年的落叶扫进树根，堆成厚厚一床，等来年再醒。
      - id: qy_f_40
        text: 平静得几乎想不起什么大事，只是灶上的汤一直温着。
    buckets:
      - when:
          form: human
          minTick: 0
          maxTick: 12
        variants:
          - id: qy_h_c01
            text: 你在人群中过着寻常的一年，没人知道你知晓妖精的存在。
          - id: qy_h_c02
            text: 你在凡人的年节里赶集，提回一兜子糖，也提回一兜子热闹。
          - id: qy_h_c03
            text: 先生教的字你总也写不直，可你数天上的云，一数就是一下午。
          - id: qy_h_c04
            text: 邻家的孩子分你半块糖，你们蹲在门槛上，把甜味抿了一整个下午。
          - id: qy_h_c05
            text: 这一年你按时吃饭，按时睡觉，把自己照顾得像个大人。
          - id: qy_h_c06
            text: 你踮着脚才够到井台，这一年你又长高了一拃。
          - id: qy_h_c07
            text: 你在巷口看人斗蛐蛐，看得入了迷，把日头都看斜了。
          - id: qy_h_c08
            text: 你在井边打上一桶清凉的水，窗外的四季与妖精的世界毫无关系。
          - id: qy_h_c09
            text: 你趴在窗边数星星，数着数着就睡熟了，梦里也亮晶晶。
          - id: qy_h_c10
            text: 你在巷口买了整年的糖葫芦，老板都记住了你的口味。
          - id: qy_h_c11
            text: 你跟邻家的孩子学了编草蜢，编了一整夏天，手指都染绿了。
          - id: qy_h_c12
            text: 你在井边打水时照见自己的影子，还以为是谁家的孩子。
      - when:
          form: human
          minTick: 65
        variants:
          - id: qy_h_o01
            text: 你坐在{place}的门槛上晒太阳，把年轻时的事一件件翻出来晾晒。
          - id: qy_h_o02
            text: 孙辈绕膝的日子，你把攒了一辈子的故事讲了一遍又一遍。
          - id: qy_h_o03
            text: 这一年你的腿脚慢了下来，可{place}的每块砖你都认得。
          - id: qy_h_o04
            text: 你翻出压在箱底的旧衣裳，针脚还密，人却已旧了。
