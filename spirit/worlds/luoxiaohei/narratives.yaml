        text: 身体里那扇门塌了之后，你总听见风从缺口里漏进来。
      - id: lls_f_10
        text: 你想把自己藏进一道裂缝，可连影子都无处安放。
      - id: lls_f_11
        text: 那点空间的本事被抽走后，你的{place}忽然大得吓人。
      - id: lls_f_12
        text: 你数着墙上的裂纹，一条一条，都通不到你要去的地方。
      - id: lls_f_13
        text: 失去空间系灵质，你像折了翅的鸟，只能一步一步地走。
      - id: lls_f_14
        text: 你伸手想抓住半空的一片叶，它却从你指缝里滑走，像隔着千里。
      - id: lls_f_15
        text: 那扇门的门框还在，只是门板没了，风直往心里灌。
      - id: lls_f_16
        text: 你在原地打转，才发现自己连一步都挪不出去。
      - id: lls_f_17
        text: 你想把两处相隔的{place}折到一起，手一松，它们又弹开老远。
      - id: lls_f_18
        text: 那点撕开空间的本事没了，你只能像常人一样，一条街一条街地走。
      - id: lls_f_19
        text: 你翻遍旧日的笔记，想找回塌掉的门，纸上只剩些难懂的符号。
      - id: lls_f_20
        text: 空间灵质被夺走后，你夜里常梦见自己穿过许多扇门，醒来仍在原地。
      - id: lls_f_21
        text: 你把手贴在门板上，盼着哪一扇还能应你，掌心只感到寻常的木纹。
      - id: lls_f_22
        text: 从前你一个念头就能到的去处，如今要一步步丈量，鞋都磨薄了。
      - id: lls_f_23
        text: 你在{place}里绕了很多弯路，才发现自己已经不认得近路的走法。
      - id: lls_f_24
        text: 那扇空间的门塌了，你心里那点对远方的念想也跟着塌了半截。
      - id: lls_f_25
        text: 你试着在指尖凝一道细缝，凝到一半就散了，像风里的一点烟。
      - id: lls_f_26
        text: 失去空间的灵质，你连收拾行囊都慢了，什么都得放进背囊自己背。
      - id: lls_f_27
        text: 你在夜里对着空墙比划，比划了半天，只把自己的影子比划了进去。
      - id: lls_f_28
        text: 那扇门塌下的灰尘落了你一身，你抖了抖，却抖不掉心口的空。
      - id: lls_f_29
        text: 空间系灵质一空，你的{place}显得又远又近，路总也走不到头。
      - id: lls_f_30
        text: 你不再指望一步千里，只把眼前这几步走得稳稳当当。

  lixi_lost_yuling:
    fallback:
      - id: lly_f_01
        text: 御灵受创，你唤了很久，从前一呼即应的灵再也没有回应。
      - id: lly_f_02
        text: 那根与你相连的灵弦断了，你在{place}坐了一整夜，听不见半点回响。
      - id: lly_f_03
        text: 你唤了整整三夜，喉咙哑了，那灵也没应你一声。
      - id: lly_f_04
        text: 从前随叫随到的灵，如今像沉进了很深的水底。
      - id: lly_f_05
        text: 你与灵之间的那根线断了，你在{place}里喊，回声都陌生。
      - id: lly_f_06
        text: 御灵受创后，你的指尖还做着从前召唤的姿势，却什么也唤不来。
      - id: lly_f_07
        text: 你听见风里有动静，竖起耳朵，却再不是熟悉的回应。
      - id: lly_f_08
        text: 那灵走的时候没留一句话，只在门边留下一小片凉。
      - id: lly_f_09
        text: 你在旧日的召唤阵前坐了一夜，符文冷得像霜。
      - id: lly_f_10
        text: 你试着把灵质聚成往日的形状，散了又聚，聚了又散。
      - id: lly_f_11
        text: 失去御灵之后，你的{place}安静得能听见自己的回音。
      - id: lly_f_12
        text: 你唤它的名字，声音落进风里，连个浪花都没起。
      - id: lly_f_13
        text: 那根灵弦断了，你胸口一直绷着的那点东西也松了。
      - id: lly_f_14
        text: 你翻出旧时喂它的食盆，擦得干干净净，摆在原处。
      - id: lly_f_15
        text: 御灵受创的那阵子，你连走路都轻手轻脚，怕惊了什么。
      - id: lly_f_16
        text: 你在夜里点了一盏小灯，等一个再也不会来的回应。
      - id: lly_f_17
        text: 你照着旧法画下召唤的符，最后一笔落下，符纸却一点没热。
      - id: lly_f_18
        text: 那灵从前最爱跟在你脚边，如今那个位置空着，风一吹就没了。
      - id: lly_f_19
        text: 你在{place}的每个角落都找过，只找到几处它睡过的暖印。
      - id: lly_f_20
        text: 御灵伤得重，你连梦里都听见它在很远的地方应你，睁眼却什么都没有。
      - id: lly_f_21
        text: 你把自己关在屋里，一遍遍温习从前与它配合的招式，越练越空。
      - id: lly_f_22
        text: 那根灵弦断后，{place}的鸟叫都显得格外响，像在替你喊谁。
      - id: lly_f_23
        text: 你不再轻易开口唤灵，怕再听一次没有回应的寂静。
      - id: lly_f_24
        text: 旧时的铃铛还挂在门上，风一吹就响，响得人心里发紧。
      - id: lly_f_25
        text: 你试着把散掉的灵一点一点召回，召回的却只有满室空寂。
      - id: lly_f_26
        text: 御灵受创后，你与万物之间的那点默契都淡了，花开草动与你无关。
      - id: lly_f_27
        text: 你在夜里翻来覆去，总觉得缺了它匀匀的鼾声，屋子太静。
      - id: lly_f_28
        text: 你把它走时踏过的地面擦干净，又铺了一层薄薄的干草。
      - id: lly_f_29
        text: 那灵留下的最后一点气息也在风里散了，你站在那里，久久没动。
      - id: lly_f_30
        text: 你在{place}里立了一小方无名的石，算作它来过一场的念想。

  scene_forest_childhood:
    fallback:
      - id: sfy_f_01
        text: 童年的{place}，你追着萤火跑过一整片林子，鞋底沾满青苔。
      - id: sfy_f_02
        text: 你在老树的枝桠间搭了个窝，把野果和阳光一起藏进去。
      - id: sfy_f_03
        text: 林间的小溪边，你第一次照见自己的妖形，笑得跌进水里。
      - id: sfy_f_04
        text: 你和林里的小妖们捉迷藏，惊起满枝的雀，也惊起半坡的笑。
      - id: sfy_f_05
        text: 你在树洞里过夜，听了一宿松涛，天亮时头发里落满松针。
      - id: sfy_f_06
        text: 你把野莓塞满衣兜，回家时手和嘴都染成了紫色。
      - id: sfy_f_07
        text: 光脚踩过溪底的鹅卵石，凉意顺着脚心一直爬到耳根。
      - id: sfy_f_08
        text: 你追着一只兔子跑丢了路，最后是萤火把你领回了家。
      - id: sfy_f_09
        text: 树梢上的月亮又圆又近，你伸手去够，够下一把碎银子似的光。
      - id: sfy_f_10
        text: 你和伙伴用藤蔓编秋千，荡到最高处，风都替你们喝彩。
      - id: sfy_f_11
        text: 你在林子里捡到半片蝉蜕，对着光看了又看，像件小衣裳。
      - id: sfy_f_12
        text: 雨后你踩着泥坑蹦跶，新雨把整片林子洗得发亮。
      - id: sfy_f_13
        text: 你在老树根下埋了一颗松子，说好明年一起来看。
      - id: sfy_f_14
        text: 山风把你的纸鹞吹得东倒西歪，最后挂在了最高的枝上。
      - id: sfy_f_15
        text: 你躺在草地上看云，看着看着就睡进了云里。
      - id: sfy_f_16
        text: 偷吃蜂巢被抓了个正着，你肿着脸跑，身后嗡嗡响了一路。
      - id: sfy_f_17
        text: 你在溪边堆石子，堆到天黑也不肯走，像个笃定的小工匠。
      - id: sfy_f_18
        text: 林子里下了一场花雨，你仰着脸，兜了一身的花瓣回家。
      - id: sfy_f_19
        text: 你跟一只松鼠抢松果，抢到一半又笑着分给它一半。
      - id: sfy_f_20
        text: 童年的{place}总是绿得晃眼，连梦都浸着草木的清气。
    buckets:
      - when:
          region: forest
