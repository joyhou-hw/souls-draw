          - id: gn_an_02
            text: 你在烛火边凝形，火苗晃一下，你的轮廓就实一分。
          - id: gn_an_03
            text: 凝形那夜你听见更鼓响，一声一声，把你从雾里敲出来。
          - id: gn_an_04
            text: 你在山泉边照见自己，水波散开，你已有了人形。
          - id: gn_an_05
            text: 老道守在你身边，说凝形如烧坯，火候到了自会成器。
          - id: gn_an_06
            text: 你在晨钟里凝形，钟声落定时，你已经稳稳站住。
      - when:
          era: modern
        variants:
          - id: gn_mo_01
            text: 会馆的练习室里，你对着落地镜看自己一点点成形。
          - id: gn_mo_02
            text: 凝形那夜你在楼顶，城市的灯把你的影子照得老长。
          - id: gn_mo_03
            text: 你在地铁的末班车上凝形，到站时已是个齐整的人样。
          - id: gn_mo_04
            text: 你照着洗手间的镜子捏自己的脸，白灯把一切都照得清楚。
          - id: gn_mo_05
            text: 你在会馆的档案卡上写下名字，笔尖却没有再抖。
          - id: gn_mo_06
            text: 凝形完成时，街角的霓虹刚好跳成一片绿色。

  ascend_trigger:
    fallback:
      - id: at_f_01
        text: 圣灵圆满。你望了一眼脚下的大地，把此生所有牵挂折成一颗星，飞升离陆。
      - id: at_f_02
        text: 万灵仰望的尽头，你轻轻一跃，从此山川岁月都成了传说里的一页。
      - id: at_f_03
        text: 天光打开一条路，你回望最后一眼，把凡尘都留在了云下。
      - id: at_f_04
        text: 那一刻山不动，水不流，你与万物之间再无声息阻隔。
      - id: at_f_05
        text: 你合眼，再睁眼，脚下的土地已远成一张旧地图。
      - id: at_f_06
        text: 飞升的刹那，你听见无数生灵的呼吸，都轻得像一句道别。
      - id: at_f_07
        text: 此身已非此身，你带着一身的星辉走出人间。
      - id: at_f_08
        text: 满城灯火在身后熄灭，你往前一步，便再也不用回头。
      - id: at_f_09
        text: 你把这辈子的恩怨都团成一团，撒向云海，散了。
      - id: at_f_10
        text: 苍穹俯身相迎，你踩着风，一步一步走向没有尽头的白。
      - id: at_f_11
        text: 万灵一起抬头，看见你的影子慢慢溶进天光。
      - id: at_f_12
        text: 你留下的脚印在地上一闪，化作几朵会发亮的小花。
      - id: at_f_13
        text: 尘缘到头了。你轻轻一吹，把旧的自己留在原地。
      - id: at_f_14
        text: 天地之间没有一扇门为你开，你却自己走了出去。
      - id: at_f_15
        text: 你笑了，很轻的一声，然后整个人都融进了光里。
      - id: at_f_16
        text: 从此人间少了一个{species}，天上多了一颗安安静静的光。
      - id: at_f_17
        text: 你越过最后一道云，风停了，连心事也停在了下面。
      - id: at_f_18
        text: 这一跃不算远，却把你从所有的故事里轻轻摘了出来。
      - id: at_f_19
        text: 你回身作了个揖，山川还礼，然后一起目送你离开。
      - id: at_f_20
        text: 星海铺开一条路，你提着一盏回忆，慢慢向深处走。
    buckets:
      - when:
          era: ancient
        variants:
          - id: at_an_01
            text: 你在古祭坛上飞升，四方百姓跪了一地，都称你是山里的神仙。
          - id: at_an_02
            text: 黄昏的城楼上，你衣袂一振，就从此别了这方水土。
          - id: at_an_03
            text: 你踏着青石山径越走越高，身后的宫阙渐渐小成了沙盘。
          - id: at_an_04
            text: 那一夜明星低垂，你从旧庙的檐角离地，寺钟正好敲了三下。
          - id: at_an_05
            text: 你飞过护城河时，河里的锦鲤齐齐跃出水面送你。
          - id: at_an_06
            text: 古籍里写的那道天光，终于照在了你的身上。
      - when:
          era: modern
        variants:
          - id: at_mo_01
            text: 你在城市上空飞升，红绿灯还在下面一格一格地亮着。
          - id: at_mo_02
            text: 天台的门咔哒一声锁上，你头也不回地走进夜风里。
          - id: at_mo_03
            text: 手机在兜里震了最后一下，你没有接，然后屏幕就远了。
          - id: at_mo_04
            text: 满城车流在你脚下凝固成光河，而你已不在其中。
          - id: at_mo_05
            text: 霓虹招牌逐次熄灭，你穿过最后一片广告牌升了上去。
          - id: at_mo_06
            text: 航站楼的广播还在身后响，你已快到云层之上。

  scene_first_transform:
    fallback:
      - id: sft_f_01
        text: 第一次化形。你盯着自己的手指看了半宿，终于敢用"人"的样子走路。
      - id: sft_f_02
        text: 化形之夜，你在水边照见一张陌生的脸——那是你，也是崭新的你。

  scene_city_drift:
    fallback:
      - id: scd_f_01
        text: 城市的霓虹淹没了星光，你在天桥下学着做一只不引人注目的妖。
      - id: scd_f_02
        text: 高楼之间的风很硬，你在{place}的角落里攒着微薄的生计。
      - id: scd_f_03
        text: 你在城里的夜排档洗碗，油星子溅上围裙，也溅上月亮。
      - id: scd_f_04
        text: 出租屋的灯泡很昏，你对着它吃完一碗冷掉的泡面。
      - id: scd_f_05
        text: 清晨的公交挤满了赶工的人，你夹在中间，像被运往某处的一件货。
      - id: scd_f_06
        text: 你替人看店看到深夜，卷帘门拉下时，整条街都睡了。
      - id: scd_f_07
        text: 工资发下来薄薄一张，你数了三遍，又小心翼翼地折好。
      - id: scd_f_08
        text: 你在天桥下摆摊，看城管的靴子近了又远。
      - id: scd_f_09
        text: 望着一栋栋亮灯的楼，你想，总有一盏以后会是自己点的。
      - id: scd_f_10
        text: 你把一天的疲惫卸在出租屋门口，鞋一脱，人就矮了半截。
      - id: scd_f_11
        text: 城市的雨落得又急又硬，你在公交站下躲雨，伞还是借来的。
      - id: scd_f_12
        text: 你送了一天外卖，车筐里的餐盒凉了又热，热了又凉。
      - id: scd_f_13
        text: 深夜便利店的白光很足，你买了个饭团，微波炉叮的一声。
      - id: scd_f_14
        text: 你合租的小屋塞着三个人的梦，夜里谁翻身，整屋都知道。
      - id: scd_f_15
        text: 打工的招牌换了又换，你总能在新的招牌下找到新的活。
      - id: scd_f_16
        text: 你在地铁的末班车里打盹，报站声把你的梦一节节摇醒。
      - id: scd_f_17
        text: 城市的清晨从收垃圾的车开始，你和它一样早，也一样安静。
      - id: scd_f_18
        text: 你攒了一个月的钱，去不起的那家店门脸，你只多看了两眼。
      - id: scd_f_19
        text: 霓虹把你的影子拉成好几个，各自奔向不同的活计。
      - id: scd_f_20
        text: 你在{place}的高楼间穿行，渺小得像一粒会喘气的沙。
    buckets:
      - when:
          region: forest
        variants:
          - id: scd_fo_01
            text: 你在林子里守着一片茶山，采下的叶子换不回几个铜板。
          - id: scd_fo_02
            text: 山里的货要背到山外才值钱，你走熟了那条陡峭的路。
          - id: scd_fo_03
            text: 你没有自己的林地，只能替人看林，夜里睡在窝棚。
          - id: scd_fo_04
            text: 砍柴换米的日子，你把每一担柴都捆得结结实实。
          - id: scd_fo_05
            text: 林中的生计看天吃饭，一场霜就能把你的指望打蔫。
          - id: scd_fo_06
            text: 你在山货集上蹲了一日，布袋里的货没动几件。
      - when:
          region: city
        variants:
          - id: scd_ci_01
            text: 城市的出租屋你换了好几处，房东的交待一次比一次短。
          - id: scd_ci_02
            text: 你在地铁口卖早点，天不亮就起来和面，手冻得发红。
          - id: scd_ci_03
            text: 霓虹灯下你替人发传单，厚厚一沓，发到手指发麻。
          - id: scd_ci_04
            text: 你在工地的脚手架上看这座城，风把安全帽吹得呜呜响。
          - id: scd_ci_05
            text: 深夜的便利店只剩你和店员，两个人都累得不想说话。
          - id: scd_ci_06
            text: 你在这城里没有根，只租下一张床，和半个落脚的地方。
      - when:
          region: guild_land
        variants:
          - id: scd_gl_01
            text: 你在会馆领地里打杂，吃的是饱饭，看的是眼色。
          - id: scd_gl_02
            text: 会馆的杂役最是辛苦，你天不亮就挑水劈柴。
          - id: scd_gl_03
            text: 你替会馆跑腿送信，鞋底薄了又补，路却越走越熟。
          - id: scd_gl_04
            text: 在领地里讨生活，规矩多，可好歹有片瓦遮身。
          - id: scd_gl_05
            text: 你给会馆的大厨打下手，油烟里也能闻见点人味。
          - id: scd_gl_06
            text: 会馆的月钱按时发，你攥在手里，觉得日子有了底。
      - when:
          region: hermit_island
        variants:
          - id: scd_hi_01
            text: 你在海岛上替人晒盐，日头把你的背晒得黝黑发亮。
          - id: scd_hi_02
            text: 潮汐是你的钟表，你赶在涨潮前把渔网收了又收。
          - id: scd_hi_03
            text: 岛上很少来货船，你总盼着那声汽笛从雾里传来。
          - id: scd_hi_04
            text: 你帮人修补木船，桐油的气味沾满了一身。
          - id: scd_hi_05
            text: 打鱼看海的脸色，有收成没收成，都得看老天赏不赏。
          - id: scd_hi_06
            text: 你在礁石间寻些海物换钱，脚底板磨得又厚又硬。

  shock_war:
    fallback:
      - id: sw_f_01
        text: 战乱波及，你随着流民潮失了家。
      - id: sw_f_02
        text: 烽火烧到{place}那一年，你把能带走的都带走了，除了故乡。
      - id: sw_f_03
        text: 你在逃难的路上把最后一个包袱也丢了，只记得回家的方向。
      - id: sw_f_04
        text: 一夜之间，熟悉的街巷换成了焦土，你站在原地认不出{place}。
      - id: sw_f_05
        text: 你混在人群里过江，回头时，对岸的火把已经连成一片。
      - id: sw_f_06
        text: 兵祸过后，你在断墙下拾起半枚温热的窝头，舍不得吃。
      - id: sw_f_07
        text: 你在废墟里翻找值钱的东西，翻到后来，只翻出几件旧衣裳。
      - id: sw_f_08
        text: 战火把你和亲人冲散了，你在渡口等了三天，没有等到人。
      - id: sw_f_09
        text: 你学会了贴着墙根走路，夜里听见马蹄声就屏住呼吸。
      - id: sw_f_10
        text: 那年冬天格外长，你裹着一张破席子，熬过了一个又一个更点。
      - id: sw_f_11
        text: 你在逃难路上替人背过一段行李，换来半碗稀粥。
      - id: sw_f_12
        text: 城墙上的旗换了一面又一面，你始终不知道自己该跟着谁走。
      - id: sw_f_13
        text: 你躲在米缸里躲过一劫，出来时，屋外的天都红了。
      - id: sw_f_14
        text: 战乱过后你在{place}安了身，夜里却总梦见从前的家。
      - id: sw_f_15
        text: 你跟着一支商队走出乱区，回头望时，来路已经断了。
      - id: sw_f_16
        text: 有人劝你入伙，你摸了摸空荡荡的袖口，摇头走了。
      - id: sw_f_17
        text: 烽火连天的日子，你把仅剩的一点干粮分给了更小的孩子。
      - id: sw_f_18
        text: 你在焦黑的郊外走了整夜，天亮了才敢哭出声。
      - id: sw_f_19
        text: 兵荒马乱里，你最大的本事是活着，并把另一个人也带了出来。
      - id: sw_f_20
        text: 你收留了一只与你同样无家可归的生灵，它在你怀里发抖。
    buckets:
      - when:
          era: ancient
        variants:
          - id: sw_an_01
            text: 古时的烽火台一座接一座亮起，你和{species}的族人连夜南迁。
          - id: sw_an_02
            text: 铁蹄踏过{place}的田垄，你藏在稻草垛里，听见刀剑相撞。
          - id: sw_an_03
            text: 你替守军的驿马喂过一把草料，那马用鼻子蹭了蹭你的手心。
          - id: sw_an_04
            text: 城门关了七天，你在城内把最后一点盐巴掰成几份。
          - id: sw_an_05
            text: 乱世里你跟随一支乡勇，白天种地，夜里执哨，不敢合眼。
          - id: sw_an_06
            text: 雪夜你躲进破庙，庙里的老和尚把半张饼掰给你，说众生皆苦。
      - when:
          era: modern
        variants:
          - id: sw_mo_01
            text: 炮弹落在{place}的老街上，你抱着头蹲在防空洞里数秒数。
          - id: sw_mo_02
            text: 空袭警报响起来的时候，你正给人补一双快磨穿的鞋底。
          - id: sw_mo_03
            text: 你在临时安置点排了很久的队，轮到领粮时，天已经黑了。
          - id: sw_mo_04
            text: 广播里播报着前线消息，你听着听着，把收音机抱紧了些。
          - id: sw_mo_05
            text: 你跟着撤离的车队离开{place}，后视镜里全是灰蒙蒙的烟。
          - id: sw_mo_06
            text: 城市的楼一栋栋暗下去，你摸黑把窗纸贴严，怕透出光来。

  cultivation_year:
    fallback:
      - id: cy_f_01
        text: 修行的一年，你在{place}静坐吐纳，把日子过成一道缓慢的呼吸。
      - id: cy_f_02
        text: 这一年你闭目内视，灵质在经脉里走得又轻又稳。
      - id: cy_f_03
        text: 山雾散去的清晨，你照旧练功，衣摆沾着未干的露水。
      - id: cy_f_04
        text: 你照着旧法子练功，一招一式都慢得像在理线。
      - id: cy_f_05
        text: 入定时你听见自己的心跳，一下一下，把杂念都敲散了。
      - id: cy_f_06
        text: 这一年你的功夫没长进多少，心却稳当了许多。
      - id: cy_f_07
        text: 你在{place}的晨光里吐纳，吐出的白气都带着灵气。
      - id: cy_f_08
        text: 打坐的蒲团被坐出了坑，你的坐相一天比一天稳。
      - id: cy_f_09
        text: 你默念心法，灵质沿着老路走，走得很熟。
      - id: cy_f_10
        text: 夜里打坐，露水顺着你的发梢滴进衣领，你也不动。
      - id: cy_f_11
        text: 你在{place}寻了处僻静地，一坐就是半日，鸟都敢落在肩头。
      - id: cy_f_12
        text: 心法背得滚瓜烂熟，你却开始琢磨每句里的那点滋味。
      - id: cy_f_13
        text: 这一年你只精进了一步，那一步却比从前的百步都稳。
      - id: cy_f_14
        text: 吐纳之间，你听见气血在体内缓缓流转，像一条安静的河。
      - id: cy_f_15
        text: 你在晨雾里练功，收势时满山的雾都像是朝你拢了拢。
      - id: cy_f_16
        text: 夜里你望星观气，把漫天的光都看进心里。
      - id: cy_f_17
        text: 你把旧伤一点点养回来，灵质也重新聚成温润的一团。
      - id: cy_f_18
        text: 这一年你练得很慢，却第一次摸到了松字的门道。
      - id: cy_f_19
        text: 你在{place}的溪边打坐，水声替你洗净了满心杂念。
      - id: cy_f_20
        text: 灵质在丹田里越来越亮，像盏添了油的灯。
      - id: cy_f_21
        text: 你把自己修得又静又稳，连影子都少了几分飘忽。
      - id: cy_f_22
        text: 一年下来，你的呼吸变长了许多，一口气能数到很慢很慢。
      - id: cy_f_23
        text: 你照着师父留下的笔记练，练到页脚都翻得起了毛边。
      - id: cy_f_24
        text: 这一年你在{place}寻灵，翻过三座山，才见着一处薄薄的灵气。
      - id: cy_f_25
        text: 你把心法默了一遍又一遍，睡梦里都在吐纳。
      - id: cy_f_26
        text: 山中方一日，你打坐时却觉着过了一季，睁眼仍是叶未黄。
      - id: cy_f_27
        text: 你的灵台比去年清明了几分，杂念像被雨洗过。
      - id: cy_f_28
        text: 你在{place}的瀑布下练气，水声震耳，心却静得能听见针落。
      - id: cy_f_29
        text: 这一年你明白了欲速则不达，把招式又拆回最慢的几式。
      - id: cy_f_30
        text: 你于月下观想，灵质如潮，涨落都顺着呼吸。
      - id: cy_f_31
        text: 练功的旧衣磨破了袖口，你的拳脚却比从前沉实。
      - id: cy_f_32
        text: 你在{place}的竹林里走桩，一步一响，踩出满地的节律。
      - id: cy_f_33
        text: 这一年的修行像煮药，火候不到，只能慢慢熬。
      - id: cy_f_34
        text: 你把杂念扫进香炉，随青烟一起散在风里。
      - id: cy_f_35
        text: 内视时你看见灵质里还有几处淤结，便日日去温养它们。
      - id: cy_f_36
        text: 你在{place}的雪夜里练气，呼出的白气久久不散。
      - id: cy_f_37
        text: 这一年你的境界没有提升，根基却扎得比从前更深。
      - id: cy_f_38
        text: 你学会了在嘈杂处守静，闹市里也能照常吐纳。
      - id: cy_f_39
        text: 打坐醒来，你的衣襟上落了一层薄薄的松针。
      - id: cy_f_40
        text: 一年修行，你的眼神里多了点东西，说不上来，却骗不了人。
    buckets:
      - when:
          form: human
        variants:
          - id: cy_h_01
            text: 你在闹市里练功，把车马声都关在耳朵外面。
          - id: cy_h_02
            text: 旁人看不出你在修行，你只在呼吸间偷一点灵气。
          - id: cy_h_03
            text: 你把心法写满了一面墙，又一条一条擦去，只留最顺手的一句。
          - id: cy_h_04
            text: 城里的学堂散学过，你就着他们的钟声收功，准得像上了发条。
          - id: cy_h_05
            text: 你在菜市口练吐纳，葱姜味里竟也炼出了一点干净的气。
          - id: cy_h_06
            text: 你在城市的楼顶打坐，把霓虹都看成一粒粒浮光。
          - id: cy_h_07
            text: 通勤路上你默念心法，把拥挤的车厢当成了道场。
          - id: cy_h_08
            text: 这一年你只在深夜练功，等整座城都睡了才入定。
          - id: cy_h_09
            text: 你在{place}的小院里种了几味药草，练功之余也学着辨气。
          - id: cy_h_10
            text: 凡人的日子里藏着修行，你把买菜、煮饭都走成了桩功。
          - id: cy_h_11
            text: 你拜了一位民间师父，学的不是招式，是先学站得稳。
          - id: cy_h_12
            text: 这一年你把闹市的喧声都听顺了，反而得了几分静。
      - when:
          form: animal_yao
        variants:
          - id: cy_ay_01
            text: 你躲在{place}的山洞里修行，尾巴盘成一圈护着心口。
          - id: cy_ay_02
            text: 吞吐月华的那些夜，你的毛发都亮了一层。
          - id: cy_ay_03
            text: 你追着一缕山风跑，跑着跑着，呼吸和风合成了一路。
          - id: cy_ay_04
            text: 每逢月圆你便爬到高处朝拜，把一身妖气晒得又清又亮。
          - id: cy_ay_05
            text: 你在溪边练爪，一下轻一下重，最后听水声就调顺了气息。
          - id: cy_ay_06
            text: 你在{place}的野地里晒月亮，把月华一点点吸进皮毛。
          - id: cy_ay_07
            text: 这一年你学会了控制妖力，不再一激动就现出原形。
          - id: cy_ay_08
            text: 你追着灵气的味道跑，跑遍了{place}的沟沟坎坎。
          - id: cy_ay_09
            text: 吞吐日精月华，你把一身杂毛都养得发亮。
          - id: cy_ay_10
            text: 你在山顶朝拜四方，四时的风都来替你顺气。
          - id: cy_ay_11
            text: 这一年你的兽性收了许多，连眼神都温驯下来。
          - id: cy_ay_12
            text: 你以身为器，把妖力在筋骨里一遍遍淬炼。
      - when:
          form: plant_yao
        variants:
          - id: cy_py_01
            text: 你在{place}的灵土里打坐，根须与地脉慢慢接上。
          - id: cy_py_02
            text: 这一年的修行，是把日头化成光，再一点一点存进叶里。
          - id: cy_py_03
            text: 你借着雨水洗筋伐髓，把杂质都从叶尖排出去。
          - id: cy_py_04
            text: 风吹叶动，你便随风练功，一枝一叶都像在吐纳。
          - id: cy_py_05
            text: 你把根往地脉深处探，触到一丝极淡的灵气，如获至宝。
          - id: cy_py_06
            text: 这一年你的年轮多了一圈，那圈里刻着的都是静。
          - id: cy_py_07
            text: 你在{place}的夜里开了一次花，灵气顺着花心聚成露。
          - id: cy_py_08
            text: 你学会了把光阴收进种子里，来年再慢慢发出来。
          - id: cy_py_09
            text: 静立的一年，你的枝干越发挺直，像终于站稳了脚跟。
          - id: cy_py_10
            text: 你把周遭草木的呼吸都听在叶里，练就一身同气连枝的静。
          - id: cy_py_11
            text: 这一年的修行藏在叶脉里，旁人只当你年年地绿。
          - id: cy_py_12
            text: 你在{place}的向阳坡上，把光、水、土都炼成自己的灵。
      - when:
          form: fungus_yao
        variants:
          - id: cy_fy_01
            text: 你在{place}的背阴处入定，菌丝便是你的经脉。
          - id: cy_fy_02
            text: 这一年的修行，是让每一条菌丝都学会吐纳。
          - id: cy_fy_03
            text: 你从朽木里汲养分，也汲那一点点将散未散的灵。
          - id: cy_fy_04
            text: 暗处修行最是不易，你偏把黑都熬成了自己的静。
          - id: cy_fy_05
            text: 你把菌褶一开一合，像在替这方天地轻轻呼吸。
          - id: cy_fy_06
            text: 这一年你的菌丝探过每一寸土，把地气都摸熟了。
          - id: cy_fy_07
            text: 你在{place}的树根下听经，把木心深处的低语都收下。
          - id: cy_fy_08
            text: 没有叶的你在暗处修，修的是不见天日也能向内的光。
          - id: cy_fy_09
            text: 你借一场潮气化开郁结，菌丝又轻快了几分。
          - id: cy_fy_10
            text: 这一年的功夫都长在看不见的地方，只你自己知道。
          - id: cy_fy_11
            text: 你把孢子当作念头，撒出去，再收回来时已换了心境。
          - id: cy_fy_12
            text: 你在{place}的腐土里结庐，以腐朽为炉，炼一点新生。
      - when:
          form: spirit_yao
        variants:
          - id: cy_sy_01
            text: 你在{place}的山巅打坐，任风穿过你这具若有若无的形。
          - id: cy_sy_02
            text: 没有肉身，你便以光为骨，以风为息，慢慢聚形。
          - id: cy_sy_03
            text: 这一年的修行，是把散乱的念头都收进一点灵光里。
          - id: cy_sy_04
            text: 你飘在{place}的云气里，把天地的清浊一点点分清。
          - id: cy_sy_05
            text: 你把游历当作功课，走一路，炼一路，形也实了一分。
          - id: cy_sy_06
            text: 没有口鼻，你仍学着吞吐，让灵气在体内转成暖。
          - id: cy_sy_07
            text: 你在{place}的古井边入定，看月影在井里圆了又缺。
          - id: cy_sy_08
            text: 这一年的你越发凝练，风过时，影子已不再轻易散。
          - id: cy_sy_09
            text: 你把自己的记忆炼成一粒光，日夜温养，越养越亮。
          - id: cy_sy_10
            text: 修行于你，是学会在这世间有一个不散的自己。
          - id: cy_sy_11
            text: 你在{place}的庙宇檐下听钟，一声声把灵台敲得澄明。
          - id: cy_sy_12
            text: 这一年的功夫，是让一阵风里，终于能住下一个你。
      - when:
          form: painted_yao
        variants:
          - id: cy_pty_01
            text: 你在{place}的案头入定，把香火与墨香都收进器身。
          - id: cy_pty_02
            text: 器物修行，炼的是器里的那点心。
          - id: cy_pty_03
            text: 这一年的你把纹路当作经络，灵气在釉下缓缓游走。
          - id: cy_pty_04
            text: 你日日被使用，也日日被温养，器身愈发通透。
          - id: cy_pty_05
            text: 你在{place}的供桌上听经，一字一句都渗进胎土里。
          - id: cy_pty_06
            text: 没有手脚，你便以器为身，修一份不动如山的定。
          - id: cy_pty_07
            text: 这一年的你把火候、水土都炼成自己的一部分。
          - id: cy_pty_08
            text: 你从旧物的斑驳里悟出，残缺也能养出圆满。
          - id: cy_pty_09
            text: 你在{place}的窗台上接光，把每一缕日头都存成灵。
          - id: cy_pty_10
            text: 器物的一呼一吸很轻，你练了一整年才听见自己的气。
          - id: cy_pty_11
            text: 你把被使用的痕迹都炼成了年岁，越用越有神。
          - id: cy_pty_12
            text: 这一年的修行，是让一件死物，慢慢有了温热的灵。

  rich_land_offer:
    prompt: 一处灵质丰美的山林愿意收留你，只消交出这些年的积蓄。山风把门推开了半扇。去吗？
    fallback:
      - id: rlo_f_01
        text: 山林的使者在{place}外等你，袖口沾着远山的露水。
      - id: rlo_f_02
        text: 那处灵地隔着薄雾朝你招手，你数了数这些年攒下的行囊。
      - id: rlo_f_03
        text: 有人把一纸地契放在你面前，墨迹里混着草木的气息。
      - id: rlo_f_04
        text: 那处灵地的地契在你桌上铺了一夜，边角被风吹得轻轻翘起。
      - id: rlo_f_05
        text: 你数了数这些年的积蓄，又把银钱数了一遍，再数一遍。
      - id: rlo_f_06
        text: 山林的使者留下一个地址，说山门会一直替你留着。
      - id: rlo_f_07
        text: 那封邀你入山的信，笔迹清瘦，像是山泉写的。
      - id: rlo_f_08
        text: 你开始盘算行囊，又舍不得窗下那棵亲手栽的树。
      - id: rlo_f_09
        text: 灵地的消息像一颗投进井里的石子，你心里久久不静。
      - id: rlo_f_10
        text: 你把积蓄摊在灯下，它们和那处灵地一样，都是你的底。
      - id: rlo_f_11
        text: 有人劝你安顿下来，也有人说，灵地再好，终究是别人的山。
      - id: rlo_f_12
        text: 那处山林吹来的风，隔着一封信都闻得出松香。
      - id: rlo_f_13
        text: 你对着地契上的山界图描了又描，指尖沾了墨。
      - id: rlo_f_14
        text: 灵地开出的价码不高，却恰好要你掏出全部的安稳。
      - id: rlo_f_15
        text: 你在夜里梦见自己一脚踏进那片山林，醒来枕边微凉。
      - id: rlo_f_16
        text: 使者走时留下一串山果，个个都红得发亮。
      - id: rlo_f_17
        text: 你收拾好一半的行囊，另一半还摊着，拿不定主意。
      - id: rlo_f_18
        text: 那处灵地的门虚掩着，山风替它开开合合。
      - id: rlo_f_19
        text: 你把积蓄换成一纸地契，还是赌上一整个人生，你想了很久。
      - id: rlo_f_20
        text: 灵地的水汽养人，你听去过的人这样说，说得你心痒。
      - id: rlo_f_21
        text: 这一程若去，便是把根扎进别人的山里了。
      - id: rlo_f_22
        text: 你在{place}望了望来路，又望了望那处远山。
      - id: rlo_f_23
        text: 使者说山里的灵脉正旺，只等一个肯常住的人。
      - id: rlo_f_24
        text: 你摩挲着那张地契，纸上的墨香和山香混作一处。
      - id: rlo_f_25
        text: 那处灵地丰美得不像真事，你反倒犹豫起来。
      - id: rlo_f_26
        text: 你把门前的土又松了松，像在替谁做最后的决定。
      - id: rlo_f_27
        text: 灵地的聘书搁在旧箱子上，箱子上积了薄薄一层灰。
      - id: rlo_f_28
        text: 你问自己这一生求什么，答案却总在嘴边打转。
      - id: rlo_f_29
        text: 山门为谁开，风为谁停，你一时都想不明白。
      - id: rlo_f_30
        text: 你把那封信折好放回怀里，山不等人，人却还要踌躇。
    buckets:
      - when:
          region: forest
        variants:
          - id: rlo_fo_01
            text: 林中的灵地夹在两山之间，溪水在卵石上叮咚地响。
          - id: rlo_fo_02
            text: 山林的使者拨开藤蔓，把一捧清泉捧到你面前。
          - id: rlo_fo_03
            text: 老树下的灵脉汩汩地冒，连泥土都透着一股灵气。
          - id: rlo_fo_04
            text: 你随使者进了山，松针铺地，软得叫人落脚无声。
          - id: rlo_fo_05
            text: 那处林间空地的灵气最肥，草木都绿得发亮。
          - id: rlo_fo_06
            text: 山鸟在前头带路，把你引到一处落满花的门槛。
          - id: rlo_fo_07
            text: 林中的灵地只有一条小径可入，像专为你留的。
          - id: rlo_fo_08
            text: 你在山泉边蹲下，水里的灵气凉丝丝地漫上指尖。
      - when:
          region: city
        variants:
          - id: rlo_ci_01
            text: 城里的灵地藏在一片旧厂区后头，铁门锈成了暗红色。
          - id: rlo_ci_02
            text: 你照着地址找到楼顶，几盆野草竟在水泥缝里养出了灵气。
          - id: rlo_ci_03
            text: 那处灵地就在城中公园的老井旁，井台还泊着一层露水。
          - id: rlo_ci_04
            text: 闹市里的一角灵地，隔着人声，静得几乎听不见。
          - id: rlo_ci_05
            text: 使者带你穿过窄巷，一盏旧灯把灵地的门照了出来。
          - id: rlo_ci_06
            text: 城里的灵地要价不低，却守着整条街最静的月光。
          - id: rlo_ci_07
            text: 你在天台上看见那角灵地，灵气像烟一样从墙缝里冒。
          - id: rlo_ci_08
            text: 临街的灵地窗上糊着旧报纸，风一吹，沙沙作响。
      - when:
          region: guild_land
        variants:
          - id: rlo_gl_01
            text: 会馆领地把一块临水的园子许给你，石桌旁已生了青苔。
          - id: rlo_gl_02
            text: 领地的灵地靠近会馆的库房，夜里能听见账房的算珠声。
          - id: rlo_gl_03
            text: 会馆主事说那处园子正空着，只等人去把荒草坐实。
          - id: rlo_gl_04
            text: 你在领地的灵地前量了量步数，够种几垄菜，也够安一张床。
          - id: rlo_gl_05
            text: 那处园子的灵气顺墙根爬，藤蔓都长得比别处青。
          - id: rlo_gl_06
            text: 会馆许你的灵地带着一间旧屋，屋瓦有几片松了。
          - id: rlo_gl_07
            text: 领地的灵地离会馆钟楼近，早晚都听得见钟声。
          - id: rlo_gl_08
            text: 你在园里的石阶上坐下，青苔凉凉地贴着手心。
      - when:
          region: hermit_island
        variants:
          - id: rlo_hi_01
            text: 隐修岛南坡有片灵地，海风把崖上的草都吹成了斜的。
          - id: rlo_hi_02
            text: 岛上的灵地临着海，涨潮时浪花能溅湿门槛。
          - id: rlo_hi_03
            text: 那处山坡的灵气常年不散，雾里都隐着一层淡青。
          - id: rlo_hi_04
            text: 你坐船去看那处灵地，水天之间，一小片安稳。
          - id: rlo_hi_05
            text: 岛主把灵地指给你，说夜里能听见灵脉鼓动的声音。
          - id: rlo_hi_06
            text: 那处灵地背风向阳，几株海桐把根扎得很深。
          - id: rlo_hi_07
            text: 你在岛上的灵地边站了许久，海盐味混着灵气。
          - id: rlo_hi_08
            text: 隐修岛的灵地要你渡海去住，你把船票在指间捻了又捻。

  init_tier:
    fallback:
      - id: it_f_01
        text: 你第一次触到自己的灵质，像摸到身体里一条温凉的河。
      - id: it_f_02
        text: 入门那日，你只学了呼吸，却听见了灵气流动的声音。
      - id: it_f_03
        text: 你把散乱的灵质收拢成一束，从此心口多了一盏小小的灯。
      - id: it_f_04
        text: 你照着师父的口诀结印，指节生涩，却觉着掌心有点发烫。
      - id: it_f_05
        text: 入门的第一课是坐，你在蒲团上一坐就是半日，腿麻也忍着。
      - id: it_f_06
        text: 你第一次看见灵气，细细的一缕，像香炉里爬出来的青烟。
      - id: it_f_07
        text: 师父说不必急着求，你便先把心放平，像掬起一捧水。
      - id: it_f_08
        text: 定下凡体的那日，你觉着自己的呼吸有了重量。
      - id: it_f_09
        text: 你把手按在丹田，那里第一次传来轻轻的回应。
      - id: it_f_10
        text: 入门礼上你穿的是旧衣，香火却把你照得很亮。
      - id: it_f_11
        text: 你学着把念头收住，杂念却像檐下的雨，滴个不停。
      - id: it_f_12
        text: 第一次引气入体，你打了个寒颤，又像是被温水浸过。
      - id: it_f_13
