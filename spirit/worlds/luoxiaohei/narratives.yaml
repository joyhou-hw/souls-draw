      - id: gn_f_17
        text: 你从一片朦胧里走出来，回头看，来路已经合上了。
      - id: gn_f_18
        text: 凝形之后，你看什么都比从前清楚了几分。
      - id: gn_f_19
        text: 你把自己的轮廓描了又描，描到指尖发颤也不肯停。
      - id: gn_f_20
        text: 那一夜你成了形，{place}的月光正好落在你肩上。
    buckets:
      - when:
