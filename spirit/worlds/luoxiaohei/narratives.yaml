        text: 你与灵之间的那根线断了，你在{place}里喊，回声都陌生。
      - id: lly_f_06
        text: 御灵受创后，你的指尖还做着从前召唤的姿势，却什么也唤不来。
      - id: lly_f_07
        text: 你听见风里有动静，竖起耳朵，却再不是熟悉的回应。
      - id: lly_f_08
        text: 那灵走的时候没留一句话，只在门边留下一小片凉。
      - id: lly_f_09
        text: 你在旧日的召唤阵前坐了一夜，符文冷得像霜。
      - id: lly_f_10
        text: 你试着把灵质聚成往日的形状，散了又聚，聚了又散。
      - id: lly_f_11
        text: 失去御灵之后，你的{place}安静得能听见自己的回音。
      - id: lly_f_12
        text: 你唤它的名字，声音落进风里，连个浪花都没起。
      - id: lly_f_13
        text: 那根灵弦断了，你胸口一直绷着的那点东西也松了。
      - id: lly_f_14
        text: 你翻出旧时喂它的食盆，擦得干干净净，摆在原处。
      - id: lly_f_15
        text: 御灵受创的那阵子，你连走路都轻手轻脚，怕惊了什么。
      - id: lly_f_16
        text: 你在夜里点了一盏小灯，等一个再也不会来的回应。
      - id: lly_f_17
        text: 你照着旧法画下召唤的符，最后一笔落下，符纸却一点没热。
      - id: lly_f_18
        text: 那灵从前最爱跟在你脚边，如今那个位置空着，风一吹就没了。
      - id: lly_f_19
        text: 你在{place}的每个角落都找过，只找到几处它睡过的暖印。
      - id: lly_f_20
        text: 御灵伤得重，你连梦里都听见它在很远的地方应你，睁眼却什么都没有。
      - id: lly_f_21
        text: 你把自己关在屋里，一遍遍温习从前与它配合的招式，越练越空。
      - id: lly_f_22
        text: 那根灵弦断后，{place}的鸟叫都显得格外响，像在替你喊谁。
      - id: lly_f_23
        text: 你不再轻易开口唤灵，怕再听一次没有回应的寂静。
      - id: lly_f_24
        text: 旧时的铃铛还挂在门上，风一吹就响，响得人心里发紧。
      - id: lly_f_25
        text: 你试着把散掉的灵一点一点召回，召回的却只有满室空寂。
      - id: lly_f_26
        text: 御灵受创后，你与万物之间的那点默契都淡了，花开草动与你无关。
      - id: lly_f_27
        text: 你在夜里翻来覆去，总觉得缺了它匀匀的鼾声，屋子太静。
      - id: lly_f_28
        text: 你把它走时踏过的地面擦干净，又铺了一层薄薄的干草。
      - id: lly_f_29
        text: 那灵留下的最后一点气息也在风里散了，你站在那里，久久没动。
      - id: lly_f_30
        text: 你在{place}里立了一小方无名的石，算作它来过一场的念想。

  scene_forest_childhood:
    fallback:
      - id: sfy_f_01
        text: 童年的{place}，你追着萤火跑过一整片林子，鞋底沾满青苔。
      - id: sfy_f_02
        text: 你在老树的枝桠间搭了个窝，把野果和阳光一起藏进去。
      - id: sfy_f_03
        text: 林间的小溪边，你第一次照见自己的妖形，笑得跌进水里。
      - id: sfy_f_04
        text: 你和林里的小妖们捉迷藏，惊起满枝的雀，也惊起半坡的笑。
      - id: sfy_f_05
        text: 你在树洞里过夜，听了一宿松涛，天亮时头发里落满松针。
      - id: sfy_f_06
        text: 你把野莓塞满衣兜，回家时手和嘴都染成了紫色。
      - id: sfy_f_07
        text: 光脚踩过溪底的鹅卵石，凉意顺着脚心一直爬到耳根。
      - id: sfy_f_08
        text: 你追着一只兔子跑丢了路，最后是萤火把你领回了家。
      - id: sfy_f_09
        text: 树梢上的月亮又圆又近，你伸手去够，够下一把碎银子似的光。
      - id: sfy_f_10
        text: 你和伙伴用藤蔓编秋千，荡到最高处，风都替你们喝彩。
      - id: sfy_f_11
        text: 你在林子里捡到半片蝉蜕，对着光看了又看，像件小衣裳。
      - id: sfy_f_12
        text: 雨后你踩着泥坑蹦跶，新雨把整片林子洗得发亮。
      - id: sfy_f_13
        text: 你在老树根下埋了一颗松子，说好明年一起来看。
      - id: sfy_f_14
        text: 山风把你的纸鹞吹得东倒西歪，最后挂在了最高的枝上。
      - id: sfy_f_15
        text: 你躺在草地上看云，看着看着就睡进了云里。
      - id: sfy_f_16
        text: 偷吃蜂巢被抓了个正着，你肿着脸跑，身后嗡嗡响了一路。
      - id: sfy_f_17
        text: 你在溪边堆石子，堆到天黑也不肯走，像个笃定的小工匠。
      - id: sfy_f_18
        text: 林子里下了一场花雨，你仰着脸，兜了一身的花瓣回家。
      - id: sfy_f_19
        text: 你跟一只松鼠抢松果，抢到一半又笑着分给它一半。
      - id: sfy_f_20
        text: 童年的{place}总是绿得晃眼，连梦都浸着草木的清气。
    buckets:
      - when:
          region: forest
        variants:
          - id: sfy_fo_01
            text: 林间的露水打湿你半个裤脚，你照旧跑得飞快。
          - id: sfy_fo_02
            text: 你在密林深处有个秘密基地，入口只有你知道。
          - id: sfy_fo_03
            text: 树影把你的影子切成碎花，你在碎花里跳来跳去。
          - id: sfy_fo_04
            text: 你趴在地上看一场蚂蚁搬家，一趴就是半日。
          - id: sfy_fo_05
            text: 老林子的雾起时，你和小妖们在雾里各玩各的迷藏。
          - id: sfy_fo_06
            text: 你折了根树枝当剑，在空地上耍得落叶纷飞。
      - when:
          region: city
        variants:
          - id: sfy_ci_01
            text: 你在城里的小巷里追着一只纸船，水沟把黄昏映得发亮。
          - id: sfy_ci_02
            text: 街坊的孩子在天井里跳房子，你数着格子数进了夏天。
          - id: sfy_ci_03
            text: 你把捡来的糖纸夹满一本旧书，风一吹就沙沙地响。
          - id: sfy_ci_04
            text: 巷口的槐树下，你和玩伴争一枚铜板，争着争着都笑了。
          - id: sfy_ci_05
            text: 你在天桥的影子下学青蛙跳，一跳一跳跳过了童年。
          - id: sfy_ci_06
            text: 城市的蝉鸣又高又远，你趴在窗台上，和它较了一下午劲儿。
      - when:
          region: guild_land
        variants:
          - id: sfy_gl_01
            text: 会馆的练功场边，你和小妖们把扫帚耍成了风车。
          - id: sfy_gl_02
            text: 你在回廊里追自己的影子，追到墙根，影子却不见了。
          - id: sfy_gl_03
            text: 领地的老厨师给你塞了块糖，甜得你绕着院子跑了一圈。
          - id: sfy_gl_04
            text: 你坐在会馆的台阶上数门钉，数来数去总少一颗。
          - id: sfy_gl_05
            text: 同伴教你翻墙出去摘果子，回来时衣襟鼓鼓囊囊。
          - id: sfy_gl_06
            text: 会馆的钟响过三声，你还在后院的草堆里不肯出来。
      - when:
          region: hermit_island
        variants:
          - id: sfy_hi_01
            text: 海岛的风咸津津的，你把浪花追得上岸又退回。
          - id: sfy_hi_02
            text: 你在礁石的浅坑里养了只小蟹，天天来数它吐泡泡。
          - id: sfy_hi_03
            text: 退潮后的沙滩是你的画布，画完就被浪抹平了。
          - id: sfy_hi_04
            text: 你捡了一兜的贝壳，对着夕阳一个个地听海声。
          - id: sfy_hi_05
            text: 岛上的孩子会爬椰树，你学了几次，摔在沙里直乐。
          - id: sfy_hi_06
            text: 你在海边放纸船，看它摇摇晃晃地驶向没有岸的蓝。

  scene_guild_life:
    fallback:
      - id: sgl_f_01
        text: 会馆的清晨从洒扫开始，你在回廊下擦亮每一块青砖。
      - id: sgl_f_02
        text: 你坐在会馆的食堂里，一碗热汤下肚，连规矩都变得可亲。
      - id: sgl_f_03
        text: 名册上的名字越来越多，你添柴的手从没停过。
      - id: sgl_f_04
        text: 你跟着点卯，晨钟一响，满院子都是低低的应声。
      - id: sgl_f_05
        text: 会馆的规矩像廊柱一样立着，你一条条背，背到心里有了谱。
      - id: sgl_f_06
        text: 值夜的灯笼你一盏盏点过去，点出一个亮堂堂的院子。
      - id: sgl_f_07
        text: 后厨的蒸笼冒着白气，你端着一屉点心，走得像捧着月亮。
      - id: sgl_f_08
        text: 你在会馆的账房誊账，字写得慢，墨却洇得很正。
      - id: sgl_f_09
        text: 师兄师姐待你如自家小辈，随口的一句指点都够琢磨半日。
      - id: sgl_f_10
        text: 会馆的屋檐下挂满晾晒的衣裳，像开了满院子的花。
      - id: sgl_f_11
        text: 你扫着落叶，看秋一天天深下去，扫帚声也一天天钝了。
      - id: sgl_f_12
        text: 老管事把茶分你半盏，茶气里都是旧时光的味道。
      - id: sgl_f_13
        text: 你在练功场边看人拆招，看得入了神，忘了手里的活。
      - id: sgl_f_14
        text: 会馆的节庆你头一回张罗，忙得脚不沾地，也乐得合不拢嘴。
      - id: sgl_f_15
        text: 你和新来的小妖分食一块糕，糕很甜，话也多了起来。
      - id: sgl_f_16
        text: 暮色里会馆的飞檐像剪影，你收工后总要望上一会儿。
      - id: sgl_f_17
        text: 你把一株野花移进会馆的墙根，天天浇水，看它慢慢立住。
      - id: sgl_f_18
        text: 会馆里的人都叫你小名，叫得你像在这里生下来似的。
      - id: sgl_f_19
        text: 落雪那日你扫出一条路，从你门口一直扫到正堂。
      - id: sgl_f_20
        text: 你在会馆领地的日子安稳得像一碗白粥，暖胃，也暖心。
    buckets:
      - when:
          region: forest
        variants:
          - id: sgl_fo_01
            text: 山门外的会馆分堂藏在林深处，你每周都去点一次卯。
          - id: sgl_fo_02
            text: 你在林间的会馆驿站当值，来往的多是山里的散修。
          - id: sgl_fo_03
            text: 会馆的信使穿过密林为你送来月例，也捎来几句叮嘱。
          - id: sgl_fo_04
            text: 林中的会馆小得像座土地庙，你却把它洒扫得一尘不染。
          - id: sgl_fo_05
            text: 你守着林间的会馆法器库，听松涛当值，倒也不闷。
          - id: sgl_fo_06
            text: 会馆的同门进山采药，你就地起灶，给他们留一锅热饭。
      - when:
          region: city
        variants:
          - id: sgl_ci_01
            text: 城里的会馆藏在老楼里，进门要先对一句只有你知道的暗号。
          - id: sgl_ci_02
            text: 你在城里的会馆分堂值班，外卖电话和请灵符一起响。
          - id: sgl_ci_03
            text: 会馆的制服穿进城，像一滴墨溶进霓虹，不扎眼，也不显眼。
          - id: sgl_ci_04
            text: 你在城里的会馆看门，熟客都会朝你点点头。
          - id: sgl_ci_05
            text: 城里的会馆夜里有会，你烧水续茶，听他们议到天明。
          - id: sgl_ci_06
            text: 会馆门口的招牌小得可怜，知道的自然知道门怎么进。
      - when:
          region: guild_land
        variants:
          - id: sgl_gl_01
            text: 会馆领地是你的家，你在家自然要守家的规矩。
          - id: sgl_gl_02
            text: 你在会馆正堂听差，笔墨茶点，样样都要备得妥帖。
          - id: sgl_gl_03
            text: 领地的甬道你扫了一遭又一遭，扫得都能照见人影。
          - id: sgl_gl_04
            text: 会馆议事时你在屏风后伺候，大气也不敢出一口。
          - id: sgl_gl_05
            text: 你在会馆的藏书阁里晒书，一页页翻过去，像翻着岁月。
          - id: sgl_gl_06
            text: 会馆的老人们把你当孩子看，逢年过节总给你留一口好吃的。
      - when:
          region: hermit_island
        variants:
          - id: sgl_hi_01
            text: 会馆在隐修岛也有座小院，你被派去守岛，一守就是数月。
          - id: sgl_hi_02
            text: 岛上的会馆日常清淡，你清晨听经，傍晚听潮。
          - id: sgl_hi_03
            text: 会馆的补给船每月来一次，你在码头等它成了习惯。
          - id: sgl_hi_04
            text: 你在岛上替会馆看护一株灵草，潮气重，你要天天照看。
          - id: sgl_hi_05
            text: 隐修岛的会馆院子被海风腌出了咸味，你也一样。
          - id: sgl_hi_06
            text: 会馆来信问岛上的近况，你提笔，写的都是风和浪。

  scene_hermit_chance:
    fallback:
      - id: shc_f_01
        text: 隐修岛的老者只给你讲了半句话，你却想了整整一年。
      - id: shc_f_02
        text: 你在岛上听了一夜潮声，醒来时灵质里多了些说不清的东西。
      - id: shc_f_03
        text: 那人抬手在你额心一点，{place}的海风忽然有了方向。
      - id: shc_f_04
        text: 你寻遍全岛，只在一处断崖下见到那位隐修者闭目打坐。
      - id: shc_f_05
        text: 老者没报姓名，只给你倒了一盏茶，茶里浮着半片月亮。
      - id: shc_f_06
        text: 他指给你看潮涨潮落，说灵质也当如此，该进则进。
      - id: shc_f_07
        text: 你陪他扫了半日落叶，扫到黄昏，心也跟着静了下来。
      - id: shc_f_08
        text: 他教你的那套吐纳，你练了又练，直到海声都进了呼吸。
      - id: shc_f_09
        text: 隐修者说，你心里有结，结不解，灵质便走不长远。
      - id: shc_f_10
        text: 一句话点破了你的瓶颈，你愣在原地，像被海风吹透了。
      - id: shc_f_11
        text: 你在他门下住了七日，吃的是糙米，心里却前所未有的饱。
      - id: shc_f_12
        text: 老者送你到渡口，只说了句，回吧，天地自会教你。
      - id: shc_f_13
        text: 你把他讲的道理记在石上，涨潮时被浪抹去，你却记住了。
      - id: shc_f_14
        text: 那一指落下，你眼前仿佛有万顷波涛齐齐让开一条路。
      - id: shc_f_15
        text: 你在岛的黄昏里开悟，看海天相接，自己也化在那一线光里。
      - id: shc_f_16
        text: 他看你根骨尚可，又授了你半卷残经，字迹已有些模糊。
      - id: shc_f_17
        text: 与你同来的人都走了，你留了下来，只为多看几回潮。
      - id: shc_f_18
        text: 隐修者说修行如逆水行舟，你却在岛上学会了顺水。
      - id: shc_f_19
        text: 临别他拍拍你的肩，那掌心的暖意许久都不散。
      - id: shc_f_20
        text: 你在{place}的海边顿悟，原来灵气一直都在，只是心太吵。
    buckets:
      - when:
          region: forest
        variants:
          - id: shc_fo_01
            text: 林深处也藏着一间茅屋，你偶入其门，得一句指点。
          - id: shc_fo_02
            text: 老者的身影隐在松雾里，说来也怪，你一进林子就静了。
          - id: shc_fo_03
            text: 你在林泉边打坐，那隐修者自泉上踏叶而来。
          - id: shc_fo_04
            text: 他指着一棵老树说，根深则叶茂，你的根还不够深。
          - id: shc_fo_05
            text: 林中的鸟替你传了几句话，你却句句都听进了心里。
          - id: shc_fo_06
            text: 你在山寺的钟声里开悟，钟声荡开的涟漪久久不散。
      - when:
          region: city
        variants:
          - id: shc_ci_01
            text: 城市里也有一处闹中取静的所在，你在那儿遇见了高人。
          - id: shc_ci_02
            text: 那位隐者在老旧的书肆里等你，满屋纸页都有了光。
          - id: shc_ci_03
            text: 他坐在天桥下晒太阳，却一眼看穿了你的困顿。
          - id: shc_ci_04
            text: 城里的高人不多，肯点拨你的，只这一位。
          - id: shc_ci_05
            text: 你在深夜的茶楼里听他一席话，醒来时天已大亮。
          - id: shc_ci_06
            text: 他说，心若是闹市，深山也一样吵，你忽然就不慌了。
      - when:
          region: guild_land
        variants:
          - id: shc_gl_01
            text: 会馆请来的客卿点拨了你几句，句句都在你的关窍上。
          - id: shc_gl_02
            text: 你在会馆的藏经楼里得了本旧书，边角还夹着前人的批注。
          - id: shc_gl_03
            text: 会馆的老匠人教你打磨灵器，也顺带磨了你的性子。
          - id: shc_gl_04
            text: 一位退隐的前辈在会馆后堂与你对坐，茶过三巡才开口。
          - id: shc_gl_05
            text: 你在会馆的演武场上被点醒，一招一式都有了来路。
          - id: shc_gl_06
            text: 领地里的人都受过他的恩，你也得了半日的开导。
      - when:
          region: hermit_island
        variants:
          - id: shc_hi_01
            text: 隐修岛的老者终于肯见你，只问了你一句，为何而来。
          - id: shc_hi_02
            text: 你在海边的木屋外候了三天，他出来时带了一身海雾。
          - id: shc_hi_03
            text: 他教你对着涨潮吐纳，把浪声都收进丹田。
          - id: shc_hi_04
            text: 岛上的日子慢，你的心也慢下来，灵质却越发活络。
          - id: shc_hi_05
            text: 他在礁石上给你画了一道符，浪花打上来，一半亮着。
          - id: shc_hi_06
            text: 你离开隐修岛那日，老者说，潮水会记住你的足音。

  shock_urban_dev:
    fallback:
      - id: sud_f_01
        text: 推土机开进{place}那年，你看着祖辈的树一棵棵倒下去。
      - id: sud_f_02
        text: 高楼盖起来的地方，你再也闻不到童年林子的土腥味。
      - id: sud_f_03
        text: 你守了一夜没走，天亮时，那片林只剩下一地木屑。
      - id: sud_f_04
        text: 新修的马路从你家的菜园中间穿过，你站在路牙子上发了会儿呆。
      - id: sud_f_05
        text: 你和邻居们把最后一口井填平，井底还沉着几枚童年的铜钱。
      - id: sud_f_06
        text: 拆迁公告贴出来那天，你在门口坐了很久，手里的烟一直燃到指节。
      - id: sud_f_07
        text: 旧屋被拆成废墟，你在瓦砾里捡回一只缺了口的陶碗。
      - id: sud_f_08
        text: 你搬进了楼房，夜里却总听见风穿过老宅门缝的声音。
      - id: sud_f_09
        text: 儿时常爬的那棵树被连根拔走，你只在原地站了一小会儿。
      - id: sud_f_10
        text: 挖掘机的轰鸣盖过了蝉鸣，你捂住耳朵，还是没能拦住那个夏天。
      - id: sud_f_11
        text: 你在搬迁的卡车上回头，看见{place}的旧街景一点点变小。
      - id: sud_f_12
        text: 开发商在村口立了块新牌子，你一个字一个字读完，心里空落落。
      - id: sud_f_13
        text: 你守着最后一片自留地，像守着一个不肯醒来的旧梦。
      - id: sud_f_14
        text: 老邻居一家家搬走，你在空荡荡的巷子里走了一遍又一遍。
      - id: sud_f_15
        text: 你把老宅的门牌号拆下来收好，生怕日后忘了自己从哪来。
      - id: sud_f_16
        text: 新楼的地基挖到一眼古井，施工停了半日，又继续往深处打。
      - id: sud_f_17
        text: 你站在脚手架的影子里，抬头数新楼，数到一半就数不清了。
      - id: sud_f_18
        text: 故乡的地名没变，可你闭着眼，已经想不起它从前的模样。
      - id: sud_f_19
        text: 你用纸箱装走一屋子家当，最沉的却是几本泛黄的相册。
      - id: sud_f_20
        text: 那天之后，你学会了在陌生街道里拐进一家不认人的小店。
    buckets:
      - when:
          era: ancient
        variants:
          - id: sud_an_01
            text: 官府的驿道要修过{place}的老槐，你跪在树下，护了它一整天。
          - id: sud_an_02
            text: 旧城墙被拆了去建官仓，你从砖隙里抠下一块，揣进怀里。
          - id: sud_an_03
            text: 你把祖上传下的田契贴身收着，可推来的官文比刀还硬。
          - id: sud_an_04
            text: 河上要架新桥，你撑着自己的小船，在桥墩下来回打转。
          - id: sud_an_05
            text: 老戏台拆了那日，你在台下坐了一夜，哼了几句没人听的老调。
          - id: sud_an_06
            text: 你牵着一头不肯挪步的老牛，走出被圈作官地的田。
      - when:
          era: modern
        variants:
          - id: sud_mo_01
            text: 塔吊在{place}的夜空里亮着，你数了半宿，也没数清它转了几圈。
          - id: sud_mo_02
            text: 你挤在早高峰的地铁里，想起从前翻过山头去上学的路。
          - id: sud_mo_03
            text: 旧街改造的围挡越拉越长，你在围挡前停下，辨了辨方向。
          - id: sud_mo_04
            text: 你签完拆迁协议，笔尖在纸上顿了很久，终究没有抬头。
          - id: sud_mo_05
            text: 新商圈开业那晚，你隔着玻璃看人群，像看别人的热闹。
          - id: sud_mo_06
            text: 你把老宅的钥匙交给开发商，掌心空了，又似乎沉了几分。

  shock_liqi_tide:
    fallback:
      - id: slt_f_01
        text: 灵气潮汐涌来，你张开全身，像久旱的河床迎上一场雨。
      - id: slt_f_02
        text: 那一夜{place}的灵气涨过了头，你连呼吸都带着微光。
      - id: slt_f_03
        text: 潮汐来时你正在打坐，整个人像被泡在温热的星海里。
      - id: slt_f_04
        text: 你看见街头的灯笼无风自亮，才知灵气已经漫过了脚踝。
      - id: slt_f_05
        text: 你在灵潮里听见许多细碎的低语，却一个字也抓不住。
      - id: slt_f_06
        text: 那夜你忍不住化了原形，在灵质的光里打了个滚。
      - id: slt_f_07
        text: 灵气涨满的那几日，你夜里总睡不着，浑身像揣着一团火。
      - id: slt_f_08
        text: 你随着人潮去争一口灵泉，抢到手里时，只剩半捧清水。
      - id: slt_f_09
        text: 灵潮过后，{place}的草木一夜疯长，你差点找不着回家的路。
      - id: slt_f_10
        text: 你闭着眼睛走了一段路，是灵潮替你辨的方向。
      - id: slt_f_11
        text: 潮头打来的时候，你扶住了身边一个快要被光吞没的生灵。
      - id: slt_f_12
        text: 你把采来的灵气一点点存进丹田，存到后来，指尖都发亮。
      - id: slt_f_13
        text: 那阵子连灶膛里的火都泛着青，你煮的粥格外香。
      - id: slt_f_14
        text: 灵潮退去那天，你在干裂的河床上捡到几枚会发亮的石子。
      - id: slt_f_15
        text: 你跟着一群{species}去追潮，追到半路，潮已经退了。
      - id: slt_f_16
        text: 你在灵潮里照见自己的前世，一晃眼，又什么都记不得了。
      - id: slt_f_17
        text: 灵气的浪头把你掀了个跟头，你爬起来时，浑身都轻了几分。
      - id: slt_f_18
        text: 那一夜你听见整片山林都在拔节生长，声音细密如雨。
      - id: slt_f_19
        text: 你把手伸进灵潮里，捞起一缕，看它从指缝慢慢漏回夜空。
      - id: slt_f_20
        text: 潮汐过后，你的修为涨了一截，却也更难安睡。
    buckets:
      - when:
          era: ancient
        variants:
          - id: slt_an_01
            text: 古书上说百年一遇的灵潮，你竟赶上了，{place}的夜都被染亮。
          - id: slt_an_02
            text: 你学着老辈的样子，在灵潮里埋下一枚符，等来年发芽。
          - id: slt_an_03
            text: 山里的灵潮涌过，古树一夜开花，你把落花都收进了药篓。
          - id: slt_an_04
            text: 你在灯下誊抄养气诀，灵潮从窗缝钻进，字都像活了。
          - id: slt_an_05
            text: 灵潮那夜，道观里钟自鸣，你与一群小道士跪了整晚。
          - id: slt_an_06
            text: 你循着灵潮走向山巅，看见云海之上有座半透明的城。
      - when:
          era: modern
        variants:
          - id: slt_mo_01
            text: 城里的灵气浓得指示灯都飘了起来，你扶着路牌走了半条街。
          - id: slt_mo_02
            text: 灵潮撞上了{place}的电网，整片街区忽明忽暗，像在呼吸。
          - id: slt_mo_03
            text: 你在地铁里赶上了灵潮，车厢里人人发梢都浮着一层光。
          - id: slt_mo_04
            text: 写字楼的玻璃幕墙映出灵潮，你盯着看了很久，像看极光。
          - id: slt_mo_05
            text: 那一夜你的手机信号时有时无，只有心跳跟着灵潮一起涨。
          - id: slt_mo_06
            text: 灵潮过后，你楼顶的绿植蹿了一夜，把晾衣绳都缠住了。

  shock_plague:
    fallback:
      - id: sp_f_01
        text: 疫病之年，你把自己关在屋里，煎药的火光照着空荡荡的街。
      - id: sp_f_02
        text: 邻里的咳嗽声此起彼伏，你数着窗外的担架，一夜没合眼。
      - id: sp_f_03
        text: 你在床前守了很久，最后只在掌心留下一点凉掉的药渣。
      - id: sp_f_04
        text: 你戴上自制的布罩出门，整条街静得能听见自己的脚步。
      - id: sp_f_05
        text: 药铺前排着长队，你攥着几枚铜板，一直排到日头偏西。
      - id: sp_f_06
        text: 你把自己种的那几垄药草都炖了，汤药苦得人直皱眉。
      - id: sp_f_07
        text: 发热的那几天，你躺在榻上数房梁，数来数去都数错。
      - id: sp_f_08
        text: 你给邻家孩子送去半包药，隔天再去，那扇门却再没开。
      - id: sp_f_09
        text: 疫中你学会了分辨各种咳嗽，哪种无碍，哪种让人心头发紧。
      - id: sp_f_10
        text: 你在井水里浸了又浸，生怕自己也成了别人的祸。
      - id: sp_f_11
        text: 有人说艾草能辟疫，你把门窗熏得发黄，像给屋子糊了层纸。
      - id: sp_f_12
        text: 那些日子你吃得极省，把硬粮都留给了家里最小的那个。
      - id: sp_f_13
        text: 你在夜里听见更夫远远报平安，一声一声，敲得人安心。
      - id: sp_f_14
        text: 病愈之后你见什么都想哭，连窗外的麻雀都显得金贵。
      - id: sp_f_15
        text: 你替人守过一夜的灵，天亮时，第一声鸟叫几乎让你落泪。
      - id: sp_f_16
        text: 疫后你走出家门，照着日头站了很久，像刚学会走路。
      - id: sp_f_17
        text: 你把死去邻居的旧物小心收好，想着有朝一日还给他们后人。
      - id: sp_f_18
        text: 那场疫把{place}的人家带走了一半，你在空屋里住了很久。
      - id: sp_f_19
        text: 你学会了在药里加一点糖，苦也苦得有个盼头。
      - id: sp_f_20
        text: 疫病退去后，你把院子里荒掉的菜畦重新翻了一遍。
    buckets:
      - when:
          era: ancient
        variants:
          - id: sp_an_01
            text: 瘟疫过境时，你把香灰拌进饭里，只求心里能踏实些。
          - id: sp_an_02
            text: 赤脚郎中在{place}摆了个摊，你记下了他说的每一味药。
          - id: sp_an_03
            text: 你跟着乡人抬水洒石灰，手上磨出的茧又厚了一层。
          - id: sp_an_04
            text: 那阵子家家闭户，你隔着门缝与人递药，连脸都看不清。
          - id: sp_an_05
            text: 你为死去的族人守夜，火盆里的纸灰飘了老高。
          - id: sp_an_06
            text: 灾年之后，你在村口种下一排柳，给走掉的人留个念想。
      - when:
          era: modern
        variants:
          - id: sp_mo_01
            text: 手机里每天推送着数字，你把窗子关紧，又去洗了遍手。
          - id: sp_mo_02
            text: 你在阳台上囤了几袋米面，夜里听见楼道有脚步声就屏息。
          - id: sp_mo_03
            text: 救护车的灯在{place}的街口闪过，你数着它去了几家。
          - id: sp_mo_04
            text: 你隔着屏幕与人视频，那头的光晃着，彼此都瘦了。
          - id: sp_mo_05
            text: 解封那日你走出小区，发现街边的树绿得扎眼。
          - id: sp_mo_06
            text: 你给远方报了声平安，放下手机时，窗外正起风。

# ── 里程碑题注（narrativeFeed.milestones 声明的事件 → 照片式文本快照）──
milestones:
  scene_first_transform:
    - id: ms_sft_01
      text: 化形那夜的你——{place}，月光正好。
    - id: ms_sft_02
      text: 照片记下了你成为"人"的第一天。背景是{place}的老槐树。
    - id: ms_sft_03
      text: 照片里的你刚学会站直，脚还有些不自然地并拢。
    - id: ms_sft_04
      text: 你化成人形的第一张像，衣领都没整理好，眼睛却亮得吓人。
    - id: ms_sft_05
      text: 快照定格的那一刻，你正对着镜子摸自己的耳朵。
    - id: ms_sft_06
      text: 那天的{place}，你真真正正用两条腿走了起来。
    - id: ms_sft_07
      text: 照片里你笑得有点慌，像刚学会玩笑的孩子。
    - id: ms_sft_08
      text: 你把这副皮相看了又看，按下快门的瞬间还愣着。
    - id: ms_sft_09
      text: 照片角上写着日期，是你成为人形的那天。
    - id: ms_sft_10
      text: 你在{place}的街头第一次以人样买糖，找零都忘了拿。
    - id: ms_sft_11
      text: 镜头里的你半人半影，化形还没能完全收住。
    - id: ms_sft_12
      text: 你留下了第一件人穿的衣裳，照片里大了半号。
    - id: ms_sft_13
      text: 照片背面有一行小字，记得是你自己写下的新名字。
    - id: ms_sft_14
      text: 你借着{place}的光正了正身子，快门就响了。
    - id: ms_sft_15
      text: 那是你与人间打的第一个照面，被一张照片留了下来。
  guild_recruit:
    - id: ms_gr_01
      text: 照片里你站在会馆门前，制服崭新，站得比谁都直。
    - id: ms_gr_02
      text: 那天的{place}，你把自己的名字写进会馆名册，笔尖顿了顿。
    - id: ms_gr_03
      text: 照片里会馆的门匾刚擦过，映出你仰着的脸。
    - id: ms_gr_04
      text: 你接过制服时手在抖，照片只记下了你发红的耳朵。
    - id: ms_gr_05
      text: 名册那一页翻到你的名字，照片正好拍到你落笔。
    - id: ms_gr_06
      text: 你在会馆门前站了半晌，才敢迈进去，照片里只剩个背影。
    - id: ms_gr_07
      text: 照片里的你与同门并排站着，个子都长了半寸似的。
    - id: ms_gr_08
      text: 入会那天你在{place}的会场里，听了一整天规矩。
    - id: ms_gr_09
      text: 镜头定格时，你正把会馆的徽章往胸前别了又别。
    - id: ms_gr_10
      text: 你领到了自己的一枚符，举在手里给照片看。
    - id: ms_gr_11
      text: 会馆的师姐把你领进门，照片里你们俩都笑着。
    - id: ms_gr_12
      text: 你在名册上按了个手印，朱砂还粘在指腹上。
    - id: ms_gr_13
      text: 照片里，你第一次穿上了那身制服，扣子系得一丝不苟。
    - id: ms_gr_14
      text: 那天你在一群新面孔里，第一次觉得有了去处。
    - id: ms_gr_15
      text: 照片背面写着{place}，那是你入会的地方。
  init_tier:
    - id: ms_it_01
      text: 入门那天——你掌心托着第一缕灵质，{place}的天色很亮。
    - id: ms_it_02
      text: 照片记下你第一次"看见"自己的瞬间。背景是{place}的旧屋。
    - id: ms_it_03
      text: 照片里你盘腿坐着，掌心那点灵质还只像一粒火星。
    - id: ms_it_04
      text: 你第一次引气入体的样子，被照片记得清清楚楚。
    - id: ms_it_05
      text: 镜头里你闭着眼，眉间还攒着一点没放下的紧张。
    - id: ms_it_06
      text: 师父在你额上点了点，照片里你正绷着身子不敢动。
    - id: ms_it_07
      text: 你照见自己经脉的那一刻，照片只拍到你微张的嘴。
    - id: ms_it_08
      text: 入门那日你在{place}的静室里，坐了整整一下午。
    - id: ms_it_09
      text: 照片里你的指尖沾着灵气，像缠了几缕不会灭的线。
    - id: ms_it_10
      text: 你第一次把灵质收入丹田，收完就笑了，照片正好拍下。
    - id: ms_it_11
      text: 那点光很弱，可照片里你的影子被照得发暖。
    - id: ms_it_12
      text: 你在入门册上记下第一笔，照片里的墨迹还没干。
    - id: ms_it_13
      text: 镜头定格时，你正数着自己能看见的几根灵线。
    - id: ms_it_14
      text: 你把这头一回的体悟，都写进了那天的照片备注里。
    - id: ms_it_15
      text: 照片里你抬起头，{place}的天光正好落进你眼底。
  gate_ningxing:
    - id: ms_gn_01
      text: 凝形那夜，你在{place}的水边站了很久，倒影终于清晰。
    - id: ms_gn_02
      text: 照片里你闭目凝神，周身灵质初凝如薄雾。那是{place}的深秋。
    - id: ms_gn_03
      text: 照片里的你在水边，倒影与你终于长得一模一样。
    - id: ms_gn_04
      text: 凝形那刻你的轮廓由虚变实，照片只来得及拍下一半。
    - id: ms_gn_05
      text: 你在{place}的长椅上坐了很久，等风把最后一缕雾吹散。
    - id: ms_gn_06
      text: 照片里你握了握自己的手，像是确认它真的在了。
    - id: ms_gn_07
      text: 你凝形后的第一件事，是去照了照{place}的旧镜子。
    - id: ms_gn_08
      text: 镜头里的你身形初定，衣角还带着未散的灵光。
    - id: ms_gn_09
      text: 那夜你走出门，影子稳稳跟在你身后，照片记了下来。
    - id: ms_gn_10
      text: 你在月色里试着转了个圈，照片里的你已不再散形。
    - id: ms_gn_11
      text: 凝形之后，你在{place}的水边洗了把脸，凉得真实。
    - id: ms_gn_12
      text: 照片里你举起手挡住月光，掌心透出的纹理清晰可见。
    - id: ms_gn_13
      text: 你轻轻碰了碰自己的脸，快门就响在这一刻。
    - id: ms_gn_14
      text: 那身形状，你花了很久才捏成，照片里却像天生。
    - id: ms_gn_15
      text: 你把这重要的一夜，留在了一张有些过曝的照片上。
  gate_dayao:
    - id: ms_dy_01
      text: 大妖之境——{place}的山风在你身后停了半拍。
    - id: ms_dy_02
      text: 照片记下你跨过那道槛的背影。周围的草木都低了低头。
    - id: ms_dy_03
      text: 照片里你立在{place}的山巅，脚下云气翻涌如海。
    - id: ms_dy_04
      text: 你跨入大妖之境那日，四周草木都朝你伏了伏身。
    - id: ms_dy_05
      text: 镜头只拍到你一个侧脸，身后的风却像停住了。
    - id: ms_dy_06
      text: 那天的{place}，飞鸟都绕着你飞，久久不肯落地。
    - id: ms_dy_07
      text: 照片里你的眼睛像盛着一整片安静的夜。
    - id: ms_dy_08
      text: 你轻轻一抬手，山影都跟着你动了动，照片记下了这刻。
    - id: ms_dy_09
      text: 跨过那道槛后，你在原地站了很久，照片里只有风声。
    - id: ms_dy_10
      text: 大妖之境，无喜无怒，你在照片里却偏偏笑着。
    - id: ms_dy_11
      text: 你回望来路，那些修行都凝成了眉间一点。
    - id: ms_dy_12
      text: 照片里的你被晨光勾了一道边，像从传说里走出来。
    - id: ms_dy_13
      text: 那日{place}的云裂开又合上，你就在云下。
    - id: ms_dy_14
      text: 你终于站在了自己一直仰望的地方，照片替你记着。
    - id: ms_dy_15
      text: 镜头里的你神色平静，可掌心还微微发着颤。
  ascend_trigger:
    - id: ms_at_01
      text: 飞升那日——{place}的天裂开一道缝，你走进光里。
    - id: ms_at_02
      text: 照片里你回头看了最后一眼。脚下的云很厚，{place}很小。
    - id: ms_at_03
      text: 照片里你正抬脚，脚下尘世已远成一片薄薄的影。
    - id: ms_at_04
      text: 飞升那刻，你最后看了一眼{place}的灯火，全在照片里。
    - id: ms_at_05
      text: 镜头追着你的衣角，可惜只拍下一片风。
    - id: ms_at_06
      text: 你把这辈子的行囊都留在了原地，照片里只剩空空的脚印。
    - id: ms_at_07
      text: 那天万灵抬头，你站在光里，被一张照片勉强留住。
    - id: ms_at_08
      text: 你合上眼再睁开，照片已装不下你的影子。
    - id: ms_at_09
      text: 飞升前的你，在{place}站了整整一夜，像与谁告别。
    - id: ms_at_10
      text: 照片里你的背影越来越淡，最后融进了天光。
    - id: ms_at_11
      text: 你朝上一跃，人间在你身后慢慢缩成一颗星。
    - id: ms_at_12
      text: 镜头盖不住的光，从你周身溢出来，漫过整张照片。
    - id: ms_at_13
      text: 你在云上停了一瞬，回头的那一眼好像也被拍下了。
    - id: ms_at_14
      text: 那日的风从你脚下生，吹起了人间许多张信纸。
    - id: ms_at_15
      text: 照片最后只拍到白光，可你知道，那是你。
  scene_hermit_chance:
    - id: ms_shc_01
      text: 隐修岛那夜——老者的手在你额心一点，{place}的海声忽然远了。
    - id: ms_shc_02
      text: 照片记下你听潮的那个背影。身后是{place}的礁石与月。
    - id: ms_shc_03
      text: 照片里是老者的背影，你在后头跟着，踩着一行脚印。
    - id: ms_shc_04
      text: 隐修岛的潮水在你身后涨了又退，照片里只有一线白。
    - id: ms_shc_05
      text: 你坐在礁石上听潮，照片里的天色正由青转灰。
    - id: ms_shc_06
      text: 那天老者教你吐纳，你在照片里学得像模像样。
    - id: ms_shc_07
      text: 照片里的岛很小，海却大得没有边，你在中间显得安静。
    - id: ms_shc_08
      text: 你在海边的木屋里住下，照片里的灯火暖黄。
    - id: ms_shc_09
      text: 老者给你画了道符，照片里那道会发亮的符还没干。
    - id: ms_shc_10
      text: 隐修岛的日子，你慢得快要忘了时辰，照片记得。
    - id: ms_shc_11
      text: 照片里你与老者对坐，中间只隔着一壶凉茶。
    - id: ms_shc_12
      text: 你离岛前回头望，照片把那一刻的海雾都留住了。
    - id: ms_shc_13
      text: 涨潮时你站在浪边，照片里你的衣摆湿了半截。
    - id: ms_shc_14
      text: 老者说你来得突然，走时却别忘了{place}的潮。
    - id: ms_shc_15
      text: 照片背面是你写下的隐修岛三个字，墨迹被海风浸过。
  shock_war:
    - id: ms_sw_01
      text: 战乱那年——你在{place}的废墟前站了很久，手里攥着一把土。
    - id: ms_sw_02
      text: 照片里你背着一生的家当。背景是{place}烧焦的天际线。
    - id: ms_sw_03
      text: 照片里是一片废墟，你在废墟前站得笔直。
    - id: ms_sw_04
      text: 你攥着的那把土，照片里看不太清，只有掌心是暗的。
    - id: ms_sw_05
      text: 战后的{place}，你在断墙前升了一堆火，火光照着旧门牌。
    - id: ms_sw_06
      text: 照片里你背着家当往前赶，身后跟着很长的烟。
    - id: ms_sw_07
      text: 你把亲人的名字刻在一块木牌上，照片里的刀痕很深。
    - id: ms_sw_08
      text: 那天的天是灰的，你在照片里只剩一个剪影。
    - id: ms_sw_09
      text: 你坐在倒塌的屋梁上，照片里你正一点点掰着干粮。
    - id: ms_sw_10
      text: 战乱过后你回到{place}，照片里你站在原来的家门前。
    - id: ms_sw_11
      text: 你给一株焦树浇了第一瓢水，照片记下了这个春天。
    - id: ms_sw_12
      text: 照片里的火还在烧，你的影子被拉成一根细线。
    - id: ms_sw_13
      text: 你接过半碗稀粥的瞬间，被照片拍下，眼尾有些红。
    - id: ms_sw_14
      text: 烽火散尽，你在{place}重新支起一扇门，照片里你笑着。
    - id: ms_sw_15
      text: 那本相册你翻到最后一张，是战乱那年你仅存的家当。
