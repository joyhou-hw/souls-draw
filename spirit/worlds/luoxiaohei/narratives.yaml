        text: 凝形时你捂住胸口，那里第一次有了规律的跳动。
      - id: gn_f_12
        text: 影子不再散了，你走到哪里，它都跟得整整齐齐。
      - id: gn_f_13
        text: 你捏了很久，才把眉眼捏成自己认得出的样子。
