          - id: iy_ci_06
            text: 城市的风很硬，你替它挡了挡，它才慢慢睁开眼。
          - id: iy_ci_07
            text: 巷口的车灯扫过来，把它惊慌的影子投得又长又斜。
          - id: iy_ci_08
            text: 你把半杯还温着的豆浆放在它面前，它没敢接。
      - when:
