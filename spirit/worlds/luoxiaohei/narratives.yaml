        text: 你把手艺练得纯熟，主家给的工钱也比旁人多出一份。
      - id: ml_f_39
        text: 起早贪黑，你图的就是年根底下能给自己添件新衣。
      - id: ml_f_40
        text: 一年到头，你数着攒下的几个钱，心里竟也生出几分安稳。
    buckets:
      - when:
          form: human
        variants:
          - id: ml_h_01
            text: 加班，通勤，年底看了看瘪掉的口袋——凡人的奔波从不含糊。
          - id: ml_h_02
            text: 你在写字楼的格子间里熬了一年，体检报告比年终奖先到。
          - id: ml_h_03
            text: 你在工厂的流水线旁站了整年，指尖磨得发亮。
          - id: ml_h_04
            text: 挤早高峰的地铁，你把一年的力气都耗在了通勤路上。
          - id: ml_h_05
            text: 你对着账单发过呆，也对着工资条笑过一回。
          - id: ml_h_06
            text: 公司楼下的便利店，你熟得连收银员都喊得出你的名字。
          - id: ml_h_07
            text: 你在写字楼里加了整年的班，工位上的绿萝都比你精神。
          - id: ml_h_08
            text: 挤地铁，赶末班，你把城市的灯火都看成了背景。
          - id: ml_h_09
            text: 年底你把工资条捋平，贴在心口，长长舒了一口气。
          - id: ml_h_10
            text: 你在工厂的夜班里，看着天一点点亮起来。
          - id: ml_h_11
            text: 外卖的单子一单接一单，你在街巷里跑出了风。
          - id: ml_h_12
            text: 这一年你换过几次工作，简历越写越长，人也越走越稳。
      - when:
          form: animal_yao
        variants:
          - id: ml_ay_01
            text: 你驮着重物在{place}赶路，蹄子踏过一程又一程的泥。
          - id: ml_ay_02
            text: 干完活你趴在草棚下，尾巴连甩都懒得甩一下。
          - id: ml_ay_03
            text: 你给商队驮货，脖子上挂着铃铛，走一路响一路。
          - id: ml_ay_04
            text: 替人看守园子，你竖着耳朵熬过许多个不眠的夜。
          - id: ml_ay_05
            text: 你替人拉了一年的磨，转了多少圈，自己也数不清。
          - id: ml_ay_06
            text: 驮货进山的路上，你认得每一块歇脚的石头。
          - id: ml_ay_07
            text: 你在{place}的田里拉犁，泥点子溅了一身。
          - id: ml_ay_08
            text: 帮人看家护院，你把每个过路人的脚步都记在耳里。
          - id: ml_ay_09
            text: 这一年你的脊背驮过盐，也驮过粮，驮得越来越稳。
          - id: ml_ay_10
            text: 干完活，你在河边喝口水，把一日的尘土都咽下去。
          - id: ml_ay_11
            text: 你跟着商队走南闯北，铃铛声里混着风霜。
          - id: ml_ay_12
            text: 夜里的牲口棚里，你卧在干草上，把日子反刍了一遍。
      - when:
          form: plant_yao
        variants:
          - id: ml_py_01
            text: 你把根须伸进{place}的田埂，替人守着地里的墒情。
          - id: ml_py_02
            text: 开花结果都被摘去换钱，你只留了一声不响的叹息。
          - id: ml_py_03
            text: 你把果子结得又大又甜，好让人拿去换个好价钱。
          - id: ml_py_04
            text: 起风时你替人挡着风沙，叶子磨得又黄又薄。
          - id: ml_py_05
            text: 你把根扎进{place}的田里，替人守着地里的墒情和节气。
          - id: ml_py_06
            text: 结出的果子被摘去换钱，你只留了一树风。
          - id: ml_py_07
            text: 你替人遮阴，叶子在日头下晒得打卷，也没挪动一步。
          - id: ml_py_08
            text: 这一年你的花开了又谢，谢了又开，都为了旁人的日子。
          - id: ml_py_09
            text: 你把水土一点点攥住，坡上的田才没有滑下去。
          - id: ml_py_10
            text: 秋风起了，你的落叶被扫去堆肥，来年又肥了别家的地。
          - id: ml_py_11
            text: 你在{place}的田埂上站了一年，看庄稼绿了又黄。
          - id: ml_py_12
            text: 你用自己的身躯给人做了篱笆，挡风挡雨，也挡野兽。
      - when:
          form: fungus_yao
        variants:
          - id: ml_fy_01
            text: 你在{place}的朽木上给菌丝寻路，一点一点拱开树皮。
          - id: ml_fy_02
            text: 别的生灵忙着奔跑，你只忙着在暗处把根铺开。
          - id: ml_fy_03
            text: 你替这片林地分解枯枝，把腐朽都化成新的土。
          - id: ml_fy_04
            text: 一场雨下来，你就得抓紧长大，错过了便要再等。
          - id: ml_fy_05
            text: 你在{place}的树根间做了一年的活，没人看见，也没人催你。
          - id: ml_fy_06
            text: 菌丝是你的手脚，你靠它们在土里一寸一寸地讨生活。
          - id: ml_fy_07
            text: 你把朽木的养分细细嚼碎，再分给周围的草木。
          - id: ml_fy_08
            text: 夜里你长出一片又一片菌盖，像在土里点亮小小的灯。
          - id: ml_fy_09
            text: 这一年的活计不响不动，你却把一整片林子都连了起来。
          - id: ml_fy_10
            text: 你在{place}的潮湿处安身，把日子过成无声的滋长。
          - id: ml_fy_11
            text: 枯木在你的照料下慢慢软下去，又慢慢长出新的苔。
          - id: ml_fy_12
            text: 你把孢子送出去，像把一年的工钱都寄回了远方的家。
      - when:
          form: spirit_yao
        variants:
          - id: ml_sy_01
            text: 你在{place}的山里替人引路，风灯一样忽明忽暗。
          - id: ml_sy_02
            text: 没有形体，你却替迷路的魂灵守了一年的渡口。
          - id: ml_sy_03
            text: 你帮人托梦传话，把说不出口的牵挂一字字送到。
          - id: ml_sy_04
            text: 这一年的活计是守着{place}的一口井，听它昼夜地响。
          - id: ml_sy_05
            text: 你为过路的游魂点亮一盏灯，天亮前又悄悄收回。
          - id: ml_sy_06
            text: 你的力气都花在了一缕风上，推着别人的船过河。
          - id: ml_sy_07
            text: 你在{place}的庙里当差，香火里浸着一年的清淡。
          - id: ml_sy_08
            text: 没有手脚的你，学会了用念头替人搬动轻小的物事。
          - id: ml_sy_09
            text: 这一年你守着一段旧誓言，哪里也没去，哪里也都去过。
          - id: ml_sy_10
            text: 你替草木传话，把根的渴、叶的盼都转给了雨水。
          - id: ml_sy_11
            text: 你的营生不显山不露水，只在夜里悄悄成全别人。
          - id: ml_sy_12
            text: 你在{place}的碑林里抄写名姓，把每一个都记成心头的事。
      - when:
          form: painted_yao
        variants:
          - id: ml_pty_01
            text: 你在{place}的铺子里当了一年的镇纸，压住许多没写完的字。
          - id: ml_pty_02
            text: 器物的一双手就是不动，你却替人守住了整个案头的秩序。
          - id: ml_pty_03
            text: 你被日日擦洗，又被日日使用，器身上磨出了温润的光。
          - id: ml_pty_04
            text: 这一年的活计是盛放与腾空，如此反复，日子就满了。
          - id: ml_pty_05
            text: 你替人照看香火，香灰落在你肩上，你也一声不吭。
          - id: ml_pty_06
            text: 你在{place}的灶上烧水，一年到头，喉咙里都是咕嘟声。
          - id: ml_pty_07
            text: 器物做活不问工钱，只问自己有没有被用得妥帖。
          - id: ml_pty_08
            text: 你的釉面结了一层薄薄的茶垢，那便是你的年岁。
          - id: ml_pty_09
            text: 你替人守门，门轴转了一整年，你便听了一整年的离合。
          - id: ml_pty_10
            text: 这一年的营生是把自己借给别人，借出去又收回来。
          - id: ml_pty_11
            text: 你在{place}的案头磨墨，墨香里浸着你一年的辛劳。
          - id: ml_pty_12
            text: 器物的一年被用得旧了，也被用得亲了，越旧越舍不得换。

  beast_conflict:
    fallback:
      - id: bc_f_01
        text: 与妖兽的冲突让你挂了彩，养了很久的伤。
      - id: bc_f_02
        text: 兽爪擦过脊背的那一夜，你第一次离死亡那么近。

  guild_recruit:
    prompt: 会馆名册翻到你这一页，墨迹未干。穿制服的妖精师向你伸出橄榄枝。加入会馆吗？
    fallback:
      - id: gr_f_01
        text: 会馆的名册翻到你这一页，墨迹未干。
      - id: gr_f_02
        text: 穿会馆制服的妖精向你走来，笑容里带着规矩和口粮。
      - id: gr_f_03
        text: 那封盖着会馆火漆的书信在你手里停了一夜，边角都摸起了毛。
      - id: gr_f_04
        text: 你对着橄榄枝犹豫，那枝头的叶子还沾着清晨的水。
      - id: gr_f_05
        text: 穿制服的妖精师把一份名册摊开，指着空白处等你落名。
      - id: gr_f_06
        text: 你在{place}听了招募的号子，心里那杆秤来回地晃。
      - id: gr_f_07
        text: 会馆的规矩一条条摆在你面前，像一扇虚掩的门。
      - id: gr_f_08
        text: 你掂量着制服的重量，也掂量着自由的身量。
      - id: gr_f_09
        text: 招募的人说，进了会馆，雨再大也有瓦替你遮。
      - id: gr_f_10
        text: 你在名册前站了半晌，笔尖的墨都快要干了。
      - id: gr_f_11
        text: 会馆许你口粮与名分，只问你要一样东西，那就是归处。
      - id: gr_f_12
        text: 你把手揣进袖里，指尖反复摩挲着一枚旧铜板。
      - id: gr_f_13
        text: 橄榄枝递到你面前，你看见枝下还缀着一副沉甸甸的规矩。
      - id: gr_f_14
        text: 你在夜里翻着名册的边角，字里行间都是另一重人生。
      - id: gr_f_15
        text: 招募的鼓点一下下敲在{place}，也敲在你拿不准的心上。
      - id: gr_f_16
        text: 你问了会馆许多事，独独没问自己舍不舍得。
      - id: gr_f_17
        text: 穿制服的妖精说，去了会馆，从此便有了名姓。
      - id: gr_f_18
        text: 那扇会馆的门半掩着，门里透出的光温温的，却照不明你的去路。
      - id: gr_f_19
        text: 你在岔路口停了停，一边是规矩，一边是风。
      - id: gr_f_20
        text: 会馆的人把待遇说得明白，像摊开一桌现成的饭菜。
      - id: gr_f_21
        text: 你在名册的空白处看见了自己的位置，笔却迟迟落不下去。
      - id: gr_f_22
        text: 招募的来使走后，你屋里的灯又亮了一整夜。
      - id: gr_f_23
        text: 橄榄枝被你插进桌上的粗陶瓶里，你好几天都没再碰它。
      - id: gr_f_24
        text: 会馆需要你这样的{species}，他们说得诚恳，你听得认真。
      - id: gr_f_25
        text: 你望着会馆的飞檐，那瓦当上的纹样像在等一个人。
      - id: gr_f_26
        text: 这一纸招募，把你的安稳和漂泊都摆上了台面。
      - id: gr_f_27
        text: 你在{place}的巷口听完招募，转身时影子被拉得很长。
      - id: gr_f_28
        text: 会馆的诚意里掺着规矩，你一时分不清哪样更重。
      - id: gr_f_29
        text: 招募名册已经合上，可你心里那页还摊开着。
      - id: gr_f_30
        text: 你把橄榄枝原样还了回去，或留下，总之这一年有了个着落。
    buckets:
      - when:
          region: forest
        variants:
          - id: gr_fo_01
            text: 会馆的使者在林间的小路上截住你，鞋上沾着松针与晨露。
          - id: gr_fo_02
            text: 招募的鼓声穿过密林，惊起几只宿鸟，也惊动了你。
          - id: gr_fo_03
            text: 你从树后走出，会馆的旗子在林风里抖了一抖。
          - id: gr_fo_04
            text: 林中的薄雾里，一队会馆的人马向你的草屋走来。
          - id: gr_fo_05
            text: 你在林泉边听完招募，水面晃着旗子和你的犹豫。
          - id: gr_fo_06
            text: 会馆的人说，出山便有人接应，你望了望身后的老树。
          - id: gr_fo_07
            text: 林间的招募帖贴在老树上，你凑近读了又读。
          - id: gr_fo_08
            text: 你踩着落叶去应募，一路上的鸟兽都替你噤了声。
      - when:
          region: city
        variants:
          - id: gr_ci_01
            text: 会馆的使者在闹市的告示栏下等你，行人如织，无人多看。
          - id: gr_ci_02
            text: 你在街角的招募摊前停下，制服在人群里格外扎眼。
          - id: gr_ci_03
            text: 霓虹灯下，会馆的招募帖被风掀起一角，像在朝你招手。
          - id: gr_ci_04
            text: 你在巷口接过传单，纸上的会馆二字烫得你的指尖一热。
          - id: gr_ci_05
            text: 城市的会馆门面藏在老楼里，你绕了三圈才敢进去。
          - id: gr_ci_06
            text: 招募的人在茶楼里给你留了位子，茶凉了又续。
          - id: gr_ci_07
            text: 你在天桥下听完会馆的来历，头顶的车流碾过暮色。
          - id: gr_ci_08
            text: 会馆的制服在人群里一闪，你便鬼使神差地跟了上去。
      - when:
          region: guild_land
        variants:
          - id: gr_gl_01
            text: 会馆领地的钟一响，招募的消息便传进了每一间屋。
          - id: gr_gl_02
            text: 你的名册早已递到会馆，只差你本人去点个头。
          - id: gr_gl_03
            text: 会馆的廊下，主事把入会的章程一条条指给你看。
          - id: gr_gl_04
            text: 你站在会馆的照壁前，影子投在刷得雪白的墙上。
          - id: gr_gl_05
            text: 会馆的院子里晾着制服，那日子近得抬头就能看见。
          - id: gr_gl_06
            text: 领地里的人都认得会馆的路，你却要在门前多站一站。
          - id: gr_gl_07
            text: 会馆的账房先生拨着算珠，把你的身价算得清清楚楚。
          - id: gr_gl_08
            text: 你在会馆的门槛外听了很久，门里的规矩声整齐得很。
      - when:
          region: hermit_island
        variants:
          - id: gr_hi_01
            text: 会馆的船泊在隐修岛的浅滩，船头的旗子湿了半截。
          - id: gr_hi_02
            text: 招募的使者在海边喊你的名字，海风把话都吹散了。
          - id: gr_hi_03
            text: 你在岛上的礁石旁听完来意，浪花一遍遍舔着鞋底。
          - id: gr_hi_04
            text: 会馆的人从渡口上岸，斗篷上还凝着夜里的盐花。
          - id: gr_hi_05
            text: 隐修岛的鸟惊起一片，你知道，是山外来人了。
          - id: gr_hi_06
            text: 你在海雾里看那艘会馆的船，若隐若现，像一封信。
          - id: gr_hi_07
            text: 岛上少有人来，会馆的招募便成了这一年的大事。
          - id: gr_hi_08
            text: 你把船绳递过去，会馆的人却先把名册递到了你手上。

  witness_exile:
    prompt: 城郊的同类被强制迁离，求助的目光落在你身上。怎么做？
    fallback:
      - id: we_f_01
        text: 你躲在人群里，看着同类被押上离去的车，谁也没有回头。
      - id: we_f_02
        text: 那一夜你听见了哭喊，也听见了自己心里那根弦慢慢绷紧。
      - id: we_f_03
        text: 被驱的那户人家连锅碗都没带走，灶膛里还剩半把没烧完的柴。
      - id: we_f_04
        text: 车走之后，你听见那家的鸡还在院子里叫，一直叫到天黑。
      - id: we_f_05
        text: 你在人群里跟着走了两步，又收住了脚，袖子被人踩住。
      - id: we_f_06
        text: 封条贴在门板上，浆糊顺着木纹往下淌。
      - id: we_f_07
        text: 被押走的同类望了你一眼，那一眼比什么话都重。
      - id: we_f_08
        text: 你躲进人群，却听见自己的心跳比车轮还响。
      - id: we_f_09
        text: 那一夜，整条街的灯都熄得特别早。
      - id: we_f_10
        text: 你捡起地上掉的一只布鞋，拿在手里，终究没追上去。
      - id: we_f_11
        text: 空了的屋子很快落了灰，门没锁，风往里钻。
      - id: we_f_12
        text: 你听见押车的马在夜里鸣，一声声都拖着长调。
      - id: we_f_13
        text: 被驱的人回头望向你，嘴角动了动，没说出半个字。
      - id: we_f_14
        text: 你在岔口站到腿麻，到底没敢为谁喊一声。
      - id: we_f_15
        text: 车队扬起的老土落定后，街面静得像什么都没发生。
      - id: we_f_16
        text: 你把自己关在屋里，耳朵却一直竖着听外头的动静。
      - id: we_f_17
        text: 那户人家的门牌被摘下来，留下一个浅色的印子。
      - id: we_f_18
        text: 你替被逐的同类藏起半包干粮，却不知该往哪儿送。
      - id: we_f_19
        text: 巡夜的梆子响过，你贴着墙根，一步都不敢出声。
      - id: we_f_20
        text: 被逐的人家的窗纸破了，风把残纸吹得啪嗒啪嗒响。
      - id: we_f_21
        text: 你看着那辆车越走越远，直到成了天边的一个黑点。
      - id: we_f_22
        text: 街坊们散得很快，谁也没提刚看见的那一幕。
      - id: we_f_23
        text: 你捡起一块从车上掉下的碎瓷，揣进怀里，硌了一路。
      - id: we_f_24
        text: 那一夜你睡得很浅，院外的狗一叫，你就醒。
      - id: we_f_25
        text: 被驱的同类的影子投在墙上，很快被拉走了。
      - id: we_f_26
        text: 你把门闩插了又插，仿佛这样就能挡住什么。
      - id: we_f_27
        text: 车辙在{place}的土路上留下两道深印，像两道新伤。
      - id: we_f_28
        text: 你远远望着，手心里攥出了汗，脚下却没动。
      - id: we_f_29
        text: 那天之后，你路过那处空屋时，总不自觉地放轻脚步。
      - id: we_f_30
        text: 你帮不上什么，只在夜里替那家人点了一盏门口的灯。
    buckets:
      - when:
          region: forest
        variants:
          - id: we_fo_01
            text: 林中的同类被赶出林子，扁担挑着家当，一步三回头。
          - id: we_fo_02
            text: 你在林边看着它们被押过溪，水声和人声混作一团。
          - id: we_fo_03
            text: 老树下的窝棚空了大半，风一过，叶子簌簌地落。
          - id: we_fo_04
            text: 被逐的林子人把几粒种子攥在手里，揣进贴身的衣襟。
          - id: we_fo_05
            text: 你躲在灌木后，车队碾过落叶，沙沙地响。
          - id: we_fo_06
            text: 林鸟惊飞了一大片，黑压压地盖过了天光。
          - id: we_fo_07
            text: 被赶的同类经过你藏身的树，你连呼吸都停了一停。
          - id: we_fo_08
            text: 车过后，林中的小径上只留下几串湿脚印。
      - when:
          region: city
        variants:
          - id: we_ci_01
            text: 城郊的同类被摘下门牌，塞进等在路边的车。
          - id: we_ci_02
            text: 你缩在阳台上看，楼下的车一辆接着一辆。
          - id: we_ci_03
            text: 被逐的人家在单元楼里清东西，纸箱堆到了楼道口。
          - id: we_ci_04
            text: 你从窗帘缝里望出去，路灯把一队人影照得又薄又长。
          - id: we_ci_05
            text: 小区的告示贴出来，纸上黑字，落地无声。
          - id: we_ci_06
            text: 被驱的同类按着喇叭催家人，声音在楼缝里来回撞。
          - id: we_ci_07
            text: 你经过钉在墙上的那块蓝门牌，颜色淡得几乎认不出。
          - id: we_ci_08
            text: 那户人家搬空的夜里，电梯一层层停，再没人进出。
      - when:
          region: guild_land
        variants:
          - id: we_gl_01
            text: 会馆领地里的同类被除名，名册上那一行用朱笔勾去。
          - id: we_gl_02
            text: 你在会馆的廊柱后看，主事把腰牌一枚枚收了回去。
          - id: we_gl_03
            text: 被逐者背着包袱跨出会馆的门槛，门槛都被磨得发亮。
          - id: we_gl_04
            text: 会馆的钟响过三下，院子里便少了一个熟悉的人影。
          - id: we_gl_05
            text: 你看见那人的会馆纹章被摘下来，留下一个空空的扣眼。
          - id: we_gl_06
            text: 领地里的人都不敢多问，只低头把各自的活计干得更快。
          - id: we_gl_07
            text: 被除名的同类回望会馆的飞檐，檐角的铜铃没响。
          - id: we_gl_08
            text: 你在会馆的名册房外听见翻页声，一页页都翻得发闷。
      - when:
          region: hermit_island
        variants:
          - id: we_hi_01
            text: 隐修岛上的同伴被赶下海，小船在浪里摇得厉害。
          - id: we_hi_02
            text: 你在礁石后看，被逐的人把桨握得指节发白。
          - id: we_hi_03
            text: 岛上的同类的船越漂越远，海雾很快吞掉了桅顶。
          - id: we_hi_04
            text: 你听见海风里传来断断续续的喊，转眼就散了。
          - id: we_hi_05
            text: 被逐者在沙滩上留下几串脚印，潮水替他抹平了。
          - id: we_hi_06
            text: 岛上少了一户人家，锅碗还摆在门前的石桌上。
          - id: we_hi_07
            text: 你望着海面，那点帆成了浪里一星将熄的火。
          - id: we_hi_08
            text: 被逐的同类把一只贝壳塞进你手里，凉得像块石头。

  injured_yao:
    prompt: 路边蜷着一只重伤小妖。停下来救的话，你的岁月和气血都会被分走一些。
    fallback:
      - id: iy_f_01
        text: 路边的小妖蜷成一团，血把几片叶子都染红了。
      - id: iy_f_02
        text: 你蹲下身，那孩子却怕得直往后缩，只露出一双眼睛。
      - id: iy_f_03
        text: 小妖的伤口包得草草，血还是慢慢洇透了布。
      - id: iy_f_04
        text: 你把手边的干粮掰下一半，它却先往后缩了缩。
      - id: iy_f_05
        text: 那孩子的一双眼睛在乱发后头亮着，又惊又怯。
      - id: iy_f_06
        text: 你蹲下身，把自己的影子盖在它身上，挡了挡风。
      - id: iy_f_07
        text: 小妖怀里还抱着半截啃过的草根，攥得紧紧的。
      - id: iy_f_08
        text: 你探了探它的鼻息，轻得像快要断了的线。
      - id: iy_f_09
        text: 若是相救，你的气血便要被分走一块，像从身上剜肉。
      - id: iy_f_10
        text: 那点伤口不算致命，却把一条命明明白白摆在了你眼前。
      - id: iy_f_11
        text: 它朝你张了张嘴，发不出一丝声音，眼里全是水汽。
      - id: iy_f_12
        text: 你数着自己剩下的年月，又看看它，半天没动。
      - id: iy_f_13
        text: 路边的小妖把尾巴也伤着了，软软地拖在尘土里。
      - id: iy_f_14
        text: 你的影子在地上一寸寸挪过去，它没再躲。
      - id: iy_f_15
        text: 那夜风很凉，你把自己的一件旧衣盖在了它身上。
      - id: iy_f_16
        text: 它指甲缝里还嵌着逃跑时抓起的泥。
      - id: iy_f_17
        text: 若是走开，身后那点微弱的呼吸就会跟着你一路。
      - id: iy_f_18
        text: 你把水囊拧开，往它嘴边倒了点水，它哆嗦着咽了。
      - id: iy_f_19
        text: 小妖的血把半片浅草都染了，蚂蚁在血迹边上绕。
      - id: iy_f_20
        text: 你抬头望了望天色，天边已经压过来一层灰云。
      - id: iy_f_21
        text: 救它一命，许会折你几载光阴，你心里那杆秤又晃了。
      - id: iy_f_22
        text: 它终于敢伸手碰你的衣袖，指尖凉得吓人。
      - id: iy_f_23
        text: 你把这路上的行人等散了，才敢去碰那团蜷着的身子。
      - id: iy_f_24
        text: 小妖把一块捡来的碎瓦片捏在胸前，权当护身。
      - id: iy_f_25
        text: 若你假意没看见，它眼里的光会不会就此灭了。
      - id: iy_f_26
        text: 你把袖子挽起来，露出的手腕和它一样细瘦。
      - id: iy_f_27
        text: 那孩子伤在肋下，呼吸时整个人都一抽一抽的。
      - id: iy_f_28
        text: 路边的尘土被它搅出一个小坑，像在替你做个记号。
      - id: iy_f_29
        text: 你朝它走了半步，它便把身子又往草里缩了缩。
      - id: iy_f_30
        text: 天快黑了，你终究没能迈开离开的那一步。
    buckets:
      - when:
          region: forest
        variants:
          - id: iy_fo_01
            text: 林中的落叶下蜷着一只小妖，血滴在苔上，红得刺眼。
          - id: iy_fo_02
            text: 你拨开灌木，藤蔓后露出的那条腿还在微微地抖。
          - id: iy_fo_03
