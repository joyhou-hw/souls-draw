            text: 古代的山门很静，你在晨钟里第一次盘腿入定。
          - id: it_an_02
            text: 你拜了师，敬了茶，青灯下把入门的心法背到天明。
          - id: it_an_03
            text: 老道给你点了一枚朱砂，说从此你算踏进了这道门。
          - id: it_an_04
            text: 你在香火缭绕的堂前磕了三个头，起身时膝盖沾着灰。
          - id: it_an_05
            text: 山间的旧观里，你第一次听见灵气穿过松针的声音。
          - id: it_an_06
