        variants:
          - id: iy_hi_01
            text: 隐修岛的海滩上，一只小妖被潮水推上岸，浑身湿透。
          - id: iy_hi_02
            text: 你在礁石间找到它，海盐把它的伤口渍得发白。
          - id: iy_hi_03
            text: 小妖半截身子泡在退潮的水洼里，手指一抽一抽。
          - id: iy_hi_04
            text: 它像是从海上漂来的，怀里还攥着半片船板。
          - id: iy_hi_05
            text: 岛上的鸟聚在它身边，见你来了，又呼啦啦地散。
          - id: iy_hi_06
            text: 你把海草从它身上扒开，伤口里嵌着细碎的白沙。
          - id: iy_hi_07
            text: 海风替它把血和沙搅在一处，糊成暗红的一层。
          - id: iy_hi_08
