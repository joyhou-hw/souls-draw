      - id: stcc_f_06
        text: 你在{place}的渡口帮着装船，浪头打湿了半截裤脚。
      - id: stcc_f_07
        text: 走南闯北的日子，你攒下的不止是盘缠，还有见识。
      - id: stcc_f_08
        text: 商队歇在{place}，你数着新到的货，数出了满心踏实。

