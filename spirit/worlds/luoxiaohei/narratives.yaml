  gate_ningxing:
    fallback:
      - id: gn_f_01
        text: 凝形突破的那一夜，你终于把"自己"捏成了一个确定的形状。
      - id: gn_f_02
        text: 灵质在体内重新排布，像散沙终于认领了河床。
      - id: gn_f_03
        text: 你守着一盏灯，等灵质慢慢聚成你的眉目与轮廓。
      - id: gn_f_04
