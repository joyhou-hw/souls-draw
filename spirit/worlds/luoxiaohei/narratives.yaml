      - id: sfmt_f_02
        text: 邻里的口信你一字不落地记下，又转给该听的人。
      - id: sfmt_f_03
        text: 你在{place}的井台边听来一桩要紧事，夜里便有了数。
      - id: sfmt_f_04
        text: 街坊会的消息网最灵，你靠着它躲过几回麻烦。
      - id: sfmt_f_05
        text: 你替街坊传了句话，回来时手里多了半块热饼。
      - id: sfmt_f_06
        text: 一条暗语在邻里间传开，你听懂了，也守住了。
      - id: sfmt_f_07
        text: 你在{place}的茶摊边听人闲谈，拼出个有用的信。
      - id: sfmt_f_08
        text: 街坊们待你不薄，有什么风吹草动都先想到你。

  scene_folk_mutual_elder:
