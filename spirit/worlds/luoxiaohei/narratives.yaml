      - id: it_f_17
        text: 你第一次感着灵质在指尖打转，像捉住一点没成形的光。
      - id: it_f_18
        text: 入门后你夜里睡得沉，梦里都是缓缓流动的灵气。
      - id: it_f_19
        text: 你把旧日子叠好收进箱底，从此多了一门早课。
      - id: it_f_20
        text: 定为凡体，你的心跳第一次和远处的钟声合上了拍。
    buckets:
      - when:
          era: ancient
        variants:
          - id: it_an_01
            text: 古代的山门很静，你在晨钟里第一次盘腿入定。
          - id: it_an_02
            text: 你拜了师，敬了茶，青灯下把入门的心法背到天明。
          - id: it_an_03
            text: 老道给你点了一枚朱砂，说从此你算踏进了这道门。
          - id: it_an_04
            text: 你在香火缭绕的堂前磕了三个头，起身时膝盖沾着灰。
          - id: it_an_05
            text: 山间的旧观里，你第一次听见灵气穿过松针的声音。
          - id: it_an_06
            text: 你穿着粗布道袍练功，袖口被山风吹得鼓起来。
      - when:
          era: modern
        variants:
          - id: it_mo_01
            text: 会馆的夜课散得很晚，你第一次在霓虹里静坐如常。
          - id: it_mo_02
            text: 你在出租屋的窗边打坐，楼下的车声像远处的潮。
          - id: it_mo_03
            text: 入门那天你在手机里设了个闹钟，叫醒自己的是一脉灵气。
          - id: it_mo_04
            text: 地铁上你闭目调息，身边的人只当你累了一天。
          - id: it_mo_05
            text: 你在会馆的资料室里翻入门心法，纸页混着打印的墨味。
          - id: it_mo_06
            text: 第一缕灵质亮起来时，你正在天桥上，脚下车灯如河。

  gate_yuwu:
    fallback:
      - id: yw_f_01
        text: 突破御物的瞬间，你指尖一点，桌上的茶盏自己往你手边挪了半寸。
      - id: yw_f_02
        text: 你让一片叶子悬在半空，那一刻，风也听你的话。
      - id: yw_f_03
        text: 你望着桌角的笔，它先晃了晃，然后慢慢立了起来。
      - id: yw_f_04
        text: 御物初成，你让汤匙在碗里转了半圈，像在搅一泓水。
      - id: yw_f_05
        text: 你朝半空一抬手，几粒米就乖乖停在了你掌心上。
      - id: yw_f_06
        text: 你试着隔空翻书，纸页一页页掀过去，沙沙地响。
      - id: yw_f_07
        text: 突破御物的夜里，你把灯芯拨得再也不用起身。
      - id: yw_f_08
