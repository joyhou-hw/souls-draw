        text: 夜里你说起以后的日子，说着说着窗外的月亮就偏了西。
      - id: hma_f_11
        text: 你把两人的名字写在一本账册上，墨迹还没干。
      - id: hma_f_12
        text: 婚后头一个年，你俩一起贴春联，浆糊糊了一手。
      - id: hma_f_13
        text: 你给对方缝了第一件衣裳，针脚歪歪扭扭，对方却穿了整季。
      - id: hma_f_14
        text: 搬进新屋那天下了雨，你俩抹着脸上的水，笑得停不下来。
      - id: hma_f_15
        text: 你在门前种了一棵树，说等它结果子，日子就稳了。
  human_midlife:
    fallback:
      - id: hmi_f_01
        text: 你扛着锄头下地，腰比前些年沉了，歇的回数也多了。
      - id: hmi_f_02
        text: 孩子的学费你攥在手里数了又数，还是差了一截。
      - id: hmi_f_03
        text: 你在{place}的铺子里忙到天黑，灯芯挑了三回才收摊。
      - id: hmi_f_04
        text: 老人的药方你抄了一份又一份，字迹越来越潦草。
      - id: hmi_f_05
        text: 你蹲在门槛上吃早饭，稀粥凉了也没察觉，心里装着事。
      - id: hmi_f_06
        text: 邻居借钱你犹豫了半晌，最后还是把兜里的摸了出来。
      - id: hmi_f_07
        text: 你把账本翻到最后一页，对着油灯算到眼花。
      - id: hmi_f_08
        text: 孩子考了功名，你嘴上不说，背地里笑了一整宿。
      - id: hmi_f_09
        text: 你在田埂上直了直腰，远处的山还是那座山，人却老了。
      - id: hmi_f_10
        text: 半夜孩子发烧，你背着他在{place}的路上跑，鞋都跑掉一只。
      - id: hmi_f_11
        text: 你把好菜往孩子碗里夹，自己扒着白饭，说吃过了。
      - id: hmi_f_12
        text: 屋顶漏了，你踩着凳子补瓦，膝盖打着颤也没下来。
      - id: hmi_f_13
        text: 你和伴侣拌了几句嘴，出门蹲在檐下抽了半天旱烟。
      - id: hmi_f_14
        text: 年关将近，你把年货分成三份，自家那份最少。
      - id: hmi_f_15
        text: 你在镜子里看见鬓角的白，愣了愣，又埋头去忙。
  human_retirement:
    fallback:
      - id: hre_f_01
        text: 你把用了半辈子的工具擦干净，一件件挂在墙上。
      - id: hre_f_02
        text: 回乡的路上你望着窗外，山一程水一程，都是旧时路。
      - id: hre_f_03
        text: 老屋的院里长满了草，你拔了一下午，腰直不起来。
      - id: hre_f_04
        text: 你在门前支了把竹椅，坐着坐着就打起了盹。
      - id: hre_f_05
        text: 邻居的小孩喊你阿公，你愣了愣，应了一声才回过神。
      - id: hre_f_06
        text: 你把攒的工钱分成几份，给孙辈一人包了一个红包。
      - id: hre_f_07
        text: 那{place}的集市还和从前一样热闹，你逛了一上午什么也没买。
      - id: hre_f_08
        text: 你在院里种了畦菜，浇水的时候膝盖咯吱响，心里却踏实。
      - id: hre_f_09
        text: 老伙计来找你下棋，你俩杀到日落，谁也没赢谁。
      - id: hre_f_10
        text: 你翻出年轻时的旧衣裳，比了比，叹了口气又叠回去。
      - id: hre_f_11
        text: 你把门牌擦了一遍，木头上的字模糊了，你还认得。
      - id: hre_f_12
        text: 傍晚你坐在门槛上看晚霞，脚边趴着一只打盹的老猫。
      - id: hre_f_13
        text: 你学着编竹篮，手指笨，编散了三回才勉强成个样。
      - id: hre_f_14
        text: 你把屋顶的瓦又数了一遍，数着数着就忘了数到哪。
      - id: hre_f_15
        text: 老伴端来一碗糖水，你接过来，两个人谁也没说话，坐着就好。
  human_old_age:
    fallback:
      - id: hoa_f_01
        text: 你坐在檐下晒太阳，影子比年轻时短了一截。
      - id: hoa_f_02
        text: 孙子问你年轻的事，你想了半天，笑说记不太清了。
      - id: hoa_f_03
        text: 你翻出一本旧账册，纸页发黄，上面的字是你年轻时的笔迹。
      - id: hoa_f_04
        text: 院里{place}的老槐树又粗了一圈，你摸着树皮，像摸一位老友。
      - id: hoa_f_05
        text: 你走几步就要歇，手里的拐杖敲在青石板上，一下一下的。
      - id: hoa_f_06
        text: 你把存的那张老照片看了又看，照片里的人笑得年轻。
      - id: hoa_f_07
        text: 夜里你梦见老伙计，醒来时窗外下着雨，枕头湿了一角。
      - id: hoa_f_08
        text: 你给孙子讲从前的故事，讲着讲着自己先笑了。
      - id: hoa_f_09
        text: 你把院里的花浇了一遍，水瓢抖，浇到土上的一半洒在脚面。
      - id: hoa_f_10
        text: 老伴走了以后，你习惯多摆一副碗筷，摆完才愣过神。
      - id: hoa_f_11
        text: 你数着墙上的年画，一张一张，数出了一辈子的年头。
      - id: hoa_f_12
        text: 你坐在门口看人来人往，都是生面孔，也不觉得孤单。
      - id: hoa_f_13
        text: 冬天你围着炉子烤火，火光映着满脸的褶子，暖烘烘的。
      - id: hoa_f_14
        text: 你把拐杖靠在门边，慢慢走到院中央，抬头望了望天。
      - id: hoa_f_15
        text: 日子像一碗凉透的茶，你端起来喝了一口，淡，却安心。

  # ── 动物妖专属事件（6 个，每个 15 fallback，可带 {species} 槽位）──
  animal_first_hunt:
    fallback:
      - id: afh_f_01
        text: 你第一次独自蹲在草丛里，腿抖得厉害，猎物就在前头。
      - id: afh_f_02
        text: 你扑空了三回，爪子上沾满了泥，肚子咕咕地叫。
      - id: afh_f_03
        text: 那种{species}的本能推着你往前，你却慢了半拍，猎物溜了。
      - id: afh_f_04
        text: 你咬住第一只田鼠时浑身发僵，松口后才回过神来。
      - id: afh_f_05
        text: 草丛里的风吹得耳朵痒，你眯着眼，屏住呼吸等了很久。
      - id: afh_f_06
        text: 你学着娘的样子伏低身子，可尾巴翘得太高，惊了猎物。
      - id: afh_f_07
        text: 头一回捕到的猎物你舍不得吃，叼回去摆在娘的脚边。
      - id: afh_f_08
        text: 你追着一只兔子跑了半座山，累趴下了，兔子也没抓着。
      - id: afh_f_09
        text: 猎物挣脱的那一瞬你急了，爪子在泥地上划出几道痕。
      - id: afh_f_10
        text: 你蹲在水边看鱼，看了半晌，一爪子下去只捞起水花。
      - id: afh_f_11
        text: 头回捕猎你把草窠当成了猎物，扑上去啃了一嘴草。
      - id: afh_f_12
        text: 你把猎物叼在嘴里，走一路掉一路，到家只剩半只。
      - id: afh_f_13
        text: 你学着{species}前辈的样子埋伏，趴着趴着自己先睡着了。
      - id: afh_f_14
        text: 日头偏西了，你终于叼着一只小虫子回家，尾巴翘得老高。
      - id: afh_f_15
        text: 那一口咬下去，你忽然懂了，活着就是要自己挣饭吃。
  animal_territory:
    fallback:
      - id: ate_f_01
        text: 你在树干上磨了磨爪子，这是你的地盘，得留个记号。
      - id: ate_f_02
        text: 来犯的{species}比你壮一圈，你弓起背，喉咙里滚出低吼。
      - id: ate_f_03
        text: 你追着闯入者跑了半座山，直到它越过那条溪才停脚。
      - id: ate_f_04
        text: 地盘的边界你每天巡视一圈，石头缝都要嗅一嗅。
      - id: ate_f_05
        text: 你在最高的那块石头上撒了泡尿，风一吹，味儿就散开了。
      - id: ate_f_06
        text: 对方先动了爪子，你侧身一闪，肋上还是挨了一下。
      - id: ate_f_07
        text: 你赢了，却没追击，望着对方瘸着跑远的背影喘了好久。
      - id: ate_f_08
        text: 你的领地不大，一棵老树一眼泉，可这是你拼来的。
      - id: ate_f_09
        text: 夜里你卧在领地中央，耳朵竖着，一点风吹草动都惊醒。
      - id: ate_f_10
        text: 闯入的是只幼崽，你吼了一嗓子，它吓得掉头就跑。
      - id: ate_f_11
        text: 你和隔壁的{species}隔着界河对吼了一夜，谁也没越过来。
      - id: ate_f_12
        text: 你把领地边界的枯枝拢了拢，堆成一道矮墙，心里踏实些。
      - id: ate_f_13
        text: 这片林子你熟得闭着眼都走得通，每一棵树都是你的界碑。
      - id: ate_f_14
        text: 你输了，脖子上的毛被扯掉一撮，瘸着腿往林子深处退。
      - id: ate_f_15
        text: 你趴在领地高处望了望，山风灌进毛里，这片地方是你的。
  animal_mating_season:
    fallback:
      - id: ams_f_01
        text: 春天的风里有股说不清的味儿，你坐立不安，耳朵转了又转。
      - id: ams_f_02
        text: 你把毛理了又理，对着溪水照了照，觉得还不够精神。
      - id: ams_f_03
        text: 那只{species}的叫声从山那头传来，你心口一紧，顺着声就跑。
      - id: ams_f_04
        text: 你叼着一束新草站在坡上，不知该往哪个方向放下。
      - id: ams_f_05
        text: 对方看了你一眼，又低头喝水，你愣在原地尾巴不知往哪摆。
      - id: ams_f_06
        text: 你绕着对方走了三圈，嗓子眼里哼哼唧唧，像在说糊涂话。
      - id: ams_f_07
        text: 情敌比你高大，你犹豫了半晌，终究还是弓起了背。
      - id: ams_f_08
        text: 你追着对方跑了整座山，舌头伸得老长，心里却高兴。
      - id: ams_f_09
        text: 对方蹭了蹭你的脖颈，你浑身僵住，耳朵烫得发红。
      - id: ams_f_10
        text: 月光下你俩并排卧着，尾巴尖不知什么时候搭在了一起。
      - id: ams_f_11
        text: 你把最肥的那只猎物叼到对方跟前，自己饿着肚子退开。
      - id: ams_f_12
        text: 对方走时回头望了你一眼，你追了两步又停住了脚。
      - id: ams_f_13
        text: 你在坡顶叫了一整夜，嗓子哑了，山那头始终没有回音。
      - id: ams_f_14
        text: 春风一吹你浑身发痒，在地上打了个滚，蹭了一身泥。
      - id: ams_f_15
        text: 你俩在草丛里追逐打闹，跑着跑着天就黑了，心里暖烘烘的。
  animal_pack_duty:
    fallback:
      - id: apd_f_01
        text: 头领把守夜的活儿派给你，你缩了缩脖子，还是应了。
      - id: apd_f_02
        text: 你带着幼崽们练捕猎，一只小{species}摔了跤，你用鼻子拱它起来。
      - id: apd_f_03
        text: 群里抢食你让了让，把大块的留给老的和小崽子。
      - id: apd_f_04
        text: 你负责巡视南边的边界，一天跑两趟，草都踩出了一条路。
      - id: apd_f_05
        text: 有幼崽走丢了，你跟着味儿找了半夜，叼着它回了窝。
      - id: apd_f_06
        text: 头领老了，群里有些躁，你夹在中间，两边都不敢得罪。
      - id: apd_f_07
        text: 你把猎物分了分，最后一块给了伤着腿的同族。
      - id: apd_f_08
        text: 守夜时你听见远处的嚎，竖起耳朵辨了辨，是邻群在巡界。
      - id: apd_f_09
        text: 你教小崽子认毒草，用爪子拨了拨，它歪着头看了半天。
      - id: apd_f_10
        text: 群里起了争执，你吼了一嗓子，两边都静了下来。
      - id: apd_f_11
        text: 你负责带新来的{species}认路，走一圈下来，它尾巴都不夹了。
      - id: apd_f_12
        text: 大雨夜你守在洞口，毛湿透了也没挪窝，身后是熟睡的崽子们。
      - id: apd_f_13
        text: 你替头领跑腿传信，翻了两座山，到时舌头都快干了。
      - id: apd_f_14
        text: 猎到大的，你先让头领和老者吃，自己啃着骨头等在一边。
      - id: apd_f_15
        text: 群里大大小小的事都装在你心里，累，却舍不得撒手。
  animal_den_making:
    fallback:
      - id: adm_f_01
        text: 你选了一处背风的坡，爪子刨土刨了一下午，指甲都磨秃了。
      - id: adm_f_02
        text: 你叼来干草铺窝，铺了三层才觉得软，踩了踩又叼来第四层。
      - id: adm_f_03
        text: 洞口你特意选在灌木丛后头，从外头看不见，从里头望得见天。
      - id: adm_f_04
        text: 你把窝里的小石子一颗颗叼出去，直到爪子踩上去全是软土。
      - id: adm_f_05
        text: 下雨你缩在新窝里，干干爽爽的，第一次觉着有个家真好。
      - id: adm_f_06
        text: 你挖了两个出口，一个常走，一个留着逃命用。
      - id: adm_f_07
        text: 窝口你堆了一圈土，挡风也挡水，还撒了些碎叶做伪装。
      - id: adm_f_08
        text: 你在窝最深处刨了个小坑，存了几日份的猎物，用土盖好。
      - id: adm_f_09
        text: 这{species}的窝讲究朝向，你试了三个方向，最后选了朝南的坡。
      - id: adm_f_10
        text: 你把旧窝让给了幼崽，自己重新刨了一个，小了些但够住。
      - id: adm_f_11
        text: 铺窝的草你挑了又挑，带刺的不要，湿的不要，只剩软和的。
      - id: adm_f_12
        text: 你在窝边埋了根木棍磨爪子，进门出门都蹭两下。
      - id: adm_f_13
        text: 洞挖到一半遇了硬石，你刨了一上午没刨动，换了个地方。
      - id: adm_f_14
        text: 你把窝附近的气味蹭了一遍，让别的{species}知道这地有主了。
      - id: adm_f_15
        text: 新窝落成那晚你缩成一团，听着外头的风，头一回睡得踏实。
  animal_old_alpha:
    fallback:
      - id: aoa_f_01
        text: 你老了，牙钝了，追猎物时总差那半步，心里有数。
      - id: aoa_f_02
        text: 年轻的{species}开始挑战你，你弓起背，力气却不如从前。
      - id: aoa_f_03
        text: 你把头领的位置让了出去，退到群的边上，谁也没怨。
      - id: aoa_f_04
        text: 新头领还算敬重你，分食时总留一块好的给你。
      - id: aoa_f_05
        text: 你看着年轻的崽子们打闹，像看见了当年的自己，嘴角松了松。
      - id: aoa_f_06
        text: 腿脚不利索了，你不再巡界，只在窝边晒晒日头。
      - id: aoa_f_07
        text: 群里起了争执，你吼了一嗓子，大伙儿都静了，这是最后的威望。
      - id: aoa_f_08
        text: 你把积年的经验一点点教给幼崽，说着说着自己也困了。
      - id: aoa_f_09
        text: 年轻时打下的地盘还在，你站在高处望了望，风灌进稀疏的毛。
      - id: aoa_f_10
        text: 你不再争，不再抢，吃食时靠后站，看着群里的热闹。
      - id: aoa_f_11
        text: 那只你带大的小{species}如今成了头领，你望着它的背影，心里妥帖。
      - id: aoa_f_12
        text: 你知道哪片林子有暗坑，哪条溪涨水快，这些没人比你清楚。
      - id: aoa_f_13
        text: 你身上的旧伤一到阴天就疼，你蜷在窝里，静静忍着。
      - id: aoa_f_14
        text: 群迁的时候你走不动了，新头领回头等你，你咬着牙跟上。
      - id: aoa_f_15
        text: 你趴在领地最高的石头上，望着山，这片地方你守了一辈子。

  # ── 植物妖专属事件（6 个，每个 15 fallback）──
  plant_first_bloom:
    fallback:
      - id: pfb_f_01
        text: 你攒了整整一冬的力气，第一朵花苞在枝头冒了尖。
      - id: pfb_f_02
        text: 花瓣绽开的那一瞬你抖了抖叶子，说不出的畅快。
      - id: pfb_f_03
        text: 你小心翼翼地展开第一片花瓣，露水顺着花蕊滚了下来。
      - id: pfb_f_04
        text: 蜜蜂头一回落在你身上，你紧张得叶片都绷直了。
      - id: pfb_f_05
        text: 那日{place}的春阳晒得你浑身酥软，那朵花就这么悄悄打开了。
      - id: pfb_f_06
        text: 你怕风吹散了花瓣，缩了缩枝子，把花护在叶底下。
      - id: pfb_f_07
        text: 隔壁的老树夸你开得俊，你不好意思地晃了晃枝头。
      - id: pfb_f_08
        text: 头回开花你不知道香的浓淡，把自己熏得晕乎乎的。
      - id: pfb_f_09
        text: 雨打在花瓣上你心疼了半天，使劲把花翻过去挡着。
      - id: pfb_f_10
        text: 有只小虫子在你花心里筑了窝，你由着它，谁也没赶。
      - id: pfb_f_11
        text: 你把根里的养分一股脑往花上送，开出了一整季最好的颜色。
      - id: pfb_f_12
        text: 头一朵花开得歪歪扭扭，你自己看着都觉得好笑。
      - id: pfb_f_13
        text: 月光照在花瓣上，你头一回觉得夜里比白天还亮堂。
      - id: pfb_f_14
        text: 你偷偷把花朝路边的方向伸了伸，想让人也瞧见。
      - id: pfb_f_15
        text: 花谢了你不难过，你知道明年还会再开，这就够了。
  plant_root_spread:
    fallback:
      - id: prs_f_01
        text: 你的根往地底探了探，碰着一块湿泥，高兴地往里钻。
      - id: prs_f_02
        text: 根须越伸越远，你摸到了地下的一股暗流，凉丝丝的。
      - id: prs_f_03
        text: 隔壁老树的根拦住了你的去路，你拐了个弯，绕了过去。
      - id: prs_f_04
        text: 你把根扎进石缝里，疼是疼，可站得更稳了。
      - id: prs_f_05
        text: 这片{place}的土松软，你的根走得畅快，一夜间伸出去老远。
      - id: prs_f_06
        text: 你和旁边的草交换了养分，根须碰了碰，算是打了招呼。
      - id: prs_f_07
        text: 一条蚯蚓从你的根边钻过，你痒得叶片直颤。
      - id: prs_f_08
        text: 根扎深了，你头一回觉得风吹过来不那么晃了。
      - id: prs_f_09
        text: 你把多余的根须收了回来，养料要省着些用。
      - id: prs_f_10
        text: 地下黑漆漆的，你凭着根须一点点摸索出地盘的大小。
      - id: prs_f_11
        text: 你的根碰着了一截朽木，朽木里的灵质又甜又醇。
      - id: prs_f_12
        text: 大旱时你的根往深处钻，钻了许久才摸着一丝湿气。
      - id: prs_f_13
        text: 你把根和邻近的同族缠在一起，大风来了也不怕倒。
      - id: prs_f_14
        text: 根须探到地下水源时你浑身一颤，像喝了一大口凉水。
      - id: prs_f_15
        text: 你在地下织了一张网，每一根须都是你的触角。
  plant_pollination:
    fallback:
      - id: ppl_f_01
        text: 蜜蜂把你和远处的花连在了一起，你头一回觉得世界变小了。
      - id: ppl_f_02
        text: 风把花粉吹了老远，你不知道它落在了哪里，心里有些期待。
      - id: ppl_f_03
        text: 一只蝴蝶停了好久，翅膀上沾了你的花粉，飞起来金灿灿的。
      - id: ppl_f_04
        text: 你把花粉酿得格外香，风一来就使劲往外送。
      - id: ppl_f_05
        text: 往年{place}的蜂群今年来得早，你赶紧把花打开，怕错过了时辰。
      - id: ppl_f_06
        text: 你嫌弃风把花粉吹到了泥里，心疼了半天。
      - id: ppl_f_07
        text: 头回授粉你不知轻重，把花瓣都抖落了几片。
      - id: ppl_f_08
        text: 你和旁边那株花约好，让蜜蜂把两家连在一处。
      - id: ppl_f_09
        text: 一只小甲虫爬了半天才爬上来，你耐心等它吃饱了再走。
      - id: ppl_f_10
        text: 授粉季你忙得花瓣都耷拉了，可心里是满足的。
      - id: ppl_f_11
        text: 你发现结的果子比往年多，想着是今年花粉送得远的缘故。
      - id: ppl_f_12
        text: 一阵急雨冲走了花粉，你只好再攒力气，等下一阵风。
      - id: ppl_f_13
        text: 你偷偷多留了些花粉，想着往后日子还长，得省着。
      - id: ppl_f_14
        text: 鸟落在枝头啄了你的花粉，你没恼，由着它。
      - id: ppl_f_15
        text: 授粉那几日风好日头也好，你觉得明年的果子稳了。
  plant_deep_root:
    fallback:
      - id: pdr_f_01
        text: 你的根碰着了灵脉，一股暖流顺着须根涌了上来。
      - id: pdr_f_02
        text: 灵脉像地底的一条暗河，你扎进去，浑身都暖了。
      - id: pdr_f_03
        text: 你小心翼翼地吸取灵脉的灵质，生怕贪多了伤着根。
      - id: pdr_f_04
        text: 触到灵脉的那一刻你浑身发颤，像被一双手托住了。
      - id: pdr_f_05
        text: 这里{place}的灵脉不深，你探了很久才摸着，值了。
      - id: pdr_f_06
        text: 你把根须沿着灵脉的走向铺开，一点点汲取。
      - id: pdr_f_07
        text: 灵脉的灵质太浓，你不敢多吸，缩回了一些根须。
      - id: pdr_f_08
        text: 扎深根时你碰着了一块灵石，硬邦邦的却带着温度。
      - id: pdr_f_09
        text: 吸了灵脉的灵质，你的叶子一夜之间绿得发亮。
      - id: pdr_f_10
        text: 你把多余的灵质让给了旁边的小苗，自己留了刚刚够。
      - id: pdr_f_11
        text: 扎根太深你有些怕，不知道底下的灵脉通向哪里。
      - id: pdr_f_12
        text: 灵脉一颤，你跟着抖了抖叶子，像地底打了个哈欠。
      - id: pdr_f_13
        text: 你顺着灵脉走了很远，根须比枝叶伸展得还远。
      - id: pdr_f_14
        text: 触到灵脉后你安静了许久，像听见了大地的心跳。
      - id: pdr_f_15
        text: 扎深根的那年你没开很多花，却长得格外结实。
  plant_wither_cycle:
    fallback:
      - id: pwc_f_01
        text: 秋风一吹你的叶子黄了一片，你不慌，这是老规矩了。
      - id: pwc_f_02
        text: 你把叶子一片片收回来，养分归到根里，等着过冬。
      - id: pwc_f_03
        text: 枯萎的叶子落了一地，你觉着像给自己盖了床被子。
      - id: pwc_f_04
        text: 到了{place}的冬天来得早，你早早缩了枝，把力气藏好。
      - id: pwc_f_05
        text: 剩最后一根枝子时你抖了抖，像睡前最后叹了一口气。
      - id: pwc_f_06
        text: 枯着枯着你就习惯了，知道枯完就会再绿，没什么好怕。
      - id: pwc_f_07
        text: 雪压在光秃的枝头，你不觉得冷，根里有暖意撑着。
      - id: pwc_f_08
        text: 你把旧年的伤疤也一起枯掉了，来年就是新的枝。
      - id: pwc_f_09
        text: 旁边的小苗头一回枯萎有些慌，你抖了抖枝子告诉它没事。
      - id: pwc_f_10
        text: 枯荣这件事你做了许多回，每一回都像睡了一场长觉。
      - id: pwc_f_11
        text: 你把最后一点绿藏在树皮底下，留着开春时第一口用。
      - id: pwc_f_12
        text: 枯了以后风灌进枝丫里呼呼响，你听着听着就静了。
      - id: pwc_f_13
        text: 今年枯得比往年早些，你想是灵脉吸得多了，得歇歇。
      - id: pwc_f_14
        text: 你看着满地枯叶，想着它们明年都会变成泥，变成你。
      - id: pwc_f_15
        text: 枯到只剩根的时候，你反而踏实，活着的就是这口气。
  plant_seed_scatter:
    fallback:
      - id: pss_f_01
        text: 你把最饱满的种子交给风，看它打着旋飘远了。
      - id: pss_f_02
        text: 一只鸟啄走了你的种子，你不恼，知道它会替你走得远。
      - id: pss_f_03
        text: 你把种子抖落在脚边的泥里，想着挨得近也好，有个伴。
      - id: pss_f_04
        text: 这回{place}的风大，你的种子飘过了两条溪才落下。
      - id: pss_f_05
        text: 你把种子分成了几份，有给风的，有给水的，有给鸟的。
      - id: pss_f_06
        text: 头回播撒种子你有些不舍，攥在枝头晃了半天才松开。
      - id: pss_f_07
        text: 你挑了向阳的那面坡，把种子轻轻弹了过去。
      - id: pss_f_08
        text: 有一粒种子落在石缝里，你替它担心，又觉得它会自己想办法。
      - id: pss_f_09
        text: 你把最后一粒种子留在身边，留着做来年的指望。
      - id: pss_f_10
        text: 风停了你又等了等，把剩下的种子晃进了泥里。
      - id: pss_f_11
        text: 雨水冲着你的种子往下游去，你不知它们会落在哪。
      - id: pss_f_12
        text: 你把最甜的果子留给松鼠，种子就随它埋哪算哪。
      - id: pss_f_13
        text: 撒完种子你空了，枝头轻飘飘的，心里却踏实。
      - id: pss_f_14
        text: 你望着种子飘走的方向，那些地方你到不了，它们能替你去。
      - id: pss_f_15
        text: 播完最后一粒你抖了抖枝子，今年的活儿算是干完了。

  # ── 真菌妖专属事件（5 个，每个 15 fallback）──
  fungus_spore_burst:
    fallback:
      - id: fsb_f_01
        text: 你鼓了鼓伞盖，第一阵孢子像一阵轻烟飘了出去。
      - id: fsb_f_02
        text: 孢子喷出来的那一刻你吓了一跳，没想到自己能飞那么远。
      - id: fsb_f_03
        text: 你使劲一弹，孢子飞过了整根朽木，落在那头的苔藓上。
      - id: fsb_f_04
        text: 头回喷孢子你没掌握好力道，喷了自己一脸，黏糊糊的。
      - id: fsb_f_05
        text: 这阵{place}的风一吹，你的孢子飘得比预想的远了好几倍。
      - id: fsb_f_06
        text: 你小心翼翼地裂开伞盖，孢子一缕缕飘出来，像呼吸一样。
      - id: fsb_f_07
        text: 旁边的老菌笑你喷得太急，说慢慢来，风会帮忙的。
      - id: fsb_f_08
        text: 你盯着飘远的孢子看，不知道它们会落在哪儿，会长成什么样。
      - id: fsb_f_09
        text: 第一回喷完你虚了一阵，伞盖软塌塌地耷拉了半天。
      - id: fsb_f_10
        text: 一只小虫路过沾了一身孢子，抖了半天才抖干净，你偷着乐。
      - id: fsb_f_11
        text: 你攒了三天才攒够一喷的量，喷出去那一下格外畅快。
      - id: fsb_f_12
        text: 孢子在阳光里金灿灿的，你头一回觉得自己也好看。
      - id: fsb_f_13
        text: 雨后的空气湿漉漉的，你挑了这个时辰喷，孢子飘得又远又稳。
      - id: fsb_f_14
        text: 你看见有一颗孢子落在好土上，心里替它高兴得紧。
      - id: fsb_f_15
        text: 喷完孢子你空了，可那空是一种满足的空，像卸了胆子。
  fungus_mycelium:
    fallback:
      - id: fmy_f_01
        text: 你的菌丝钻进朽木深处，一寸一寸地铺开，像在织一张网。
      - id: fmy_f_02
        text: 菌丝碰到隔壁同族的网，你们碰了碰，算是一起搭了伙。
      - id: fmy_f_03
        text: 你把菌丝往湿的方向伸，干的地方绕着走，你比谁都懂水汽。
      - id: fmy_f_04
        text: 菌丝越铺越远，你在地下摸到了一整片腐烂的林子，够吃好些年。
      - id: fmy_f_05
        text: 这片{place}的朽木多，你的菌丝走得畅快，一夜就铺了老远。
      - id: fmy_f_06
        text: 你把菌丝分了几路，一路寻水，一路寻木，一路留着保命。
      - id: fmy_f_07
        text: 菌丝碰到一块硬石拐了弯，你学会了绕，绕比顶管用。
      - id: fmy_f_08
        text: 你和树根的菌丝缠在了一起，分不清谁借了谁的力。
      - id: fmy_f_09
        text: 菌丝走过的地方木都酥了，你一边走一边吃，日子过得踏实。
      - id: fmy_f_10
        text: 你把最远的一根菌丝留作探子，它每探一步你都感觉得到。
      - id: fmy_f_11
        text: 有一条菌丝断了，你疼了一下，又从旁边另长了一条。
      - id: fmy_f_12
        text: 菌丝网越来越大，你觉着自己在地下也有一片天了。
      - id: fmy_f_13
        text: 你把多余的灵质顺着菌丝往远处送，给那些还没长开的小菌。
      - id: fmy_f_14
        text: 菌丝摸到地下的一截老根，根里的灵质又醇又厚，你高兴坏了。
      - id: fmy_f_15
        text: 铺了大半年的菌丝网忽然通了一整片，你说不出有多畅快。
  fungus_fruiting:
    fallback:
      - id: ffu_f_01
        text: 你在朽木上冒出了第一个子实体，圆鼓鼓的，自己看着都欢喜。
      - id: ffu_f_02
        text: 子实体撑开伞盖那一下，你抖了抖，像伸了个懒腰。
      - id: ffu_f_03
        text: 你把最好的养分都送到了子实体上，盼它长得壮实些。
      - id: ffu_f_04
        text: 那夜{place}的雨后你的子实体一夜冒了仨，你数了又数，没数错。
      - id: ffu_f_05
        text: 头回结子实体你不知深浅，长歪了一个，第二天又长了个正的。
      - id: ffu_f_06
        text: 你把子实体朝着阴凉的地方引，晒多了伞盖会裂，你知道。
      - id: ffu_f_07
        text: 旁边的小菌羡慕你结得早，你抖了抖伞盖说急不得。
      - id: ffu_f_08
        text: 子实体上的露珠滚来滚去，你觉得这是最好看的时候。
      - id: ffu_f_09
        text: 你结了三个子实体，一个留种子，两个留着吸灵质。
      - id: ffu_f_10
        text: 子实体刚成形时又嫩又脆，你缩着不敢碰，怕磕着。
      - id: ffu_f_11
        text: 一只蜗牛爬上你的子实体啃了一口，你疼得菌丝都缩了缩。
      - id: ffu_f_12
        text: 你把最大的子实体留到了秋后，等它熟透了好喷孢子。
      - id: ffu_f_13
        text: 子实体散发的气味引来了几只甲虫，你不赶，由着它们歇脚。
      - id: ffu_f_14
        text: 你结子实体那几日格外精神，菌丝网里的灵质都往这头涌。
      - id: ffu_f_15
        text: 伞盖完全撑开的那一刻你听见了风，知道该放孢子了。
  fungus_decompose:
    fallback:
      - id: fde_f_01
        text: 你贴上一截倒地的枯木，菌丝钻进去，一点点把朽木化成养分。
      - id: fde_f_02
        text: 枯木里的灵质又涩又甜，你吸一口缓一口，舍不得贪多。
      - id: fde_f_03
        text: 你把整根朽木化了三天三夜，化完以后自己胖了一圈。
      - id: fde_f_04
        text: 那片{place}林子里的落叶堆了厚厚一层，你钻进去慢慢消受。
      - id: fde_f_05
        text: 分解枯木时你摸到了里头残留的一点生灵气息，愣了半晌。
      - id: fde_f_06
        text: 你和同族一起分解一截大树根，各占一头，谁也不越界。
      - id: fde_f_07
        text: 枯木化到一半你歇了歇，菌丝也得喘口气。
      - id: fde_f_08
        text: 你把化出来的灵质分了一些给旁边刚冒头的小菌，自己留了大头。
      - id: fde_f_09
        text: 朽木化完以后变成了一捧软泥，你觉得这也是一种成全。
      - id: fde_f_10
        text: 你挑了最潮的那截木头下手，化起来格外顺，滋味也好。
      - id: fde_f_11
        text: 分解时你闻到了一股说不出的香，那是朽木深处的灵气。
      - id: fde_f_12
        text: 一只蜈蚣从朽木里钻出来跑了，你由它去，只管化你的木。
      - id: fde_f_13
        text: 你把枯叶一层层化开，每一层味道都不一样，你品得仔细。
      - id: fde_f_14
        text: 化完一根朽木你挪了挪窝，找下一根，日子就这么过。
      - id: fde_f_15
        text: 分解是你的本事，枯了的东西在你这儿还能再活一遭。
  fungus_dormancy:
    fallback:
      - id: fdo_f_01
        text: 天凉了，你把菌丝收了收，缩进朽木深处准备睡一觉。
      - id: fdo_f_02
        text: 你把伞盖收拢，子实体也缩了回去，像把自己叠好收进柜子。
      - id: fdo_f_03
        text: 休眠前你把最后一点灵质存到最深的菌丝里，留着开春用。
      - id: fdo_f_04
        text: 这年{place}的冬天长，你睡得也长，梦见自己长满了整座山。
      - id: fdo_f_05
        text: 你缩成一团，外面结了冰你也不怕，朽木里头还暖着。
      - id: fdo_f_06
        text: 休眠时你偶尔醒一醒，探一根菌丝出去看看春天来了没。
      - id: fdo_f_07
        text: 你把菌丝网缩到最小，只留着最粗的几根主脉撑着。
      - id: fdo_f_08
        text: 旁边的小菌问你睡多久，你说不知道，醒了自己会知道。
      - id: fdo_f_09
        text: 休眠的日子像一坛封了口的酒，你不急，等着慢慢酿。
      - id: fdo_f_10
        text: 你在朽木最深处蜷着，外头的风雪一概不知，安安稳稳。
      - id: fdo_f_11
        text: 睡了不知多久你梦见一朵花开了，醒来才想起自己不会开花。
      - id: fdo_f_12
        text: 休眠时你梦见菌丝铺到了海底，醒来觉得好笑。
      - id: fdo_f_13
        text: 你把伞盖的最后一丝灵质也收回菌丝，轻手轻脚地睡了。
      - id: fdo_f_14
        text: 这一觉你睡得分外沉，连隔壁朽木塌了都没醒。
      - id: fdo_f_15
        text: 休眠前你望了望外头的天，想着醒来时该是春天了。

  # ── 灵体妖专属事件（5 个，每个 15 fallback）──
  spirit_first_manifest:
    fallback:
      - id: sfm_f_01
        text: 你第一次从虚无里凝出一个轮廓，像一团雾慢慢有了边。
      - id: sfm_f_02
        text: 你低头看自己，半透明的，风一吹就散了一角，你赶紧拢了拢。
      - id: sfm_f_03
        text: 你鼓起勇气飘到水面上，水里映出一个模模糊糊的影子，那就是你。
      - id: sfm_f_04
        text: 那夜{place}的月光落在你身上，你第一次觉得看得见自己了。
      - id: sfm_f_05
        text: 你试着让自己亮一点，灵质在体内转了一圈，指尖冒出一星微光。
      - id: sfm_f_06
        text: 你飘过一只睡着的猫，猫耳朵动了动，你高兴得浑身发光。
      - id: sfm_f_07
        text: 头回显形你撑了不到半刻就散了，累得在树洞里歇了一整天。
      - id: sfm_f_08
        text: 你学着把灵质往身上聚，聚着聚着轮廓就清楚了些。
      - id: sfm_f_09
        text: 一阵风把你吹得歪歪扭扭，你抓住一根树枝才稳住。
      - id: sfm_f_10
        text: 你小心翼翼地摸了摸一片叶子，叶子凉丝丝的，你高兴了好久。
      - id: sfm_f_11
        text: 你试着发出声音，喉咙里只挤出一声细弱的嗡鸣，像蚊子叫。
      - id: sfm_f_12
        text: 夜里你亮着微光飘来飘去，觉得自己像一盏会走路的小灯笼。
      - id: sfm_f_13
        text: 你模仿人的样子站着，腿怎么也合不拢，飘得像水草。
      - id: sfm_f_14
        text: 你第一次被别人看见，那人愣了愣，你吓得当场散了形。
      - id: sfm_f_15
        text: 显形成功那晚你绕着{place}飞了一圈，风在耳边呼呼地响。
  spirit_attach:
    fallback:
      - id: sat_f_01
        text: 你把自己缠在一块老石头上，石头凉，你却觉得有了根。
      - id: sat_f_02
        text: 你选了一棵歪脖子树附着，树里的灵质缓缓流进你，暖暖的。
      - id: sat_f_03
        text: 你贴在{place}的一口古井壁上，井水倒映着你模模糊糊的脸。
      - id: sat_f_04
        text: 地缚的滋味不好受，你挣了挣，发现走不远，只好认了。
      - id: sat_f_05
        text: 你把灵质渗进老墙的砖缝里，墙成了你的身子，你成了墙的魂。
      - id: sat_f_06
        text: 附着以后你听得见这地方所有的动静，吵，却也不孤单。
      - id: sat_f_07
        text: 你缠着一块墓碑，碑上的字你认了好久，是一个你不认识的名字。
      - id: sat_f_08
        text: 你试着从附着物上探出去一点，像一根藤蔓伸出墙头。
      - id: sat_f_09
        text: 老树吸收你的灵质，你也吸老树的，谁也说不清谁占了便宜。
      - id: sat_f_10
        text: 你附在一盏旧灯笼上，夜里发着微光，路过的人都当是风。
      - id: sat_f_11
        text: 地缚让你与这片土地连在了一起，你的喜怒都和这地方绑着。
      - id: sat_f_12
        text: 你贴在井底听上面打水的人说话，听了一整年，把村里的事都听全了。
      - id: sat_f_13
        text: 附着久了你的形状越来越像那块石头，棱角都长了。
      - id: sat_f_14
        text: 你试着换一个附着物，挪了半天才挪了一丈远，累得散了形。
      - id: sat_f_15
        text: 你在附着的老树上刻了一道痕，算是给自己留了个记号。
  spirit_drift:
    fallback:
      - id: sdr_f_01
        text: 你从地缚中挣脱，随风飘起来，第一次觉得天地大得没有边。
      - id: sdr_f_02
        text: 你顺着{place}的风飘过山头，山那头的景你从没见过。
      - id: sdr_f_03
        text: 你白天藏在云里，夜里才敢下来飘，怕被人瞧见。
      - id: sdr_f_04
        text: 你漂在河面上，跟着水流走了半座城，水声哗哗地陪着你。
      - id: sdr_f_05
        text: 游荡的日子自由，也空，你有时想找个地方停下来歇歇。
      - id: sdr_f_06
        text: 你飘过一户人家的窗，里头灯火暖黄，你停了一会儿才走。
      - id: sdr_f_07
        text: 你在林子里遇见另一只游灵，它朝你点了点头，又各自飘远了。
      - id: sdr_f_08
        text: 你试着让自己沉到地面，脚尖刚碰着土就弹了起来，像水上的浮萍。
      - id: sdr_f_09
        text: 风大的时候你被吹得翻了好几个跟头，停下来时已在百里之外。
      - id: sdr_f_10
        text: 你飘在集市上空，看着底下的烟火气，心里说不出的滋味。
      - id: sdr_f_11
        text: 你跟着一只候鸟飞了半座山，鸟回头啄了你一口，你笑得散了形。
      - id: sdr_f_12
        text: 你在夜里发光飘过田野，农人以为是鬼火，吓得往家跑。
      - id: sdr_f_13
        text: 你飘进了{place}的一座庙，庙里的香火让你浑身舒泰。
      - id: sdr_f_14
        text: 游荡久了你学会辨别风的方向，想去哪儿就搭哪阵风。
      - id: sdr_f_15
        text: 你停在一片湖面上，月光把你的影子投在水里，你看了很久。
  spirit_possession:
    fallback:
      - id: spo_f_01
        text: 你试着附在一只麻雀身上，翅膀扑棱了几下，你高兴得差点散了形。
      - id: spo_f_02
        text: 附身后你借用那人的眼睛看了一眼世界，颜色比你以为的多。
      - id: spo_f_03
        text: 你小心地控制那人的手，拿起一只碗又放下，像学走路的孩子。
      - id: spo_f_04
        text: 附身太久你怕伤着宿主，撑了一刻就退了出来，累得发虚。
      - id: spo_f_05
        text: 那日{place}的猎人被你附了一瞬，手一抖箭射偏了，你内疚了好久。
      - id: spo_f_06
        text: 你附在一只猫身上走了一段路，猫的脚掌软乎乎的，你觉得好玩。
      - id: spo_f_07
        text: 附身时你听见了宿主的心跳，咚咚咚的，比你的灵质还稳。
      - id: spo_f_08
        text: 你在一个人梦里附了身，替他把噩梦赶跑了，没让他知道。
      - id: spo_f_09
        text: 你试着附在一棵树上，树没动，你倒是觉得根扎进了土里。
      - id: spo_f_10
        text: 附身后你说了一句话，声音是别人的，话却是你的。
      - id: spo_f_11
        text: 宿主察觉了你，没有怕，反而问你是谁，你愣了半晌没答。
      - id: spo_f_12
        text: 你附在一只老狗身上晒了半天太阳，老狗的梦里都是暖的。
      - id: spo_f_13
        text: 附身时你帮宿主多走了一里路，他以为是自己腿好了。
      - id: spo_f_14
        text: 你退出来的时候宿主打了个寒颤，你轻轻说了一声对不起。
      - id: spo_f_15
        text: 短暂附身以后你对做"人"这件事有了点说不清的理解。
  spirit_dissolve:
    fallback:
      - id: sdi_f_01
        text: 你的轮廓越来越淡，风一吹就散了一片，你也没力气拢了。
      - id: sdi_f_02
        text: 灵质一缕缕飘散，你看着自己变薄，心里却出奇地平静。
      - id: sdi_f_03
        text: 你最后一次飘过{place}，灯火还是暖的，你笑了一下。
      - id: sdi_f_04
        text: 你把自己最后一缕灵质送给了那棵陪伴你的老树，算是一点心意。
      - id: sdi_f_05
        text: 散开以后你融进了风里，风带着你走了很远很远。
      - id: sdi_f_06
        text: 你对那只你附过身的猫说了声再见，猫喵了一声，像听懂了。
      - id: sdi_f_07
        text: 你的声音越来越轻，最后只剩风里一点嗡嗡的回响。
      - id: sdi_f_08
        text: 你望着月亮，月光穿过你，地上没有了影子，你知道时候到了。
      - id: sdi_f_09
        text: 散开的瞬间你想起第一次显形那个夜晚，月亮也是这么圆。
      - id: sdi_f_10
        text: 你把记忆一点一点放下，像把旧衣裳一件件叠好收起。
      - id: sdi_f_11
        text: 你飘到最高的云上，看着底下的山河，觉得这一遭没白走。
      - id: sdi_f_12
        text: 你融进了一阵春雨里，落在了{place}的每一片叶子上。
      - id: sdi_f_13
        text: 你的灵质化成了一团微光，像萤火虫一样在夜里飘了一会儿。
      - id: sdi_f_14
        text: 散尽之前你最后亮了一下，比这辈子任何时候都亮。
      - id: sdi_f_15
        text: 你化作一缕风穿过林子，树叶子沙沙地响，像在送你一程。

  # ── 器物妖专属事件（4 个，每个 15 fallback）──
  painted_first_fold:
    fallback:
      - id: pff_f_01
        text: 画师的笔尖点了一下你的眼睛，你眨了眨，第一次看见了光。
      - id: pff_f_02
        text: 你从纸上慢慢折起身子，墨迹还没干透，动起来有些黏。
      - id: pff_f_03
        text: 你低头看自己，四肢是画的，衣裳也是画的，你抖了抖纸边。
      - id: pff_f_04
        text: 画师吹了口气，你就这么立在了桌面上，歪歪扭扭的。
      - id: pff_f_05
        text: 这时{place}的窗外有风，你怕被吹跑，紧紧抓着砚台边沿。
      - id: pff_f_06
        text: 你试着走了两步，脚底是纸的，在桌面上滑得站不稳。
      - id: pff_f_07
        text: 你摸了摸自己的脸，墨迹还有点潮，指尖沾了一点黑。
      - id: pff_f_08
        text: 画师笑着把一滴墨弹到你手心，你一握，手里就多了个墨团。
      - id: pff_f_09
        text: 你第一次弯腰折了一下身子，纸发出脆响，你吓了一跳。
      - id: pff_f_10
        text: 你在砚台边照了照自己，墨面里映出一个扁扁的小人。
      - id: pff_f_11
        text: 画师把你的角折得太尖，你顶着走了一天，才慢慢磨圆了些。
      - id: pff_f_12
        text: 你抖了抖身上的褶皱，画师画的衣纹跟着一颤一颤的。
      - id: pff_f_13
        text: 你第一次从画纸上下来，脚踩着桌面，觉得世界比纸大太多了。
      - id: pff_f_14
        text: 画师在你手心画了朵花，你翻来覆去看了半天，舍不得合掌。
      - id: pff_f_15
        text: 你试着发声，喉咙里挤出的却是纸张摩擦的窸窣声。
  painted_master_bond:
    fallback:
      - id: pmb_f_01
        text: 画师熬夜作画时你守在砚台边，替他研墨研到胳膊发酸。
      - id: pmb_f_02
        text: 他偶尔对着你叹气，你听不懂，只把纸边往他手边挪了挪。
      - id: pmb_f_03
        text: 画师把最后一口茶留给你，你喝不了，只是凑过去闻了闻。
      - id: pmb_f_04
        text: 你替画师撑着画轴，纸太长，你从这头跑到那头，累得折了角。
      - id: pmb_f_05
        text: 那夜{place}的夜里画师睡着了，你替他把没盖的墨盒盖好。
      - id: pmb_f_06
        text: 画师心情好时会在你身上补两笔，你觉着那是世上最暖的事。
      - id: pmb_f_07
        text: 他把你的名字写在画角，你看着那两个字，觉得自己有了根。
      - id: pmb_f_08
        text: 画师生病那几日你寸步不离，研墨递水，忙得纸边都磨毛了。
      - id: pmb_f_09
        text: 他把你从画纸上揭下来时你疼了一下，却觉得离他更近了。
      - id: pmb_f_10
        text: 画师教你认字，你学得慢，他也不急，一笔一画描给你看。
      - id: pmb_f_11
        text: 你把窗外的花折了一朵放在他笔洗边，他醒来笑了好久。
      - id: pmb_f_12
        text: 画师出远门你守着空屋子，把桌上的灰擦了又擦。
      - id: pmb_f_13
        text: 他回来时你从笔架上跳下来，纸边都翘了，他把你抚平。
      - id: pmb_f_14
        text: 画师老说你比真人还贴心，你不知道贴心是什么，只知道想陪着他。
      - id: pmb_f_15
        text: 夜里你蜷在他手边，听着他的呼吸，觉得这就是你活着的样子。
  painted_ink_renew:
    fallback:
      - id: pir_f_01
        text: 你身上的墨迹淡了，画师重新描了一遍，你觉着像换了一件衣裳。
      - id: pir_f_02
        text: 纸身磨薄了一角，你找了张旧宣纸补上，粘得歪歪扭扭。
      - id: pir_f_03
        text: 画师用上好的松烟墨给你补色，墨一上你整个人精神了一截。
      - id: pir_f_04
        text: 你把脱线的纸边一根根理好，用浆糊一点点粘回去。
      - id: pir_f_05
        text: 那阵{place}的潮气把你的纸身泡软了，你在日头下晒了半天才硬朗。
      - id: pir_f_06
        text: 你学着画师的样子给自己补了两笔，手抖，画歪了一道。
      - id: pir_f_07
        text: 补墨的时候你疼了一下，墨渗进纸纹里，凉丝丝的。
      - id: pir_f_08
        text: 你把磨损的角剪齐，重新折了一个，比原来还精神。
      - id: pir_f_09
        text: 画师不在时你自己研墨，研了一下午，墨太浓糊了一脸。
      - id: pir_f_10
        text: 你在身上补了一朵新花，比画师画得糙，却是你自己添的。
      - id: pir_f_11
        text: 纸身裂了一道口子，你贴了条纸条当补丁，走起来哗啦响。
      - id: pir_f_12
        text: 补完墨你在水面照了照，觉得比从前还好看些。
      - id: pir_f_13
        text: 画师给你换了新纸底，你从旧身子挪到新身子，轻了好几分。
      - id: pir_f_14
        text: 你把褪色的衣纹重新描深，每一笔都描得格外仔细。
      - id: pir_f_15
        text: 修好以后你转了个圈，纸边哗啦啦响，你觉得又活过来了。
  painted_fading:
    fallback:
      - id: pfa_f_01
        text: 你身上的墨迹一点一点淡下去，像被岁月一点点擦去。
      - id: pfa_f_02
        text: 纸身发黄发脆，你动一下就掉纸屑，你学轻了脚步。
      - id: pfa_f_03
        text: 画师的字在你身上模糊了，你摸了又摸，想记住每一笔。
      - id: pfa_f_04
        text: 那天{place}的阳光照着你，你半透明的，能看见后面的影子。
      - id: pfa_f_05
        text: 你最后一次替画师研墨，手抖得墨汁洒了一桌。
      - id: pfa_f_06
        text: 画师老早就走了，你守着他留下的笔，纸身一年比一年薄。
      - id: pfa_f_07
        text: 你把身上最后一朵清楚的花看了又看，那是画师最后补的。
      - id: pfa_f_08
        text: 你不再出门，怕风把你吹散，只在屋里慢慢走。
      - id: pfa_f_09
        text: 纸边碎了一片，你拾起来拼了拼，终究拼不回原样。
      - id: pfa_f_10
        text: 你想起第一次从画纸上折起身子那天的光，和今天的一样亮。
      - id: pfa_f_11
        text: 你把自己最后一点墨色留在了画师的旧笔上，算是个念想。
      - id: pfa_f_12
        text: 你坐在砚台边，墨干了，你也快干了，心里倒不难过。
      - id: pfa_f_13
        text: 你把名字描了最后一遍，手抖得字都歪了，可你还是描完了。
      - id: pfa_f_14
        text: 纸身轻轻飘起一角，你由它飘着，像在跟你告别。
      - id: pfa_f_15
        text: 你最后变成桌上一片薄薄的纸，风一吹，散进了窗外的光里。

  scene_forest_forage:
    fallback:
      - id: sff_f_01
        text: 你在林间翻找灵草，露水把袖口浸得透湿。
      - id: sff_f_02
        text: 晨雾未散，你循着灵气钻进一片老藤深处。
      - id: sff_f_03
        text: 一株灵芝长在朽木上，你采下来，指间还沾着木屑。
      - id: sff_f_04
        text: 你学松鼠埋灵果，半日只寻到三颗，手却被荆棘划破。
      - id: sff_f_05
        text: 溪边有株会发光的苔，你俯身看了许久，才小心取走。
      - id: sff_f_06
        text: 你在山径上遇见同来的小妖，交换了各自的灵草。
      - id: sff_f_07
