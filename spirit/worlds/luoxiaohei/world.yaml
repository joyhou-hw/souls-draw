# 罗小黑世界包 v0.3 —— M2 全量世界（16 块 + events/scenes/shocks 三事件池）
# 权威：01-人生模拟框架设计文档.md §4.3/§7；03-世界观对比与合并方案.md §5/§6
# T2.7 已校准：出生形态妖精体验主导（02 §3.6 案例池派生，人类 0.25 演示底线）+ hazard 曲线软化（02 §3.2 妖精寿长）
name: 罗小黑世界
tickName: 年
startTick: 0
endTick: 300
initAttrs:
  liquality: 100
  health: 80
  wealth: 10
deathModel: liquality_balance

# ── 基础事件池（时代日常 + 修行线 + 灵力阶梯突破链 + 夺灵）──
events:
  - id: quiet_year
    label: 平静的一年
    weight: 8
    cooldownTicks: 2
    effects:
      liquality: 1
      health: 1

  - id: liqi_drain
    label: 灵质损耗的一年
    weight: 2
    cooldownTicks: 3
    cond:
      minTick: 6
    effects:
      liquality: -3

  - id: liqi_feast
    label: 觅得灵质丰美之地
    weight: 1.5
    cooldownTicks: 5
    cond:
      minTick: 6
    effects:
      liquality: 6

  - id: mortal_labor
    label: 营生奔波的一年
    weight: 4
    cooldownTicks: 2
    cond:
      minTick: 16
      excludeFlags: [rooted, intangible]
    effects:
      health: -2
      wealth: 5

  - id: beast_conflict
    label: 与妖兽的冲突
    weight: 1.5
    cooldownTicks: 3
    cond:
      minTick: 12
    effects:
      health: -8
      liquality: -5

  - id: guild_recruit
    label: 会馆招募（抉择点）
    weight: 2
    once: true
    cond:
      flags: [liqi_manifest]
      minTick: 8
      maxTick: 24
      excludeFlags: [home:rich_land]
    choice:
      prompt: 会馆妖精师向你伸出橄榄枝。加入会馆吗？
      options:
        - label: 加入会馆
          desc: 资源与人脉，规矩与庇护
          effects:
            liquality: 5
            wealth: 10
          gainFlags:
            - org:guild_registered
          grainShifts:
            rooted_vs_drifting: 1
            kin_vs_recluse: 1
            order_vs_radical: 1
        - label: 婉拒
          desc: 自由身，风雨自担
          effects:
            liquality: 2
          grainShifts:
            rooted_vs_drifting: -1
            coexist_vs_solo: -1

  - id: witness_exile
    label: 目睹妖精被驱逐（抉择点）
    weight: 2
    once: true
    cond:
      flags: [region:city]
      minTick: 6
      excludeFlags: [form:human]
    choice:
      prompt: 城郊的同类被强制迁离，求助的目光落在你身上。怎么做？
      options:
        - label: 暗中相助
          desc: 藏起 TA，分一口灵气
          effects:
            liquality: 4
            health: -3
          grainShifts:
            kin_vs_recluse: 1
            coexist_vs_solo: 1
        - label: 袖手旁观
          desc: 自身难保，不敢惹麻烦
          effects:
            liquality: -2
          grainShifts:
            coexist_vs_solo: -1
            kin_vs_recluse: -1

