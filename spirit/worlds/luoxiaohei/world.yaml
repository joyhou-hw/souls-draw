    label: 丰美灵地的前路抉择
    weight: 1.5
    once: true
    cond:
      minTick: 15
      excludeFlags: [rooted, intangible, org:guild_registered]
    choice:
      prompt: 一处灵质丰美的山林愿意收留你，但需交出积蓄安家。去吗？
      options:
        - label: 驻留灵地
          desc: 安顿，扎根
