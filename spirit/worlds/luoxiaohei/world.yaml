# ── 死亡规则（灵质收支表 01 §7.3；T2.7 校准：hazard 曲线软化，妖精寿长于人类 02 §3.2）──
# 形态独立寿命曲线：每种形态用 bands 完全覆盖全局曲线
# 人类 ~80-100 岁；动物妖 ~150-200 岁；植物妖 ~200-280 岁；真菌妖 ~180-250 岁
# 灵体妖 ~220-300 岁；器物妖 ~150-220 岁
# 修行者额外延寿：cultivatorMultiplier 0.5（hazard 减半）
deathRule:
  bands:
    - { fromTick: 0, hazard: 0.003 }
    - { fromTick: 40, hazard: 0.006 }
    - { fromTick: 80, hazard: 0.015 }
    - { fromTick: 100, hazard: 0.03 }
    - { fromTick: 130, hazard: 0.08 }
  attrDeath:
    attr: health
    below: 1
  attrMod:
    attr: liquality
    below: 20
    multiplier: 2
  cultivatorMultiplier: 0.35
  forms:
    human:
      bands:
        - { fromTick: 0, hazard: 0.002 }
        - { fromTick: 50, hazard: 0.006 }
        - { fromTick: 70, hazard: 0.015 }
        - { fromTick: 85, hazard: 0.04 }
        - { fromTick: 100, hazard: 0.10 }
    animal_yao:
      bands:
        - { fromTick: 0, hazard: 0.001 }
        - { fromTick: 60, hazard: 0.002 }
        - { fromTick: 100, hazard: 0.005 }
        - { fromTick: 150, hazard: 0.012 }
        - { fromTick: 200, hazard: 0.04 }
        - { fromTick: 250, hazard: 0.08 }
    plant_yao:
      bands:
        - { fromTick: 0, hazard: 0.0005 }
        - { fromTick: 100, hazard: 0.0015 }
        - { fromTick: 180, hazard: 0.004 }
        - { fromTick: 250, hazard: 0.012 }
        - { fromTick: 300, hazard: 0.05 }
    fungus_yao:
      bands:
        - { fromTick: 0, hazard: 0.0008 }
        - { fromTick: 80, hazard: 0.002 }
        - { fromTick: 150, hazard: 0.005 }
        - { fromTick: 200, hazard: 0.012 }
        - { fromTick: 260, hazard: 0.05 }
    spirit_yao:
      bands:
        - { fromTick: 0, hazard: 0.0003 }
        - { fromTick: 100, hazard: 0.001 }
        - { fromTick: 200, hazard: 0.003 }
        - { fromTick: 280, hazard: 0.012 }
        - { fromTick: 320, hazard: 0.05 }
    painted_yao:
      bands:
        - { fromTick: 0, hazard: 0.001 }
        - { fromTick: 80, hazard: 0.003 }
        - { fromTick: 120, hazard: 0.007 }
        - { fromTick: 180, hazard: 0.02 }
        - { fromTick: 230, hazard: 0.05 }

