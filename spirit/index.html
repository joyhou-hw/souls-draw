<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生灵引 · 罗小黑战记</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #14171c; color: #dfe6ee; }
      #nav { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #2a2f38; }
      button { padding: 8px 14px; border: 1px solid #2a2f38; border-radius: 6px; background: #232a34; color: #dfe6ee; cursor: pointer; }
      button:hover { border-color: #4a5468; }
      button.primary { background: #2f6f8f; border-color: #2f6f8f; }
      #nav button.active { background: #2f6f8f; border-color: #2f6f8f; }
      #app { padding: 16px; max-width: 720px; margin: 0 auto; }
      .muted { color: #8a93a3; }
      .card { background: #1b2028; border: 1px solid #2a2f38; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
      .card h3 { margin: 0 0 12px; font-size: 1.05rem; color: #9fc8e8; }
      .kv td { padding: 2px 12px 2px 0; }
      .kv td.k { color: #8a93a3; white-space: nowrap; }
      .pre-birth { color: #8a93a3; margin: 10px 0 0; padding-left: 20px; }
      .attrs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .chip { background: #232a34; border: 1px solid #2a2f38; border-radius: 999px; padding: 2px 10px; font-size: 0.85rem; }
      .log-stream { max-height: 340px; overflow-y: auto; border: 1px solid #2a2f38; border-radius: 6px; padding: 10px; background: #171b22; margin-bottom: 12px; }
      .log-line { display: flex; gap: 8px; padding: 3px 0; font-size: 0.92rem; }
      .log-line .age { color: #8a93a3; min-width: 3.5em; }
      .log-line.milestone .age, .log-line.milestone span:last-child { color: #e8c26a; }
      .picked { color: #7fd4a8; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .choice-card { border: 1px solid #4a6a8a; border-radius: 8px; padding: 12px; background: #1d2733; }
      .choice-prompt { font-weight: 600; margin: 0 0 10px; }
      .choice-opt { display: flex; justify-content: space-between; gap: 12px; width: 100%; margin-bottom: 8px; text-align: left; }
      .end-card { border: 1px solid #6a5a3a; border-radius: 8px; padding: 12px; background: #241f16; }
      .end-card h3 { color: #e8c26a; margin: 0 0 8px; }
      .review-list { padding-left: 20px; }
      .review-list li { margin: 2px 0; font-size: 0.92rem; }
      .import-box { margin-top: 12px; border: 1px dashed #3a414d; border-radius: 8px; padding: 12px; }
      .import-box textarea { width: 100%; height: 110px; background: #171b22; color: #dfe4ec; border: 1px solid #2a2f38; border-radius: 6px; padding: 8px; font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; box-sizing: border-box; resize: vertical; }
      .import-box .actions { margin-top: 8px; }
      .import-error { color: #e87a7a; margin: 6px 0 0; font-size: 0.9rem; }
      .save-actions { margin-top: 10px; opacity: 0.85; }
      .save-actions button { font-size: 0.85rem; padding: 4px 10px; }
      .share-text { white-space: pre-wrap; word-break: break-all; max-height: 280px; overflow-y: auto; background: #171b22; border: 1px solid #2a2f38; border-radius: 6px; padding: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 0.82rem; color: #b8c2d0; margin: 8px 0 0; }
      .progress-track { height: 14px; border-radius: 7px; background: #171b22; border: 1px solid #2a2f38; overflow: hidden; margin: 8px 0; }
      .progress-fill { height: 100%; background: linear-gradient(90deg, #2f6f8f, #4a9fbf); transition: width 0.2s; }
      .dist-section { margin-top: 16px; }
      .dist-section h4 { margin: 0 0 6px; color: #b8c2d0; }
      .bar-row { display: grid; grid-template-columns: 160px 1fr 130px; align-items: center; gap: 8px; padding: 2px 0; font-size: 0.9rem; }
      .bar-label { color: #dfe4ec; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar-track { height: 10px; border-radius: 5px; background: #171b22; overflow: hidden; }
      .bar-fill { height: 100%; background: #2f6f8f; border-radius: 5px; }
      .bar-val { color: #8a93a3; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <nav id="nav">
      <button data-screen="life" class="active">人生游玩</button>
      <button data-screen="board">批量看板</button>
    </nav>
    <main id="app"></main>
    <script type="module" src="/packages/web/src/main.ts"></script>
  </body>
</html>
